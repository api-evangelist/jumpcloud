tags:
- name: Policytemplates
paths:
  /policytemplates:
    x-functionalities-tags:
    - policy-templates
    get:
      description: 'This endpoint returns all policy templates.


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/policytemplates \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: policytemplates_list
      parameters:
      - $ref: '#/components/parameters/trait_fields_fields'
      - $ref: '#/components/parameters/trait_filter_filter'
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_sort_sort'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PolicyTemplate'
                type: array
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - x-api-key: []
      summary: Lists all of the Policy Templates
      tags:
      - Policytemplates
      x-scopes:
      - systems
      - systems.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/policytemplates?fields=SOME_ARRAY_VALUE&filter=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/policytemplates\"\n\nquerystring = {\"fields\":\"SOME_ARRAY_VALUE\",\"filter\":\"SOME_ARRAY_VALUE\",\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\",\"sort\":\"SOME_ARRAY_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/policytemplates?fields=SOME_ARRAY_VALUE&filter=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE'' -Method GET -Headers $headers'
  /policytemplates/{id}:
    parameters:
    - description: ObjectID of the Policy Template.
      in: path
      name: id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - policy-templates
    get:
      description: 'This endpoint returns a specific policy template.


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/policytemplates/{Policy_Template_ID}\

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: policytemplates_get
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyTemplateWithDetails'
      security:
      - x-api-key: []
      summary: Get a specific Policy Template
      tags:
      - Policytemplates
      x-scopes:
      - systems
      - systems.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url https://console.jumpcloud.com/api/v2/policytemplates/{id} \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/policytemplates/{id}\"\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/policytemplates/{id}'' -Method GET -Headers $headers'
components:
  schemas:
    Error:
      title: Error
      type: object
      x-examples: {}
      description: ''
      properties:
        code:
          format: int32
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Error message
        status:
          type: string
          description: HTTP status description
    OSRestriction:
      description: Contains OS properties to restrict the application of policies to devices based on the device's OS
      type: object
      examples:
      - with-apple-restrictions:
          osName: iPadOS
          earliestVersion: '14.1'
          deprecatedVersion: '16.2'
          appleRestrictions:
            requiresSupervision: false
            supportedEnrollmentTypes:
            - automated
            - device
            - user
      properties:
        osName:
          type: string
          description: The name of the OS in which this restriction applies
        earliestVersion:
          type: string
          description: The earliest version of the OS in which the policy can be applied
        isMdmRequired:
          type: boolean
          description: Boolean representing if the policy requires the device to be MDM enrolled
        deprecatedVersion:
          type: string
          description: The version of the OS in which the policy was deprecated
        supportedEnrollmentTypes:
          type: array
          description: This field is deprecated and will be ignored. Use appleRestrictions.supportedEnrollmentTypes instead
          x-deprecated: true
          items:
            type: string
            enum:
            - automated
            - device
            - user
        appleRestrictions:
          type: object
          description: The Apple specific restricitons for this policy, if there are any
          properties:
            requiresSupervision:
              type: boolean
              description: Boolean representing if the policy requires the Apple devices to be MDM supervised
            supportedEnrollmentTypes:
              type: array
              description: The supported Apple enrollment types for this policy
              items:
                type: string
                enum:
                - automated
                - device
                - user
    PolicyTemplateConfigField:
      title: PolicyTemplateConfigField
      type: object
      properties:
        defaultValue:
          description: The default value for this field.
          oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
            items: {}
          - type: 'null'
        displayOptions:
          description: The options that correspond to the display_type.
          type:
          - object
          - 'null'
        displayType:
          description: The default rendering for this field.
          enum:
          - checkbox
          - date
          - email
          - file
          - number
          - select
          - text
          - textarea
          - singlelistbox
          - doublelistbox
          - table
          - segmentedbutton
          - radio
          - copywell
          - timeinput
          - datepickerrange
          - multilist
          - paginationlist
          - searchandselect
          - datetimepicker
          - numberinline
          - objectstoragefile
          type: string
        id:
          description: ObjectId uniquely identifying a Policy Template Configuration Field
          type: string
        label:
          description: The default label for this field.
          type: string
        name:
          description: A unique name identifying this config field.
          type: string
        position:
          description: The default position to render this field.
          type: number
        readOnly:
          description: If an admin is allowed to modify this field.
          type: boolean
        required:
          description: If this field is required for this field.
          type: boolean
        sensitive:
          type: boolean
          description: Defines if the policy template config field is sensitive or not.
        validators:
          description: Descriptors to perform extended assertions on the supplied config field value.
          type:
          - object
          - 'null'
        tooltip:
          properties:
            template:
              type: string
            variables:
              properties:
                icon:
                  type: string
                message:
                  type: string
              type: object
          type:
          - object
          - 'null'
      required:
      - id
      - name
    PolicyTemplateWithDetails:
      description: The shallow information about a Policy Template.
      properties:
        activation:
          description: Requirements before the policy can be activated.
          type: string
        behavior:
          description: Specifics about the behavior of the policy.
          type: string
        configFields:
          description: An unordered list of all the fields that can be configured for this Policy Template.
          items:
            $ref: '#/components/schemas/PolicyTemplateConfigField'
          type: array
        description:
          description: The default description for the Policy.
          type: string
        displayName:
          description: The default display name for the Policy.
          type: string
        id:
          description: ObjectId uniquely identifying a Policy Template.
          type: string
        name:
          description: The unique name for the Policy Template.
          type: string
        osMetaFamily:
          enum:
          - linux
          - darwin
          - windows
          - ios
          - universal
          - android
          type: string
        osRestrictions:
          type: array
          items:
            $ref: '#/components/schemas/OSRestriction'
      title: PolicyTemplateWithDetails
      type: object
    PolicyTemplate:
      description: The shallow information about a Policy Template.
      title: PolicyTemplate
      type: object
      properties:
        activation:
          description: Requirements before the policy can be activated.
          type: string
        behavior:
          description: Specifics about the behavior of the policy.
          type: string
        deliveryTypes:
          description: The supported delivery mechanisms for this policy template.
          type: array
          items:
            type: string
            enum:
            - agent
            - mdm
            default: agent
        description:
          description: The default description for the Policy.
          type: string
        displayName:
          description: The default display name for the Policy.
          type: string
        id:
          description: ObjectId uniquely identifying a Policy Template.
          type: string
        name:
          description: The unique name for the Policy Template.
          type: string
        osMetaFamily:
          enum:
          - linux
          - darwin
          - windows
          - ios
          - universal
          - android
          type: string
        state:
          default: ''
          description: String describing the release status of the policy template.
          type: string
        alert:
          description: Text to describe any risk associated with this policy.
          type:
          - string
          - 'null'
        reference:
          description: URL to visit for further information.
          type:
          - string
          - 'null'
        osRestrictions:
          type: array
          items:
            $ref: '#/components/schemas/OSRestriction'
      x-examples:
        example-1:
          activation: string
          behavior: string
          deliveryTypes:
          - agent
          description: string
          displayName: string
          name: string
          osMetaFamily: linux
          state: ''
          alert: string
          reference: string
          osRestrictions:
          - osName: string
            earliestVersion: string
            deprecatedVersion: string
            supportedEnrollmentTypes:
            - automated
  parameters:
    trait_multiTenantRequestHeaders_x-org-id:
      description: Organization identifier that can be obtained from console settings.
      in: header
      name: x-org-id
      schema:
        type: string
    trait_filter_filter:
      description: 'A filter to apply to the query.


        **Filter structure**: `<field>:<operator>:<value>`.


        **field** = Populate with a valid field from an endpoint response.


        **operator** =  Supported operators are: eq, ne, gt, ge, lt, le, between, search, in.

        _Note: v1 operators differ from v2 operators._


        **value** = Populate with the value you want to search for. Is case sensitive. Supports wild cards.


        **EX:** `GET /api/v2/groups?filter=name:eq:Test+Group`'
      in: query
      name: filter
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        default: []
    trait_skip_skip:
      description: The offset into the records to return.
      in: query
      name: skip
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    trait_sort_sort:
      description: 'The comma separated fields used to sort the collection.

        Default sort is ascending, prefix with `-` to sort descending.

        '
      in: query
      name: sort
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        default: []
    trait_limit_limit:
      description: The number of records to return at once. Limited to 100.
      in: query
      name: limit
      schema:
        type: integer
        default: 10
    trait_fields_fields:
      description: 'The comma separated fields included in the returned records.

        If omitted, the default list of fields will be returned.

        '
      in: query
      name: fields
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        default: []
  securitySchemes:
    x-api-key:
      description: API key used to authenticate requests.
      in: header
      name: x-api-key
      type: apiKey
