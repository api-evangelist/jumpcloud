tags:
- name: Policy Group Members & Membership
paths:
  /policygroups/{group_id}/members:
    parameters:
    - description: ObjectID of the Policy Group.
      in: path
      name: group_id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - policy-groups
    - policy-members
    get:
      description: 'This endpoint returns the Policy members of a Policy Group.


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/policygroups/{GroupID}/members \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: graph_policyGroupMembersList
      parameters:
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GraphConnection'
                type: array
      security:
      - x-api-key: []
      summary: List the members of a Policy Group
      tags:
      - Policy Group Members & Membership
      x-scopes:
      - systems
      - systems.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/policygroups/{group_id}/members?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/policygroups/{group_id}/members\"\n\nquerystring = {\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/policygroups/{group_id}/members?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE'' -Method GET -Headers $headers'
    post:
      description: 'This endpoint allows you to manage the Policy members of a Policy Group.


        #### Sample Request

        ```

        curl -X POST https://console.jumpcloud.com/api/v2/policygroups/{GroupID}/members \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        "op": "add",

        "type": "policy",

        "id": "{Policy_ID}"

        }''

        ```'
      operationId: graph_policyGroupMembersPost
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphOperation-PolicyGroup-Member'
      responses:
        '204':
          description: OK
      security:
      - x-api-key: []
      summary: Manage the members of a Policy Group
      tags:
      - Policy Group Members & Membership
      x-scopes:
      - groups
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/policygroups/{group_id}/members \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '{\"id\":\"string\",\"op\":\"add\",\"attributes\":{},\"type\":\"policy\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/policygroups/{group_id}/members\"\n\npayload = {\n    \"id\": \"string\",\n    \"op\": \"add\",\n    \"attributes\": {},\n    \"type\": \"policy\"\n}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/policygroups/{group_id}/members'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"id":"string","op":"add","attributes":{},"type":"policy"}'''
  /policygroups/{group_id}/membership:
    parameters:
    - description: ObjectID of the Policy Group.
      in: path
      name: group_id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - policy-groups
    - policy-members
    get:
      description: 'This endpoint returns all Policy members that are a member of this Policy Group.


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/policygroups/{GroupID}/membership \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: graph_policyGroupMembership
      parameters:
      - $ref: '#/components/parameters/trait_filter_filter'
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_sort_sort'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GraphObjectWithPaths'
                type: array
      security:
      - x-api-key: []
      summary: List the Policy Group's membership
      tags:
      - Policy Group Members & Membership
      x-scopes:
      - systems
      - systems.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/policygroups/{group_id}/membership?filter=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/policygroups/{group_id}/membership\"\n\nquerystring = {\"filter\":\"SOME_ARRAY_VALUE\",\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\",\"sort\":\"SOME_ARRAY_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/policygroups/{group_id}/membership?filter=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE'' -Method GET -Headers $headers'
components:
  parameters:
    trait_multiTenantRequestHeaders_x-org-id:
      description: Organization identifier that can be obtained from console settings.
      in: header
      name: x-org-id
      schema:
        type: string
    trait_filter_filter:
      description: 'A filter to apply to the query.


        **Filter structure**: `<field>:<operator>:<value>`.


        **field** = Populate with a valid field from an endpoint response.


        **operator** =  Supported operators are: eq, ne, gt, ge, lt, le, between, search, in.

        _Note: v1 operators differ from v2 operators._


        **value** = Populate with the value you want to search for. Is case sensitive. Supports wild cards.


        **EX:** `GET /api/v2/groups?filter=name:eq:Test+Group`'
      in: query
      name: filter
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        default: []
    trait_skip_skip:
      description: The offset into the records to return.
      in: query
      name: skip
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    trait_sort_sort:
      description: 'The comma separated fields used to sort the collection.

        Default sort is ascending, prefix with `-` to sort descending.

        '
      in: query
      name: sort
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        default: []
    trait_limit_limit:
      description: The number of records to return at once. Limited to 100.
      in: query
      name: limit
      schema:
        type: integer
        default: 10
  schemas:
    GraphObject:
      properties:
        attributes:
          $ref: '#/components/schemas/GraphAttributes'
        id:
          description: The ObjectID of the graph object.
          type: string
        type:
          description: The type of graph object.
          type: string
      required:
      - type
      - id
      title: GraphObject
      type: object
    GraphAttributes:
      additionalProperties: true
      description: The graph attributes.
      title: GraphAttributes
      type:
      - object
      - 'null'
    GraphOperation:
      properties:
        id:
          description: The ObjectID of graph object being added or removed as an association.
          type: string
        op:
          description: How to modify the graph connection.
          enum:
          - add
          - remove
          - update
          type: string
      required:
      - id
      - op
      title: GraphOperation
      type: object
    GraphObjectWithPaths:
      properties:
        compiledAttributes:
          $ref: '#/components/schemas/GraphAttributes'
        id:
          description: Object ID of this graph object.
          type: string
        paths:
          description: Every path through the graph from the requested object to this object. Each path lists the groupings and associations it follows; all of them would have to be removed to remove this object from the requested object.
          items:
            items:
              $ref: '#/components/schemas/GraphConnection'
            type: array
          type: array
        type:
          $ref: '#/components/schemas/GraphType'
        externalId:
          description: The external resource ID that is being synced. Only present when syncStatus query parameter is true.
          type: string
        syncStatus:
          $ref: '#/components/schemas/SyncStatus'
      required:
      - type
      - id
      - paths
      title: GraphObjectWithPaths
      type: object
    SyncStatus:
      description: Sync status information for this object. Only present when syncStatus query parameter is true.
      type: object
      properties:
        syncedAt:
          description: The last time the object was synced.
          type: string
          format: date-time
        code:
          description: Status code of the sync operation.
          type: integer
        message:
          description: Status message of the sync operation.
          type: string
        details:
          description: Additional details about the sync status.
          type: array
          items:
            type: object
    GraphConnection:
      description: Represents an edge between two graph objects. From can be omitted if it is clear from context.
      properties:
        attributes:
          $ref: '#/components/schemas/GraphAttributes'
        from:
          $ref: '#/components/schemas/GraphObject'
        to:
          $ref: '#/components/schemas/GraphObject'
      required:
      - to
      title: GraphConnection
      type: object
    GraphType:
      description: A graph object type.
      enum:
      - active_directory
      - agent
      - agent_group
      - application
      - command
      - g_suite
      - idp_routing_policy
      - ldap_server
      - office_365
      - policy
      - policy_group
      - radius_server
      - password_manager_item
      - system
      - system_group
      - user
      - user_group
      title: GraphType
      type: string
    GraphOperation-PolicyGroup-Member:
      allOf:
      - $ref: '#/components/schemas/GraphOperation'
      - properties:
          attributes:
            $ref: '#/components/schemas/GraphAttributes'
          type:
            description: The member type.
            enum:
            - policy
            type: string
        required:
        - type
      title: GraphOperation (PolicyGroup-Member)
      type: object
  securitySchemes:
    x-api-key:
      description: API key used to authenticate requests.
      in: header
      name: x-api-key
      type: apiKey
