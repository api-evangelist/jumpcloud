paths:
  /systems/{system_id}/associations:
    parameters:
    - description: ObjectID of the System.
      in: path
      name: system_id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - systems
    get:
      description: 'This endpoint returns the _direct_ associations of a System.


        A direct association can be a non-homogeneous relationship between 2 different objects, for example Systems and Users.


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/systems/{System_ID}/associations?targets=user \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}''


        ```'
      operationId: graph_systemAssociationsList
      parameters:
      - $ref: '#/components/parameters/trait_graphTargetsSystem_targets'
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_systemContextAuth_Date'
      - $ref: '#/components/parameters/trait_systemContextAuth_Authorization'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GraphConnection'
                type: array
      security:
      - x-api-key: []
      summary: List the associations of a System
      tags:
      - Systems
      x-scopes:
      - associations.systems
      - associations.systems.readonly
      - associations
      - associations.readonly
      - associations.self
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/systems/{system_id}/associations?targets=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE' \\\n  --header 'Authorization: SOME_STRING_VALUE' \\\n  --header 'Date: SOME_STRING_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/systems/{system_id}/associations\"\n\nquerystring = {\"targets\":\"SOME_ARRAY_VALUE\",\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\"}\n\nheaders = {\n    \"Date\": \"SOME_STRING_VALUE\",\n    \"Authorization\": \"SOME_STRING_VALUE\",\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("Date", "SOME_STRING_VALUE")

          $headers.Add("Authorization", "SOME_STRING_VALUE")

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/systems/{system_id}/associations?targets=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE'' -Method GET -Headers $headers'
    post:
      description: 'This endpoint allows you to manage the _direct_ associations of a System.


        A direct association can be a non-homogeneous relationship between 2 different objects, for example Systems and Users.


        #### Sample Request

        ```

        curl -X POST https://console.jumpcloud.com/api/v2/systems/{System_ID}/associations \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        "attributes": {

        "sudo": {

        "enabled": true,

        "withoutPassword": false

        }

        },

        "op": "add",

        "type": "user",

        "id": "UserID"

        }''

        ```'
      operationId: graph_systemAssociationsPost
      parameters:
      - $ref: '#/components/parameters/trait_systemContextAuth_Date'
      - $ref: '#/components/parameters/trait_systemContextAuth_Authorization'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphOperation-System'
      responses:
        '204':
          description: OK
      security:
      - x-api-key: []
      summary: Manage associations of a System
      tags:
      - Systems
      x-scopes:
      - associations.systems
      - associations
      - associations.self
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/systems/{system_id}/associations \\\n  --header 'Authorization: SOME_STRING_VALUE' \\\n  --header 'Date: SOME_STRING_VALUE' \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '{\"id\":\"string\",\"op\":\"add\",\"attributes\":{\"sudo\":{\"enabled\":true,\"withoutPassword\":true}},\"type\":\"command\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/systems/{system_id}/associations\"\n\npayload = {\n    \"id\": \"string\",\n    \"op\": \"add\",\n    \"attributes\": {\"sudo\": {\n            \"enabled\": True,\n            \"withoutPassword\": True\n        }},\n    \"type\": \"command\"\n}\nheaders = {\n    \"Date\": \"SOME_STRING_VALUE\",\n    \"Authorization\": \"SOME_STRING_VALUE\",\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("Date", "SOME_STRING_VALUE")

          $headers.Add("Authorization", "SOME_STRING_VALUE")

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/systems/{system_id}/associations'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"id":"string","op":"add","attributes":{"sudo":{"enabled":true,"withoutPassword":true}},"type":"command"}'''
  /systems/{system_id}/commands:
    parameters:
    - description: ObjectID of the System.
      in: path
      name: system_id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - systems
    - commmands
    get:
      description: 'This endpoint will return all Commands bound to a System, either directly or indirectly, essentially traversing the JumpCloud Graph for your Organization.


        Each element will contain the type, id, attributes and paths.


        The `attributes` object is a key/value hash of compiled graph attributes for all paths followed.


        The `paths` array enumerates each path from this System to the corresponding Command; this array represents all grouping and/or associations that would have to be removed to deprovision the Command from this System.


        See `/members` and `/associations` endpoints to manage those collections.


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/systems/{System_ID}/commands \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}''


        ```'
      operationId: graph_systemTraverseCommand
      parameters:
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_filter_filter'
      - $ref: '#/components/parameters/trait_GraphObjectWithPaths_details'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/commandsGraphObjectWithPaths'
                type: array
      security:
      - x-api-key: []
      summary: List the Commands bound to a System
      tags:
      - Systems
      x-scopes:
      - commands
      - commands.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/systems/{system_id}/commands?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&filter=SOME_ARRAY_VALUE&details=SOME_STRING_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/systems/{system_id}/commands\"\n\nquerystring = {\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\",\"filter\":\"SOME_ARRAY_VALUE\",\"details\":\"SOME_STRING_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/systems/{system_id}/commands?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&filter=SOME_ARRAY_VALUE&details=SOME_STRING_VALUE'' -Method GET -Headers $headers'
