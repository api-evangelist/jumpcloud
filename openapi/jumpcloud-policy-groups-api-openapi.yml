        Available filter fields:

        - `name`

        - `disabled`

        - `type`


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/policygroups \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
