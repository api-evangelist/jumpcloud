paths:
  /activedirectories/{activedirectory_id}/translation-rules/bulk:
    parameters:
    - in: path
      name: activedirectory_id
      required: true
      schema:
        type: string
    post:
      tags:
      - Translation Rules
      summary: Bulk Translation Rules Operations
      operationId: activedirectoriesTranslationRules_bulk
      description: 'This endpoint allows performing multiple translation rule operations (insert, update, delete) in a single request.


        #### Sample Request

        ```

        curl -X POST ''https://console.jumpcloud.com/api/v2/activedirectories/{activedirectory_id}/translationrules/bulk'' \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -H ''x-org-id: {ORG_ID}'' \

        -d ''{

        "insertTranslationRule": [

        {

        "source": "title",

        "destination": "jobTitle",

        "sourceType": "PATH",

        "direction": "EXPORT",

        "appliedOn": [

        "CREATE",

        "UPDATE"

        ]

        }

        ],

        "updateTranslationRule": [

        {

        "objectId": "{RULE_ID_BASE64_1}",

        "source": "department",

        "destination": "customDepartmentV3",

        "sourceType": "GOLANG_TEMPLATE",

        "appliedOn": [

        "UPDATE"

        ]

        }

        ],

        "deleteTranslationRuleObjectIds": [

        "{RULE_ID_BASE64_2}",

        "{RULE_ID_BASE64_3}"

        ]

        }''

        ```'
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveDirectoriesTranslationRulesBulkRequest'
      responses:
        '200':
          description: Result of the bulk operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.idm.TranslationRulesBulkResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - x-api-key: []
      x-scopes:
      - directories
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/activedirectories/{activedirectory_id}/translation-rules/bulk \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '{\"insertTranslationRules\":[{\"appliedOn\":[\"CREATE\"],\"destination\":\"string\",\"direction\":\"UNSPECIFIED\",\"source\":\"string\",\"sourceType\":\"PATH\"}],\"updateTranslationRules\":[{\"objectId\":\"string\",\"source\":\"string\",\"destination\":\"string\",\"direction\":\"UNSPECIFIED\",\"sourceType\":\"PATH\",\"appliedOn\":[\"CREATE\"]}],\"deleteTranslationRuleObjectIds\":[\"string\"]}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/activedirectories/{activedirectory_id}/translation-rules/bulk\"\n\npayload = {\n    \"insertTranslationRules\": [\n        {\n            \"appliedOn\": [\"CREATE\"],\n            \"destination\": \"string\",\n            \"direction\": \"UNSPECIFIED\",\n            \"source\": \"string\",\n            \"sourceType\": \"PATH\"\n        }\n    ],\n    \"updateTranslationRules\": [\n        {\n            \"objectId\": \"string\",\n            \"source\": \"string\",\n            \"destination\": \"string\",\n            \"direction\": \"UNSPECIFIED\",\n            \"sourceType\": \"PATH\",\n            \"appliedOn\": [\"CREATE\"]\n        }\n    ],\n    \"deleteTranslationRuleObjectIds\": [\"string\"]\n}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/activedirectories/{activedirectory_id}/translation-rules/bulk'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"insertTranslationRules":[{"appliedOn":["CREATE"],"destination":"string","direction":"UNSPECIFIED","source":"string","sourceType":"PATH"}],"updateTranslationRules":[{"objectId":"string","source":"string","destination":"string","direction":"UNSPECIFIED","sourceType":"PATH","appliedOn":["CREATE"]}],"deleteTranslationRuleObjectIds":["string"]}'''
