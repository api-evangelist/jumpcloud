        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/activedirectories/translation-rules/preview\"\n\npayload = {\n    \"translationRules\": [\n        {\n            \"appliedOn\": [\"CREATE\"],\n            \"default\": True,\n            \"destination\": \"string\",\n            \"direction\": \"UNSPECIFIED\",\n            \"editable\": True,\n            \"id\": \"string\",\n            \"required\": True,\n            \"source\": \"string\",\n            \"sourceType\": \"PATH\"\n        }\n    ],\n    \"userObjectId\": \"string\",\n    \"activeDirectoryId\": \"string\"\n}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/activedirectories/translation-rules/preview'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"translationRules":[{"appliedOn":["CREATE"],"default":true,"destination":"string","direction":"UNSPECIFIED","editable":true,"id":"string","required":true,"source":"string","sourceType":"PATH"}],"userObjectId":"string","activeDirectoryId":"string"}'''
