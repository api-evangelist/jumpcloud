  /privileged-access/tags:
    get:
      summary: List Privileged Access Tags
      description: 'List privileged access tags. Privileged Access counterpart of List, exposed under the privileged-access namespace and PAM feature flag so PAM clients do not depend on a Password Vault route owned by another team. Use `source` to choose the tag store: RESOURCES (default) reads resource tags, BLOCKING_RULES aggregates tags used on blocking rules, ALL merges both. Omitting `source` keeps the original resource-tags behaviour. There is no search or pagination, so the full de-duplicated list is returned and callers filter client-side.'
      operationId: TagsService_ListPrivilegedAccessTags
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.privileged_access.ListPrivilegedAccessTagsReply'
      parameters:
      - name: filter
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
        allowReserved: true
      - name: source
        description: " - PRIVILEGED_ACCESS_TAG_SOURCE_UNSPECIFIED: Defaults to RESOURCES, preserving the behaviour of callers that omit it.\n - PRIVILEGED_ACCESS_TAG_SOURCE_RESOURCES: Tags on privileged resources (databases, servers, websites).\n - PRIVILEGED_ACCESS_TAG_SOURCE_BLOCKING_RULES: Tags used on blocking rules.\n - PRIVILEGED_ACCESS_TAG_SOURCE_ALL: Both of the above, merged and de-duplicated."
        in: query
        required: false
        schema:
          type: string
          enum:
          - PRIVILEGED_ACCESS_TAG_SOURCE_UNSPECIFIED
          - PRIVILEGED_ACCESS_TAG_SOURCE_RESOURCES
          - PRIVILEGED_ACCESS_TAG_SOURCE_BLOCKING_RULES
          - PRIVILEGED_ACCESS_TAG_SOURCE_ALL
          default: PRIVILEGED_ACCESS_TAG_SOURCE_UNSPECIFIED
      tags:
      - Privileged Access
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - pam
      - pam.blocking-rules.readonly
      - pam.privileged-servers.readonly
      - pam.privileged-databases.readonly
      - pam.privileged-websites.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/privileged-access/tags?filter=SOME_ARRAY_VALUE&source=SOME_STRING_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/privileged-access/tags"


          querystring = {"filter":"SOME_ARRAY_VALUE","source":"SOME_STRING_VALUE"}


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/privileged-access/tags?filter=SOME_ARRAY_VALUE&source=SOME_STRING_VALUE'' -Method GET -Headers $headers'
