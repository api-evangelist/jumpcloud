paths:
  /privileged-access/activate:
    post:
      summary: Activate Privileged Access Tenant
      description: Activate tenant and create integration token via password vault backend
      operationId: PrivilegedAccessService_Activate
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.privileged_access.ActivateResponse'
      requestBody:
        $ref: '#/components/requestBodies/jumpcloud.privileged_access.ActivateRequest'
      tags:
      - Privileged Access
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - pam
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/privileged-access/activate \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"editionType\":\"string\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/privileged-access/activate\"\n\npayload = {\"editionType\": \"string\"}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/privileged-access/activate'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"editionType":"string"}'''
