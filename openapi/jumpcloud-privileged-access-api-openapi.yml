    post:
      summary: Generate Jump Server Backup Key
      description: Generate or rotate the Jump Server backup key and return it once. This is the only response that ever contains the plaintext key, so the caller must surface it immediately. Rotation keeps `keyId` stable and stores a new key version; each backup file records the version it was encrypted with, so backups taken before a rotation still require their earlier key. Not idempotent. Requires the PAM Backup permission.
      operationId: TenantSettingsService_GeneratePrivilegedAccessBackupKey
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.privileged_access.GeneratePrivilegedAccessBackupKeyReply'
