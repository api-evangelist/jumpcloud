tags:
- name: Saved Views
paths:
  /systems/views:
    get:
      summary: List the Items stored in SavedViews
      description: 'List the saved views for an Organization.


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/systems/views \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key:{API_KEY}''

        ```


        Note: The `limit` maximum is 1000 Saved Views in a single response.'
      operationId: SavedViews_List
      responses:
        '200':
          description: Success listing Saved Views.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/devices.SavedView'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: organizationObjectId
        in: query
        required: false
        schema:
          type: string
          format: byte
      - name: userObjectId
        in: query
        required: false
        schema:
          type: string
          format: byte
      tags:
      - Saved Views
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - systems
      - systems.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/systems/views?organizationObjectId=SOME_STRING_VALUE&userObjectId=SOME_STRING_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/systems/views"


          querystring = {"organizationObjectId":"SOME_STRING_VALUE","userObjectId":"SOME_STRING_VALUE"}


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/systems/views?organizationObjectId=SOME_STRING_VALUE&userObjectId=SOME_STRING_VALUE'' -Method GET -Headers $headers'
    post:
      summary: Creates a saved view for an organization
      description: 'Creates the saved view for an organization.


        #### Sample Request

        ```

        curl -X POST https://console.jumpcloud.com/api/v2/systems/views \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        ```'
      operationId: SavedViews_Create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/devices.SavedView'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/devices.SavedViewCreateRequest'
        required: true
      tags:
      - Saved Views
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - systems
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/systems/views \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"columns\":[\"string\"],\"filters\":[{\"field\":\"string\",\"values\":[\"string\"]}],\"isDefault\":true,\"name\":\"string\",\"objectId\":\"string\",\"shared\":true,\"sortConfig\":\"string\",\"userObjectId\":\"string\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/systems/views\"\n\npayload = {\n    \"columns\": [\"string\"],\n    \"filters\": [\n        {\n            \"field\": \"string\",\n            \"values\": [\"string\"]\n        }\n    ],\n    \"isDefault\": True,\n    \"name\": \"string\",\n    \"objectId\": \"string\",\n    \"shared\": True,\n    \"sortConfig\": \"string\",\n    \"userObjectId\": \"string\"\n}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/systems/views'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"columns":["string"],"filters":[{"field":"string","values":["string"]}],"isDefault":true,"name":"string","objectId":"string","shared":true,"sortConfig":"string","userObjectId":"string"}'''
  /saved-views:
    get:
      summary: List the Items stored in SavedViews
      description: 'List the shared saved views for an Organization having specific source.


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/saved-views \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key:{API_KEY}''

        ```


        Note: The `limit` maximum is 100 Saved Views in a single response.'
      operationId: SavedViewsService_List
      responses:
        '200':
          description: Success listing Saved Views.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.organization_settings.SavedViewsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: sort
        description: Use space separated sort parameters to sort the collection. Default sort is ascending. Prefix with - to sort descending.
        in: query
        required: false
        schema:
          type: string
        allowReserved: true
      - name: filter
        description: "A filter to apply to the query.\n\n\t**Filter structure**: `<field>:<operator>:<value>`.\n\n\t**field** = Populate with a valid field from an endpoint response.\n\n\t**operator** =  Supported operators are: eq, ne, gt, ge, lt, le, search, in.\n\n\t**value** = Populate with the value you want to search for. Is case sensitive. Supports wild cards.\n\n\t**Example** `GET /api/v2/saved-views?filter=source:eq:users`\n"
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
        allowReserved: true
      tags:
      - Saved Views
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - organizations
      - organizations.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/saved-views?sort=SOME_STRING_VALUE&filter=SOME_ARRAY_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/saved-views"


          querystring = {"sort":"SOME_STRING_VALUE","filter":"SOME_ARRAY_VALUE"}


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/saved-views?sort=SOME_STRING_VALUE&filter=SOME_ARRAY_VALUE'' -Method GET -Headers $headers'
    post:
      summary: Creates a saved view for an organization belonging to a specific source
      description: 'Creates the saved view for an organization.


        #### Sample Request

        ```

        curl -X POST https://console.jumpcloud.com/api/v2/views \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        ```'
      operationId: SavedViewsService_Create
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.organization_settings.SavedView'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jumpcloud.organization_settings.SavedViewCreateRequest'
        required: true
      tags:
      - Saved Views
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - organizations
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/saved-views \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"columns\":[\"string\"],\"configuration\":{\"filters\":[{\"field\":\"string\",\"operation\":\"OPERATION_UNKNOWN\",\"value\":null}],\"sort\":\"string\"},\"id\":\"string\",\"isDefault\":true,\"name\":\"string\",\"shared\":true,\"source\":\"string\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/saved-views\"\n\npayload = {\n    \"columns\": [\"string\"],\n    \"configuration\": {\n        \"filters\": [\n            {\n                \"field\": \"string\",\n                \"operation\": \"OPERATION_UNKNOWN\",\n                \"value\": None\n            }\n        ],\n        \"sort\": \"string\"\n    },\n    \"id\": \"string\",\n    \"isDefault\": True,\n    \"name\": \"string\",\n    \"shared\": True,\n    \"source\": \"string\"\n}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/saved-views'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"columns":["string"],"configuration":{"filters":[{"field":"string","operation":"OPERATION_UNKNOWN","value":null}],"sort":"string"},"id":"string","isDefault":true,"name":"string","shared":true,"source":"string"}'''
  /saved-views/{id}:
    put:
      summary: Update Saved View
      description: Updates a saved view
      operationId: SavedViewsService_Update
      responses:
        '200':
          description: Success updating Saved Views.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.organization_settings.SavedView'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: byte
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                savedView:
                  $ref: '#/components/schemas/jumpcloud.organization_settings.SavedView'
        required: true
      tags:
      - Saved Views
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - organizations
      x-codeSamples:
      - lang: Shell
        source: "curl --request PUT \\\n  --url https://console.jumpcloud.com/api/v2/saved-views/{id} \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"savedView\":{\"columns\":[\"string\"],\"configuration\":{\"filters\":[{\"field\":\"string\",\"operation\":\"OPERATION_UNKNOWN\",\"value\":null}],\"sort\":\"string\"},\"id\":\"string\",\"isDefault\":true,\"name\":\"string\",\"shared\":true,\"source\":\"string\"}}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/saved-views/{id}\"\n\npayload = {\"savedView\": {\n        \"columns\": [\"string\"],\n        \"configuration\": {\n            \"filters\": [\n                {\n                    \"field\": \"string\",\n                    \"operation\": \"OPERATION_UNKNOWN\",\n                    \"value\": None\n                }\n            ],\n            \"sort\": \"string\"\n        },\n        \"id\": \"string\",\n        \"isDefault\": True,\n        \"name\": \"string\",\n        \"shared\": True,\n        \"source\": \"string\"\n    }}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"PUT\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/saved-views/{id}'' -Method PUT -Headers $headers -ContentType ''application/json'' -Body ''{"savedView":{"columns":["string"],"configuration":{"filters":[{"field":"string","operation":"OPERATION_UNKNOWN","value":null}],"sort":"string"},"id":"string","isDefault":true,"name":"string","shared":true,"source":"string"}}'''
    delete:
      summary: Delete Saved View
      description: Delete a saved view
      operationId: SavedViewsService_Delete
      responses:
        '200':
          description: Success deleting Saved Views.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
