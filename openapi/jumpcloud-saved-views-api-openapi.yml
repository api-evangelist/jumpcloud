components:
  schemas:
    Error:
      title: Error
      type: object
      x-examples: {}
      description: ''
      properties:
        code:
          format: int32
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Error message
        status:
          type: string
          description: HTTP status description
    jumpcloud.organization_settings.SavedViewCreateRequest:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
        configuration:
          $ref: '#/components/schemas/jumpcloud.organization_settings.Configuration'
        id:
          type: string
          format: byte
        isDefault:
          type: boolean
        name:
          type: string
        shared:
          type: boolean
        source:
          type: string
    devices.SavedViewCreateRequest:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
        filters:
          type: array
          items:
            $ref: '#/components/schemas/devices.Filters'
        isDefault:
          type: boolean
        name:
          type: string
        objectId:
          type: string
          format: byte
        shared:
          type: boolean
        sortConfig:
          type: string
        userObjectId:
          type: string
          format: byte
    jumpcloud.organization_settings.Configuration:
      type: object
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.organization_settings.Filters'
        sort:
          type: string
    jumpcloud.organization_settings.Filters:
      type: object
      properties:
        field:
          type:
          - string
          - 'null'
        operation:
          $ref: '#/components/schemas/jumpcloud.organization_settings.Filters.Operation'
        value:
          description: 'Static value to be compared against. For values that will need to be compared as a datetime object, this should be

            provided as an ISO8601 format string with no offset (UTC). This is made optional so that

            the client can omit this field on AND/OR filters.'
    devices.SavedView:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
          title: '["col1", "col2", "col3"]'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/devices.Filters'
          title: '[ {''field'': ''field1'', ''values'': [''val1'' , ''val2''] }, { ... } ]'
        isDefault:
          type: boolean
        name:
          type: string
        objectId:
          type: string
          format: byte
        shared:
          type: boolean
        sortConfig:
          type: string
        userObjectId:
          type: string
          format: byte
    devices.Filters:
      type: object
      properties:
        field:
          type: string
        values:
          type: array
          items:
            type: string
    jumpcloud.organization_settings.Filters.Operation:
      type: string
      enum:
      - OPERATION_UNKNOWN
      - AND
      - OR
      - EQUALS
      - NOT_EQUALS
      - GREATER_THAN
      - LESS_THAN
      - STARTS_WITH
      - ENDS_WITH
      - IN
      - CONTAINS
      - NOT_CONTAINS
      - BOOL
      - GREATER_THAN_EQUAL
      - LESS_THAN_EQUAL
      - NOT_IN
      - SEARCH
      default: OPERATION_UNKNOWN
      description: "Filter operation to be applied:\nand - Provides logical 'and' groupings of all elements provided in the `filters` array (all sub-filter criteria\n   must be satisfied).\nor - Provides logical 'or' groupings of all elements provided in the `filters` array (any sub-filter criteria can\n   be satisfied).\nequals - Compares `field` with `value` for a // match.  Case insensitive.\nnot_equals - Compares `field` with `value` for an exact non-match.  Case insensitive.\ngreater_than - Checks if `field` is greater numerically than static `value` (non-inclusive).  Works for numbers and\n   datetime types.\nless_than - Checks if `field` is less than static `value` (non-inclusive).  Works for numbers and datetime types.\nstarts_with - Checks if `field` starts with static `value`.  Case insensitive.  Only works for string types.\nends_with - Checks if `field` ends with static `value`.  Case insensitive.  Only works for string types."
    jumpcloud.organization_settings.SavedViewsResponse:
      type: object
      properties:
        totalCount:
          type: integer
          format: int64
        views:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.organization_settings.SavedView'
    jumpcloud.organization_settings.SavedView:
      type: object
      properties:
        adminId:
          type: string
          format: byte
          readOnly: true
        columns:
          type: array
          items:
            type: string
        configuration:
          $ref: '#/components/schemas/jumpcloud.organization_settings.Configuration'
        id:
          type: string
          format: byte
        isDefault:
          type: boolean
        name:
          type: string
        shared:
          type: boolean
        source:
          type: string
    ErrorDetails:
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
