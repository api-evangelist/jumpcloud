openapi: 3.2.0
info:
  contact:
    name: JumpCloud Support
    url: https://jumpcloud.com/support/contact-jumpcloud-support
  description: '# Overview


    JumpCloud''s V2 API. This set of endpoints allows JumpCloud customers to manage objects, groupings and mappings and interact with the JumpCloud Graph. > **Note:** See JumpCloud Data Centers: Login URLs and Service Endpoints to learn more. ## API Best Practices


    Read the linked Help Article below for guidance on retrying failed requests to JumpCloud''s REST API, as well as best practices for structuring subsequent retry requests. Customizing retry mechanisms based on these recommendations will increase the reliability and dependability of your API calls. Covered topics include:

    1. Important Considerations

    2. Supported HTTP Request Methods

    3. Response codes

    4. API Key rotation

    5. Paginating

    6. Error handling

    7. Retry rates


    JumpCloud Help Center - API Best Practices


    # Directory Objects


    This API offers the ability to interact with some of our core features; otherwise known as Directory Objects. The Directory Objects are:


    * Commands

    * Policies

    * Policy Groups

    * Applications

    * Systems

    * Users

    * User Groups

    * System Groups

    * Radius Servers

    * Directories: Office 365, LDAP,G-Suite, Active Directory

    * Duo accounts and applications. The Directory Object is an important concept to understand in order to successfully use JumpCloud API. ## JumpCloud Graph


    We''ve also introduced the concept of the JumpCloud Graph along with Directory Objects. The Graph is a powerful aspect of our platform which will enable you to associate objects with each other, or establish membership for certain objects to become members of other objects. Specific `GET` endpoints will allow you to traverse the JumpCloud Graph to return all indirect and directly bound objects in your organization. | !alt text |

    |:--:|

    | **This diagram highlights our association and membership model as it relates to Directory Objects.** |


    # API Key


    ## Access Your API Key


    To locate your API Key:


    1. Log into the JumpCloud Admin Console. 2. Go to the username drop down located in the top-right of the Console. 3. Retrieve your API key from API Settings. ## API Key Considerations


    This API key is associated to the currently logged in administrator. Other admins will have different API keys. **WARNING** Please keep this API key secret, as it grants full access to any data accessible via your JumpCloud console account. You can also reset your API key in the same location in the JumpCloud Admin Console. ## Recycling or Resetting Your API Key


    In order to revoke access with the current API key, simply reset your API key. This will render all calls using the previous API key inaccessible. Your API key will be passed in as a header with the header name "x-api-key". ```bash

    curl -H "x-api-key: [YOUR_API_KEY_HERE]" "https://console.jumpcloud.com/api/v2/systemgroups"

    ```


    # System Context


    * Introduction

    * Supported endpoints

    * Response codes

    * Authentication

    * Additional examples

    * Third party


    ## Introduction


    JumpCloud System Context Authorization is an alternative way to authenticate with a subset of JumpCloud''s REST APIs. Using this method, a system can manage its information and resource associations, allowing modern auto provisioning environments to scale as needed. **Notes:**


    * The following documentation applies to Linux Operating Systems only. * Systems that have been automatically enrolled using Apple''s Device Enrollment Program (DEP) or systems enrolled using the User Portal install are not eligible to use the System Context API to prevent unauthorized access to system groups and resources. If a script that utilizes the System Context API is invoked on a system enrolled in this way, it will display an error. ## Supported Endpoints


    JumpCloud System Context Authorization can be used in conjunction with Systems endpoints found in the V1 API and certain System Group endpoints found in the v2 API.'
  title: JumpCloud Sample Data API
  version: '2.0'
servers:
- url: https://console.jumpcloud.com/api/v2
  description: United States (US)
  x-jc-region: us
- url: https://console.eu.jumpcloud.com/api/v2
  description: European Union (EU)
  x-jc-region: eu
- url: https://console.in.jumpcloud.com/api/v2
  description: India (IN)
  x-jc-region: in
tags:
- name: Sample Data
paths:
  /sample-data:
    x-functionalities-tags:
    - sample-data
    post:
      summary: This endpoint creates sample data for trial organizations as part of the Sample…
      tags:
      - Sample Data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Response message describing the outcome.
                    examples:
                    - Sample data created successfully.
                  results:
                    type: object
                    description: Detailed results of the sample data creation operation.
                    properties:
                      created:
                        type: array
                        description: List of successfully created resources.
                        items:
                          type: object
                          properties:
                            resourceType:
                              type: string
                              description: The type of resource that was created.
                            count:
                              type: integer
                              description: Number of resources created.
                      skipped:
                        type: array
                        description: List of resources that were skipped (e.g., already exist).
                        items:
                          type: object
                          properties:
                            resourceType:
                              type: string
                              description: The type of resource that was skipped.
                            reason:
                              type: string
                              description: Reason why the resource was skipped.
                      failed:
                        type: array
                        description: List of resources that failed to create.
                        items:
                          type: object
                          properties:
                            resourceType:
                              type: string
                              description: The type of resource that failed.
                            error:
                              type: string
                              description: Error message describing the failure.
        '403':
          description: Forbidden - Feature flag is disabled
          content:
            application/json:
              schema:
                type: object
        '422':
          description: Unprocessable Entity - One or more resources failed to create
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message.
                    examples:
                    - Some sample data resources failed to create.
                  results:
                    type: object
                    description: Detailed results including failures.
                    properties:
                      created:
                        type: array
                        description: List of successfully created resources.
                        items:
                          type: object
                          properties:
                            resourceType:
                              type: string
                            count:
                              type: integer
                      skipped:
                        type: array
                        description: List of resources that were skipped.
                        items:
                          type: object
                          properties:
                            resourceType:
                              type: string
                            reason:
                              type: string
                      failed:
                        type: array
                        description: List of resources that failed to create.
                        items:
                          type: object
                          properties:
                            resourceType:
                              type: string
                            error:
                              type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - resourceTypes
              properties:
                resourceTypes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum:
                    - users
                    - usergroups
                  description: Array of resource types to create. Each resource type is processed independently.
                  examples:
                  - - users
                    - usergroups
        required: true
      operationId: sampleData_post
      description: 'This endpoint creates sample data for the organization based on the requested resource types.


        Supported resource types:

        - `users`: Creates 6 sample users (2 activated, 2 staged, 2 suspended) with varying attributes

        - `usergroups`: Creates a dynamic user group that automatically includes users in the Sales department


        Each resource type is processed independently. If one fails, others may still succeed.

        The response includes detailed results showing what was created, skipped, or failed.'
      security:
      - x-api-key: []
      x-scopes:
      - users
      - groups
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/sample-data \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"resourceTypes\":[\"users\",\"usergroups\"]}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/sample-data\"\n\npayload = {\"resourceTypes\": [\"users\", \"usergroups\"]}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/sample-data'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"resourceTypes":["users","usergroups"]}'''
components:
  securitySchemes:
    x-api-key:
      description: API key used to authenticate requests.
      in: header
      name: x-api-key
      type: apiKey
