components:
  schemas:
    jumpcloud.healthmonitoring.RuleType:
      type: string
      enum:
      - RULE_TYPE_UNSPECIFIED
      - RULE_TYPE_TEMPLATE_BASED
      - RULE_TYPE_EVENT_FILTER_BASED
      - RULE_TYPE_POLL_BASED
      default: RULE_TYPE_UNSPECIFIED
      description: "RuleType specifies the type of rule.\n\n - RULE_TYPE_UNSPECIFIED: No rule type specified.\n - RULE_TYPE_TEMPLATE_BASED: Template-based rules; omit rule_subtype and set template_object_id.\n - RULE_TYPE_EVENT_FILTER_BASED: Insights rules; omit rule_subtype and set event_filters.\n - RULE_TYPE_POLL_BASED: Poll-based rules; set rule_subtype (e.g. certificate_expiry_detection) or template_object_id."
    jumpcloud.alerts.DeleteAlertResponse:
      type: object
      description: DeleteAlertResponse is the response message to DeleteAlertRequest.
    jumpcloud.alerts.BulkUpdateRequest:
      type: object
      properties:
        excludeIds:
          type: array
          items:
            type: string
            format: byte
          title: List of alert IDs to exclude from the operation
        filter:
          $ref: '#/components/schemas/jumpcloud.alerts.FilterCriteria'
        remark:
          type: string
          title: A remark associated with the bulk update operation
        updateField:
          $ref: '#/components/schemas/jumpcloud.alerts.UpdateField'
      description: BulkUpdateRequest is used to perform bulk update operations on alerts.
    jumpcloud.alerts.AlertStatus:
      type: string
      enum:
      - ALERT_STATUS_UNSPECIFIED
      - ALERT_STATUS_OPEN
      - ALERT_STATUS_ACKNOWLEDGED
      - ALERT_STATUS_RESOLVED
      - ALERT_STATUS_AUTO_RESOLVED
      - ALERT_STATUS_DELETED
      default: ALERT_STATUS_UNSPECIFIED
      description: AlertStatus specifies status of an alert.
    jumpcloud.healthmonitoring.PollRuleCondition:
      type: object
      properties:
        enabled:
          type: boolean
        objectId:
          type: string
          format: byte
        thresholdValue:
          type: integer
          format: int32
      description: PollRuleCondition holds a single threshold condition for a poll-based rule.
    jumpcloud.alerts.AlertOccurrence:
      type: object
      properties:
        alertObjectId:
          type: string
          format: byte
          description: The Alert under which this occurrence is held.
        context:
          type: object
          description: context holds the context data as specified by the generator of the alert.
        createdAt:
          type: string
          format: date-time
          description: created_at is the timestamp from the initiator of the occurrence.
        occurredAt:
          type: string
          format: date-time
          description: occurred_at is the timestamp from the initiator of the occurrence.
        updatedAt:
          type: string
          format: date-time
          description: updated_at is the timestamp when occurrence is updated.
      description: AlertOccurrence holds the occurrence details of an alert.
    jumpcloud.alerts.BulkUpdateResponse:
      type: object
      properties:
        affectedCount:
          type: integer
          format: uint64
          title: Number of alerts affected by the operation
      description: BulkUpdateResponse is the response message to BulkUpdateRequest.
    jumpcloud.healthmonitoring.Rule:
      type: object
      properties:
        alertFrequencySettings:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.AlertFrequencySettings'
        alertsEnabled:
          type: boolean
          title: Presence-aware flags to decouple alert from notification delivery
        category:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.RuleCategory'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.healthmonitoring.RuleCondition'
        conditionsRelation:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.LogicalOperator'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        createdBy:
          type: string
          readOnly: true
        createdByObjectId:
          type: string
          format: byte
          title: specifies the ID of admin who created the rule
          readOnly: true
        description:
          type: string
        detectPreExistingAnamolies:
          type: boolean
          description: "  Toggle to specify whether the alert should be produced for\n  already existing anomalies when the rule is created\n  or\n  the rule applies to future violations."
        eventFilters:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.healthmonitoring.RuleEventFilter'
        eventType:
          type: string
          description: "\n  Supported values for event_type are\n   policy_result\n   command_result\n   software_status_update\n   user_create\n   user_admin_granted\n   user_group_admin_grant\n   software_add\n   software_remove\n   device_inactive\n   device_metrics_uptime_sample\n   device_metrics_disk_usage_sample\n   device_metrics_battery_sample."
        excludeSuspendedUsers:
          type: boolean
        groupObjectIds:
          type: array
          items:
            type: string
            format: byte
          description: JumpCloud device (system) and user group object IDs for rule scope. Replaces existing bindings when sent on update.
        labels:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.RuleLabel'
        lastUpdatedAt:
          type: string
          format: date-time
          readOnly: true
        lastUpdatedBy:
          type: string
          readOnly: true
        name:
          type: string
        notificationChannelObjectIds:
          type: array
          items:
            type: string
            format: byte
          description: "  List of notification channels to which the notification should be sent\n  when the rule is violated."
        notifyOnAcknowledgement:
          type: boolean
          description: "  Toggle to specify whether the notification should be produced for\n  the acknowledgement of the alert."
        notifyOnResolution:
          type: boolean
          description: "  Toggle to specify whether the notification should be produced for\n  the resolution of the rule."
        notifyOnViolation:
          type: boolean
          description: "  Toggle to specify whether the notification should be produced for\n  the violation of the rule."
        notifyPrimaryUserOfDevice:
          type: boolean
          description: "  When true, an extra notification to the device's primary user may be sent\n  in addition to configured notification channels."
        objectId:
          type: string
          format: byte
          readOnly: true
        organizationObjectId:
          type: string
          format: byte
          readOnly: true
        osFamily:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.RuleOsFamily'
        pollConditions:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.healthmonitoring.PollRuleCondition'
        postExpiryEnabled:
          type: boolean
        ruleSubtype:
          type: string
          description: "  Template variant for rule_type. Required on create when using rule_type instead of\n  template_object_id (poll-based rules today).\n\n  Supported values (with rule_type = RULE_TYPE_POLL_BASED):\n  - certificate_expiry_detection — certificate expiration monitoring\n  - device_policy_detection — device with no JumpCloud policy\n\n  Omit for RULE_TYPE_TEMPLATE_BASED and RULE_TYPE_EVENT_FILTER_BASED.\n\n  List GET /api/v2/healthmonitoring/ruletemplates for the current catalog."
        ruleType:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.RuleType'
        scopeType:
          type: string
        selectedScopeValues:
          type: array
          items:
            type: string
        severity:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.RuleSeverity'
        status:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.RuleStatus'
        templateObjectId:
          type: string
          format: byte
          description: 'Identifies the rule template which is used to render the Rule configuration

            parameters via GUI. It is still a required parameter even when GUI is not used

            for configuring the rule.

            Identify the rule type and corresponding

            Rule template to fill this parameter during rule creation / updation

            Templates can be fetched using GET on /api/v2/healthmonitoring/ruletemplates.

            Please use the name field in the response to select

            appropriate rule template object ID to be used for configuring the rule.'
      description: Rule represents a rule resource.
    jumpcloud.healthmonitoring.GetRuleResponse:
      type: object
      properties:
        rule:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.Rule'
      description: GetRuleResponse is the response to the GetRuleRequest.
    jumpcloud.alerts.AlertSeverity:
      type: string
      enum:
      - ALERT_SEVERITY_UNSPECIFIED
      - ALERT_SEVERITY_LOW
      - ALERT_SEVERITY_MEDIUM
      - ALERT_SEVERITY_HIGH
      default: ALERT_SEVERITY_UNSPECIFIED
      description: AlertSeverity specifies the severity of an alert.
    jumpcloud.healthmonitoring.GetRulesStatsResponse:
      type: object
      properties:
        systemInsightsRequiredCount:
          type: integer
          format: uint64
          description: number of rules which require system insights to be enabled.
      description: GetRulesStatsResponse is the response to the Get Rule Stats.
    jumpcloud.healthmonitoring.RuleSeverity:
      type: string
      enum:
      - RULE_SEVERITY_UNSPECIFIED
      - RULE_SEVERITY_LOW
      - RULE_SEVERITY_MEDIUM
      - RULE_SEVERITY_HIGH
      - RULE_SEVERITY_CRITICAL
      default: RULE_SEVERITY_UNSPECIFIED
      description: "RuleSeverity specifies the severity of a rule.\nThis severity decides the severity of the produced alert.\nThis allows the admin to assign different severities to alerts and helps prioritise the resolution.\n\n - RULE_SEVERITY_UNSPECIFIED: No severity specified.\n - RULE_SEVERITY_LOW: Severity of Low.\n - RULE_SEVERITY_MEDIUM: Severity of Medium.\n - RULE_SEVERITY_HIGH: Severity of High.\n - RULE_SEVERITY_CRITICAL: Severity of Critical — maps to Alert Priority critical level."
    jumpcloud.alerts.BulkDeleteResponse:
      type: object
      properties:
        affectedCount:
          type: integer
          format: uint64
          title: Number of alerts affected by the operation
      description: BulkDeleteResponse is the response message to BulkDeleteRequest.
    jumpcloud.alerts.AlertSourceType:
      type: string
      enum:
      - ALERT_SOURCE_TYPE_UNSPECIFIED
      - ALERT_SOURCE_TYPE_USER
      - ALERT_SOURCE_TYPE_ADMIN
      - ALERT_SOURCE_TYPE_DEVICE
      - ALERT_SOURCE_TYPE_USER_GROUP
      - ALERT_SOURCE_TYPE_DEVICES
      - ALERT_SOURCE_TYPE_ACCESS_REQUEST
      - ALERT_SOURCE_TYPE_SAAS_APPLICATION
      - ALERT_SOURCE_TYPE_CUSTOM
      - ALERT_SOURCE_TYPE_COMMAND
      - ALERT_SOURCE_TYPE_POLICY
      - ALERT_SOURCE_TYPE_APPLICATION
      - ALERT_SOURCE_TYPE_IPLIST
      - ALERT_SOURCE_TYPE_SOFTWARE
      - ALERT_SOURCE_TYPE_ACCESSORY
      - ALERT_SOURCE_TYPE_LOCATION
      default: ALERT_SOURCE_TYPE_UNSPECIFIED
      description: AlertSourceType specifies the type of the source that generated the alert.
    jumpcloud.healthmonitoring.RuleOsFamily:
      type: string
      enum:
      - RULE_OS_FAMILY_UNSPECIFIED
      - RULE_OS_FAMILY_ALL
      - RULE_OS_FAMILY_WINDOWS
      - RULE_OS_FAMILY_DARWIN
      - RULE_OS_FAMILY_LINUX
      default: RULE_OS_FAMILY_UNSPECIFIED
      description: "RuleOsFamily specifies the OS family for a rule.\nCurrently not being used.\n\n - RULE_OS_FAMILY_UNSPECIFIED: No OS family specified\n - RULE_OS_FAMILY_ALL: Rule applies to all supported OS families\n - RULE_OS_FAMILY_WINDOWS: Rule applies to windows OS family\n - RULE_OS_FAMILY_DARWIN: Rule applies to darwin OS family\n - RULE_OS_FAMILY_LINUX: Rule applies to linux OS family"
    jumpcloud.alerts.BulkDeleteRequest:
      type: object
      properties:
        excludeIds:
          type: array
          items:
            type: string
            format: byte
          title: List of alert IDs to exclude from the operation
        filter:
          $ref: '#/components/schemas/jumpcloud.alerts.FilterCriteria'
      description: BulkDeleteRequest is used to perform bulk delete operations on alerts.
    jumpcloud.healthmonitoring.RuleCategory:
      type: string
      enum:
      - RULE_CATEGORY_UNSPECIFIED
      - RULE_CATEGORY_DIRECTORY
      - RULE_CATEGORY_SYSTEM
      - RULE_CATEGORY_ADMIN
      - RULE_CATEGORY_ACCESS
      - RULE_CATEGORY_GENERAL
      - RULE_CATEGORY_CUSTOM
      default: RULE_CATEGORY_UNSPECIFIED
      title: 'RuleCategory specifies the category for a rule.

        Category specified in the rule decides the category of the produced alert.

        This categorization allows easier filtering and management of alerts."'
    jumpcloud.healthmonitoring.GetRuleTemplateResponse:
      type: object
      properties:
        template:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.RuleTemplate'
      description: GetRuleTemplateResponse is the response to the GetRuleTemplateRequest.
    jumpcloud.healthmonitoring.ListRulesResponse:
      type: object
      properties:
        count:
          type: integer
          format: uint64
          description: count specifies the number of rules returned in the response.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.healthmonitoring.Rule'
          description: An array of rule objects.
      description: ListRulesResponse holds the list of rules requested via a ListRulesRequest.
    jumpcloud.healthmonitoring.RuleEventFilter:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
          readOnly: true
        eventTypes:
          type: array
          items:
            type: string
        filterSource:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.FilterSource'
        objectId:
          type: string
          format: byte
          readOnly: true
        referenceFields:
          type: array
          items:
            type: string
        resolutionCondition:
          type: string
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        violationCondition:
          type: string
      description: RuleEventFilter is the message that represents the event filter for a rule.
    jumpcloud.healthmonitoring.RuleTemplate:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.RuleCategory'
        configurations:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.healthmonitoring.RuleTemplateConfiguration'
        createdAt:
          type: string
          format: date-time
        description:
          type: string
        frequency:
          type: integer
          format: int64
        name:
          type: string
        objectId:
          type: string
          format: byte
        osFamily:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.RuleOsFamily'
        outputSchema:
          type: object
        ruleSubtype:
          type: string
          description: "  Template variant paired with rule_type. For poll-based templates, pass this value\n  with rule_type on rule create instead of template_object_id.\n\n  Examples: certificate_expiry_detection, device_policy_detection."
        ruleType:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.RuleType'
        siRequired:
          type: boolean
        status:
          type: string
        systemBindingRequired:
          type: boolean
        type:
          type: string
        unrestricted:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        version:
          type: string
      description: RuleTemplate represents a rule template object.
    jumpcloud.healthmonitoring.DisplayType:
      type: string
      enum:
      - DISPLAY_TYPE_UNSPECIFIED
      - DISPLAY_TYPE_TEXT
      - DISPLAY_TYPE_SELECT
      - DISPLAY_TYPE_TEXTAREA
      - DISPLAY_TYPE_CHECKBOX
      - DISPLAY_TYPE_DATE
      - DISPLAY_TYPE_EMAIL
      - DISPLAY_TYPE_NUMBER
      - DISPLAY_TYPE_RADIO
      - DISPLAY_TYPE_SINGLELISTBOX
      - DISPLAY_TYPE_DOUBLELISTBOX
      - DISPLAY_TYPE_TABLE
      - DISPLAY_TYPE_FILE
      - DISPLAY_TYPE_SEGMENTEDBUTTON
      - DISPLAY_TYPE_COPYWELL
      - DISPLAY_TYPE_TIMEINPUT
      - DISPLAY_TYPE_DATEPICKERRANGE
      - DISPLAY_TYPE_MULTILIST
      - DISPLAY_TYPE_INPUTREADONLY
      - DISPLAY_TYPE_ICONSTATUS
      - DISPLAY_TYPE_ITEMLIST
      - DISPLAY_TYPE_EXISTING_VIOLATIONS
      default: DISPLAY_TYPE_UNSPECIFIED
    jumpcloud.alerts.ListAlertOccurrencesResponse:
      type: object
      properties:
        alertOccurrences:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.alerts.AlertOccurrence'
        count:
          type: integer
          format: uint64
      description: ListAlertOccurrencesResponse is the response message for ListAlertOccurrencesRequest.
    jumpcloud.healthmonitoring.AlertFrequencySettings:
      type: object
      properties:
        countPerResource:
          type: boolean
          description: When true, count events per resource grouping key; false = org-wide default.
        enabled:
          type: boolean
          description: Master toggle for threshold-based alerting. When false or unset, the rule fires on every matching event. When true, N-in-T threshold logic applies.
        eventThresholdCount:
          type: integer
          format: int32
          description: Minimum matching events (N) before alert fires. Unset or 1 = fire on first match.
        monitoringWindow:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.MonitoringWindow'
      description: 'AlertFrequencySettings configures N-in-T alert frequency for a rule.

        monitoring_window is required when event_threshold_count > 1.'
    jumpcloud.healthmonitoring.DeleteRuleResponse:
      type: object
      description: DeleteRulesResponse is the response message to DeleteRulesRequest.
    jumpcloud.alerts.FilterCriteria:
      type: object
      properties:
        category:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.alerts.AlertCategory'
        existingCondition:
          type: string
        lastOccurredAtAfter:
          type: string
        lastOccurredAtBefore:
          type: string
        severity:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.alerts.AlertSeverity'
        sourceId:
          type: array
          items:
            type: string
        sourceType:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.alerts.AlertSourceType'
        status:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.alerts.AlertStatus'
        title:
          type: string
      title: Filter criteria for selecting alerts
    jumpcloud.healthmonitoring.UpdateRuleStatusResponse:
      type: object
      properties:
        rule:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.Rule'
      description: UpdateRuleStatusResponse is the response message to UpdateRuleStatusRequest.
    jumpcloud.healthmonitoring.ListRuleTemplatesResponse:
      type: object
      properties:
        count:
          type: integer
          format: uint64
        templates:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.healthmonitoring.RuleTemplate'
      description: ListRuleTemplatesResponse holds the list of rules requested via a ListRulesRequest.
    jumpcloud.healthmonitoring.FilterSource:
      type: string
      enum:
      - FILTER_SOURCE_UNSPECIFIED
      - FILTER_SOURCE_UI_BUILDER
      - FILTER_SOURCE_EXPR_BUILDER
      default: FILTER_SOURCE_UNSPECIFIED
      description: "FilterSource indicates the source or method used to create the filter for a rule.\nThis helps track whether filters were created using the UI-based builder interface\nor through direct expression syntax.\n\n - FILTER_SOURCE_UNSPECIFIED: No filter source specified.\n - FILTER_SOURCE_UI_BUILDER: Filter was created using the UI-based builder interface.\nThis typically involves using form fields, dropdowns, and visual components\nto construct the filter criteria.\n - FILTER_SOURCE_EXPR_BUILDER: Filter was created using the expression builder with direct syntax.\nThis allows advanced users to write filter expressions directly,\nproviding more flexibility and complex filtering capabilities."
    jumpcloud.healthmonitoring.LogicalOperator:
      type: string
      enum:
      - LOGICAL_OPERATOR_UNSPECIFIED
      - LOGICAL_OPERATOR_AND
      - LOGICAL_OPERATOR_OR
      default: LOGICAL_OPERATOR_UNSPECIFIED
      description: "LogicalOperator specifies logical operations.\nUsed to combine rule conditions and filters in a logical manner.\n\n - LOGICAL_OPERATOR_UNSPECIFIED: No operator specified\n - LOGICAL_OPERATOR_AND: Combine operands using AND\n - LOGICAL_OPERATOR_OR: Combine operands using OR"
    jumpcloud.alerts.GetAlertStatsResponse:
      type: object
      properties:
        context:
          type: object
        totalCount:
          type: integer
          format: uint64
    jumpcloud.alerts.AddAlertNoteResponse:
      type: object
      properties:
        note:
          $ref: '#/components/schemas/jumpcloud.alerts.AlertNote'
      description: AddAlertNoteResponse returns the created note.
    jumpcloud.healthmonitoring.RuleLabel:
      type: string
      enum:
      - RULE_LABEL_UNSPECIFIED
      - RULE_LABEL_ADMIN
      - RULE_LABEL_WORKFLOW
      default: RULE_LABEL_UNSPECIFIED
      description: "RuleLabel indicates which service or surface created the rule.\n\n - RULE_LABEL_UNSPECIFIED: No label specified; defaults to admin behaviour.\n - RULE_LABEL_ADMIN: Rule was created through the Admin UI.\n - RULE_LABEL_WORKFLOW: Rule was created by the Workflow service."
    jumpcloud.alerts.UpdateField:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/jumpcloud.alerts.AlertStatus'
      title: UpdateField contains the fields that can be updated in bulk operations
    jumpcloud.healthmonitoring.RuleStatus:
      type: string
      enum:
      - RULE_STATUS_UNSPECIFIED
      - RULE_STATUS_ENABLED
      - RULE_STATUS_DISABLED
      default: RULE_STATUS_UNSPECIFIED
      description: "RuleStatus specifies the status of a rule.\nThe status of the rule which can be either enabled or disabled.\nThe rule is processed only in an enabled state.\n\n - RULE_STATUS_UNSPECIFIED: No status specified\n - RULE_STATUS_ENABLED: rule is enabled\n - RULE_STATUS_DISABLED: rule is disabled"
    jumpcloud.alerts.UpdateAlertStatusResponse:
      type: object
      properties:
        alert:
          $ref: '#/components/schemas/jumpcloud.alerts.Alert'
      description: UpdateAlertStatusResponse is the response message to UpdateAlertStatusRequest.
    jumpcloud.healthmonitoring.CreateRuleRequest:
      type: object
      properties:
        rule:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.Rule'
      description: CreateRuleRequest is the request message used to create a single rule.
    jumpcloud.alerts.ListAlertsResponse:
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.alerts.Alert'
        count:
          type: integer
          format: uint64
      description: ListAlertsResponse is the response to ListAlertsRequest.
    jumpcloud.healthmonitoring.RuleTemplateConfiguration:
      type: object
      properties:
        defaultValue:
          type: object
        displayOptions:
          type: object
        displayType:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.DisplayType'
        label:
          type: string
        name:
          type: string
        objectId:
          type: string
          format: byte
        position:
          type: integer
          format: int64
        readOnly:
          type: boolean
        required:
          type: boolean
        tooltip:
          type: object
        validators:
          type: object
      description: RuleTemplateConfiguration holds configuration information associated with rule template.
    jumpcloud.alerts.AlertCategory:
      type: string
      enum:
      - ALERT_CATEGORY_UNSPECIFIED
      - ALERT_CATEGORY_DIRECTORY
      - ALERT_CATEGORY_SYSTEM
      - ALERT_CATEGORY_ADMIN
      - ALERT_CATEGORY_ACCESS
      - ALERT_CATEGORY_GENERAL
      - ALERT_CATEGORY_CUSTOM
      default: ALERT_CATEGORY_UNSPECIFIED
      description: AlertCategory specifies the category of an alert.
    jumpcloud.healthmonitoring.RuleCondition:
      type: object
      properties:
        eventType:
          type: string
          description: event_type specifies the event on which the rule's conditions have to be matched.
        filters:
          type: object
          description: "filters specify how to filter event messages to match the conditions.\n  Example:\n  The example below is for matching policy_id in a rule with event_type: policy_result.\n  Note that each rule has a specific set of filters supported.\n\n    \"filters\":{\n      \"resource.policy_id\": {\n        \"match_type\": \"=\",\n        \"value_type\": \"string\",\n        \"value\":\"6661c734af8ad100010a2483\",\n        \"type\":\"mandatory\",\n        \"template_config_id\":\"664cbeded18e0095a00ba36a\"\n      }\n    }.\n    Match the \"policy_id\" field nested under the \"resource\" object of the incoming JSON message.\n    This is an equal to match (specified in \"match_type\"),\n    with the field type as string (specified in \"value_type\").\n    The value to be matched is specified in \"value\". Supported values for match_type are\n    string fields - \"contains\", \"contains_any\", \"not_contains\", \"regex\", \"match_all\"\n    integer fields - \">\", \">=\", \"<\", \"<=\""
        objectId:
          type: string
          format: byte
      title: "RuleCondition holds a single condition bound to a rule.\nExample:\n   {\n      \"conditions\" : [\n         {\n            \"event_type\" : \"policy_result\",\n            \"filters\" : {\n               \"resource.policy_id\" : {\n                  \"match_type\" : \"=\",\n                  \"template_config_id\" : \"664cbeded18e0095a00ba36a\",\n                  \"type\" : \"mandatory\",\n                  \"value\" : \"6661c734af8ad100010a2483\",\n                  \"value_type\" : \"string\"\n               }\n            }\n         }\n      ]\n   }\n   \"eventType\" specifies the event for which the conditions are applicable.\n   \"filters\" specifies a set of filters using which the condition match has to be checked.\""
    jumpcloud.alerts.GetAlertNotesResponse:
      type: object
      properties:
        notes:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.alerts.AlertNote'
      description: GetAlertNotesResponse returns all notes for an alert.
    jumpcloud.healthmonitoring.MonitoringWindow:
      type: object
      properties:
        unit:
          type: string
          description: 'Supported units: minutes, hours, days.'
        value:
          type: integer
          format: int64
      description: 'MonitoringWindow is the rolling window duration for N-in-T alert frequency.

        Required when event_threshold_count > 1. Normalized to seconds server-side; min 300s; max configurable.'
    jumpcloud.alerts.Alert:
      type: object
      properties:
        acknowledgedAt:
          type: string
          format: date-time
          description: acknowledged_at is the time when alert was acknowledged.
        category:
          $ref: '#/components/schemas/jumpcloud.alerts.AlertCategory'
        createdAt:
          type: string
          format: date-time
          description: created_at is the creation time of the first occurrence (as specified by the alert occurrence generator).
        description:
          type: string
        firstOccurredAt:
          type: string
          format: date-time
          description: first_occurred_at is the time of the first occurrence of the alert.
        frequency:
          type: integer
          format: int64
        lastOccurredAt:
          type: string
          format: date-time
          description: last_occurred_at is the time of the last occurrence of the alert.
        lastOccurrenceContext:
          type: object
          description: context holds the context of of last alert occurrence.
          readOnly: true
        objectId:
          type: string
          format: byte
          description: id holds the unique identifier of an alert.
        occurrencesCount:
          type: integer
          format: uint64
          description: occurrences_count is the number of occurrences of the alert.
        organizationObjectId:
          type: string
          format: byte
          readOnly: true
        referenceId:
          type: string
        remark:
          type: string
          description: A remark added to the alert while updating.
        resolvedAt:
          type: string
          format: date-time
          description: resolved_at is the time when alert was resolved.
        severity:
          $ref: '#/components/schemas/jumpcloud.alerts.AlertSeverity'
        sourceId:
          type: string
        sourceName:
          type: string
          readOnly: true
        sourceType:
          $ref: '#/components/schemas/jumpcloud.alerts.AlertSourceType'
        status:
          $ref: '#/components/schemas/jumpcloud.alerts.AlertStatus'
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
          description: updated_at is the time when alert was updated.
      description: Alert holds the details of an alert.
    jumpcloud.healthmonitoring.UpdateRuleResponse:
      type: object
      properties:
        rule:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.Rule'
        warning:
          type: string
      description: UpdateRuleResponse is the response message to UpdateRuleRequest.
    jumpcloud.healthmonitoring.CreateRuleResponse:
      type: object
      properties:
        rule:
          $ref: '#/components/schemas/jumpcloud.healthmonitoring.Rule'
        warning:
          type: string
      description: CreateRuleResponse is the response message to CreateRuleRequest.
    jumpcloud.alerts.AlertNote:
      type: object
      properties:
        alertNote:
          type: string
        alertNoteObjectId:
          type: string
          format: byte
          readOnly: true
        authorEmail:
          type: string
        authorId:
          type: string
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: AlertNote represents a note/comment on an alert.
    jumpcloud.alerts.GetAlertResponse:
      type: object
      properties:
        alert:
          $ref: '#/components/schemas/jumpcloud.alerts.Alert'
      description: GetAlertResponse is the response message to GetAlertRequest.
