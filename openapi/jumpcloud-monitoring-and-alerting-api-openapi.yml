paths:
  /healthmonitoring/rules:
    get:
      summary: This endpoint is used for listing the rules of health monitoring
      description: This endpoint allows you list health monitoring rules.
      operationId: RulesService_ListRules
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.healthmonitoring.ListRulesResponse'
      parameters:
      - name: filter
        description: "A filter to apply to the query.\n\n  **Filter structure**: `<field>:<operator>:<value>`.\n\n  **field** = Populate with a valid field from an endpoint response.\n\n  **operator** =  Supported operators are: eq, ne, gt, ge, lt, le, between, search, in.\n\n  **value** = Populate with the value you want to search for. Is case sensitive. Supports wild cards.\n\n  **Example** `GET /api/v2/groups?filter=name:eq:Test+Group`\n"
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
        allowReserved: true
      - name: fields
        description: The fields on the items listed to return.
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: skip
        description: The offset into the records to return.
        in: query
        required: false
        schema:
          type: string
          format: int64
          default: '0'
      - name: sort
        description: 'An optional comma separated field names used to sort the collection.

          Default sort is ascending, prefix with `-` to sort descending.'
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
        allowReserved: true
      - name: limit
        description: 'The number of rules to return at once.

          If the number of rules returned is less than `limit` there are no more rules to fetch.

          If the number of rules returned is equal to limit there may be more rules to fetch. Increment `skip` by `limit` to get the next set of rules.'
        in: query
        required: false
        schema:
          type: string
          format: int64
          default: '100'
      - name: labels
        description: " - RULE_LABEL_UNSPECIFIED: No label specified; defaults to admin behaviour.\n - RULE_LABEL_ADMIN: Rule was created through the Admin UI.\n - RULE_LABEL_WORKFLOW: Rule was created by the Workflow service."
        in: query
        required: false
        schema:
          type: string
          enum:
          - RULE_LABEL_UNSPECIFIED
          - RULE_LABEL_ADMIN
          - RULE_LABEL_WORKFLOW
          default: RULE_LABEL_UNSPECIFIED
      tags:
      - Monitoring and Alerting
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - healthmonitoring.rules
      - healthmonitoring.rules.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/healthmonitoring/rules?filter=SOME_ARRAY_VALUE&fields=SOME_ARRAY_VALUE&skip=SOME_STRING_VALUE&sort=SOME_ARRAY_VALUE&limit=SOME_STRING_VALUE&labels=SOME_STRING_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/healthmonitoring/rules"


          querystring = {"filter":"SOME_ARRAY_VALUE","fields":"SOME_ARRAY_VALUE","skip":"SOME_STRING_VALUE","sort":"SOME_ARRAY_VALUE","limit":"SOME_STRING_VALUE","labels":"SOME_STRING_VALUE"}


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/healthmonitoring/rules?filter=SOME_ARRAY_VALUE&fields=SOME_ARRAY_VALUE&skip=SOME_STRING_VALUE&sort=SOME_ARRAY_VALUE&limit=SOME_STRING_VALUE&labels=SOME_STRING_VALUE'' -Method GET -Headers $headers'
    post:
      summary: This endpoint is used for creating the rules
      description: 'Create a health monitoring rule.


        Use one of:

        - template_object_id — template-based or poll-based (UI / legacy clients)

        - rule_type + rule_subtype — programmatic poll-based create without template_object_id

        - rule_type RULE_TYPE_EVENT_FILTER_BASED + event_filters — insights rules


        Poll-based rule_type + rule_subtype pairs:

        | ruleType | ruleSubtype |

        | RULE_TYPE_POLL_BASED | certificate_expiry_detection |

        | RULE_TYPE_POLL_BASED | device_policy_detection |


        Discover pairs from GET /api/v2/healthmonitoring/ruletemplates.'
      operationId: RulesService_CreateRule
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.healthmonitoring.CreateRuleResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jumpcloud.healthmonitoring.CreateRuleRequest'
        description: CreateRuleRequest is the request message used to create a single rule.
        required: true
      tags:
      - Monitoring and Alerting
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - healthmonitoring.rules
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/healthmonitoring/rules \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"rule\":{\"alertFrequencySettings\":{\"countPerResource\":true,\"enabled\":true,\"eventThresholdCount\":0,\"monitoringWindow\":{\"unit\":\"string\",\"value\":0}},\"alertsEnabled\":true,\"category\":\"RULE_CATEGORY_UNSPECIFIED\",\"conditions\":[{\"eventType\":\"string\",\"filters\":{},\"objectId\":\"string\"}],\"conditionsRelation\":\"LOGICAL_OPERATOR_UNSPECIFIED\",\"description\":\"string\",\"detectPreExistingAnamolies\":true,\"eventFilters\":[{\"eventTypes\":[\"string\"],\"filterSource\":\"FILTER_SOURCE_UNSPECIFIED\",\"referenceFields\":[\"string\"],\"resolutionCondition\":\"string\",\"violationCondition\":\"string\"}],\"eventType\":\"string\",\"excludeSuspendedUsers\":true,\"groupObjectIds\":[\"string\"],\"labels\":\"RULE_LABEL_UNSPECIFIED\",\"name\":\"string\",\"notificationChannelObjectIds\":[\"string\"],\"notifyOnAcknowledgement\":true,\"notifyOnResolution\":true,\"notifyOnViolation\":true,\"notifyPrimaryUserOfDevice\":true,\"osFamily\":\"RULE_OS_FAMILY_UNSPECIFIED\",\"pollConditions\":[{\"enabled\":true,\"objectId\":\"string\",\"thresholdValue\":0}],\"postExpiryEnabled\":true,\"ruleSubtype\":\"string\",\"ruleType\":\"RULE_TYPE_UNSPECIFIED\",\"scopeType\":\"string\",\"selectedScopeValues\":[\"string\"],\"severity\":\"RULE_SEVERITY_UNSPECIFIED\",\"status\":\"RULE_STATUS_UNSPECIFIED\",\"templateObjectId\":\"string\"}}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/healthmonitoring/rules\"\n\npayload = {\"rule\": {\n        \"alertFrequencySettings\": {\n            \"countPerResource\": True,\n            \"enabled\": True,\n            \"eventThresholdCount\": 0,\n            \"monitoringWindow\": {\n                \"unit\": \"string\",\n                \"value\": 0\n            }\n        },\n        \"alertsEnabled\": True,\n        \"category\": \"RULE_CATEGORY_UNSPECIFIED\",\n        \"conditions\": [\n            {\n                \"eventType\": \"string\",\n                \"filters\": {},\n                \"objectId\": \"string\"\n            }\n        ],\n        \"conditionsRelation\": \"LOGICAL_OPERATOR_UNSPECIFIED\",\n        \"description\": \"string\",\n        \"detectPreExistingAnamolies\": True,\n        \"eventFilters\": [\n            {\n                \"eventTypes\": [\"string\"],\n                \"filterSource\": \"FILTER_SOURCE_UNSPECIFIED\",\n                \"referenceFields\": [\"string\"],\n                \"resolutionCondition\": \"string\",\n                \"violationCondition\": \"string\"\n            }\n        ],\n        \"eventType\": \"string\",\n        \"excludeSuspendedUsers\": True,\n        \"groupObjectIds\": [\"string\"],\n        \"labels\": \"RULE_LABEL_UNSPECIFIED\",\n        \"name\": \"string\",\n        \"notificationChannelObjectIds\": [\"string\"],\n        \"notifyOnAcknowledgement\": True,\n        \"notifyOnResolution\": True,\n        \"notifyOnViolation\": True,\n        \"notifyPrimaryUserOfDevice\": True,\n        \"osFamily\": \"RULE_OS_FAMILY_UNSPECIFIED\",\n        \"pollConditions\": [\n            {\n                \"enabled\": True,\n                \"objectId\": \"string\",\n                \"thresholdValue\": 0\n            }\n        ],\n        \"postExpiryEnabled\": True,\n        \"ruleSubtype\": \"string\",\n        \"ruleType\": \"RULE_TYPE_UNSPECIFIED\",\n        \"scopeType\": \"string\",\n        \"selectedScopeValues\": [\"string\"],\n        \"severity\": \"RULE_SEVERITY_UNSPECIFIED\",\n        \"status\": \"RULE_STATUS_UNSPECIFIED\",\n        \"templateObjectId\": \"string\"\n    }}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/healthmonitoring/rules'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"rule":{"alertFrequencySettings":{"countPerResource":true,"enabled":true,"eventThresholdCount":0,"monitoringWindow":{"unit":"string","value":0}},"alertsEnabled":true,"category":"RULE_CATEGORY_UNSPECIFIED","conditions":[{"eventType":"string","filters":{},"objectId":"string"}],"conditionsRelation":"LOGICAL_OPERATOR_UNSPECIFIED","description":"string","detectPreExistingAnamolies":true,"eventFilters":[{"eventTypes":["string"],"filterSource":"FILTER_SOURCE_UNSPECIFIED","referenceFields":["string"],"resolutionCondition":"string","violationCondition":"string"}],"eventType":"string","excludeSuspendedUsers":true,"groupObjectIds":["string"],"labels":"RULE_LABEL_UNSPECIFIED","name":"string","notificationChannelObjectIds":["string"],"notifyOnAcknowledgement":true,"notifyOnResolution":true,"notifyOnViolation":true,"notifyPrimaryUserOfDevice":true,"osFamily":"RULE_OS_FAMILY_UNSPECIFIED","pollConditions":[{"enabled":true,"objectId":"string","thresholdValue":0}],"postExpiryEnabled":true,"ruleSubtype":"string","ruleType":"RULE_TYPE_UNSPECIFIED","scopeType":"string","selectedScopeValues":["string"],"severity":"RULE_SEVERITY_UNSPECIFIED","status":"RULE_STATUS_UNSPECIFIED","templateObjectId":"string"}}'''
