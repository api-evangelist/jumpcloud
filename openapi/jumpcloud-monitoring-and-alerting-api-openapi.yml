        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/alerts/{alertObjectId}/notes'' -Method GET -Headers $headers'
    post:
