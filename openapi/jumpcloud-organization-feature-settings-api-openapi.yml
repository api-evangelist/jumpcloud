  description: India (IN)
  x-jc-region: in
tags:
- name: Organization Feature Settings
paths:
  /feature-settings:
    get:
      summary: Get Organization Feature Settings
      description: 'Get organization feature settings using filters. Returns a list of features with their settings grouped by feature name.


        #### Sample Request

        ```

        curl -X GET ''https://console.jumpcloud.com/api/v2/feature-settings?filter=feature.name:eq:mcp&filter=setting.name:eq:enabled'' \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key:{API_KEY}''

        ```


        #### Sample Response

        ```json

        {

        "features": [

        {

        "name": "mcp",

        "settings": [

        {

        "name": "enabled",

        "value": true

        },

        {

        "name": "threshold",

        "value": 10

        }

        ],

        "category": "ai"

        }

        ]

        }

        ```'
      operationId: OrganizationFeatureSettingsService_List
      responses:
        '200':
          description: Success retrieving Organization Feature Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.organization_settings.ListFeatureSettingsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: filter
        description: "A filter to apply to the query.\n\n\t**Filter structure**: `<field>:<operator>:<value>`.\n\n\t**field** = Populate with a valid field from an endpoint response.\n\n\t**operator** =  Supported operators are: eq, ne, gt, ge, lt, le, search, in.\n\n\t**value** = Populate with the value you want to search for. Is case sensitive. Supports wild cards.\n\n\t**Example** `GET /api/v2/feature-settings?filter=feature.name:eq:mcp&filter=setting.name:eq:enabled`\n"
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
        allowReserved: true
      tags:
      - Organization Feature Settings
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - organizations
      - organizations.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/feature-settings?filter=SOME_ARRAY_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/feature-settings"


          querystring = {"filter":"SOME_ARRAY_VALUE"}


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/feature-settings?filter=SOME_ARRAY_VALUE'' -Method GET -Headers $headers'
  /feature-settings/{feature_name}/{setting_name}:
    put:
      summary: Update Organization Feature Settings
      description: 'Updates organization feature settings by category, feature name, and setting name.


        #### Sample Request

        ```

        curl -X PUT https://console.jumpcloud.com/api/v2/feature-settings/{feature_name}/{setting_name} \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{"value": "true"}''

        ```'
      operationId: OrganizationFeatureSettingsService_Update
      responses:
        '200':
          description: Success updating Organization Feature Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.organization_settings.Setting'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: feature_name
        in: path
        required: true
        schema:
          type: string
      - name: setting_name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/AccessRiskSettingsService_UpdateBody'
      tags:
      - Organization Feature Settings
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - organizations
      x-codeSamples:
      - lang: Shell
        source: "curl --request PUT \\\n  --url https://console.jumpcloud.com/api/v2/feature-settings/{feature_name}/{setting_name} \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"value\":null}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/feature-settings/{feature_name}/{setting_name}\"\n\npayload = {\"value\": None}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"PUT\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/feature-settings/{feature_name}/{setting_name}'' -Method PUT -Headers $headers -ContentType ''application/json'' -Body ''{"value":null}'''
components:
  schemas:
    Error:
      title: Error
      type: object
      x-examples: {}
      description: ''
      properties:
        code:
          format: int32
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Error message
        status:
          type: string
          description: HTTP status description
    jumpcloud.organization_settings.Feature:
      type: object
      properties:
        category:
          type: string
        name:
          type: string
        settings:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.organization_settings.Setting'
    jumpcloud.organization_settings.Setting:
      type: object
      properties:
        name:
          type: string
        value: {}
    ErrorDetails:
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          details:
            description: 'Describes a list of objects with more detailed information of the given error. Each detail schema is according to one of the messages defined in Google''s API: https://github.com/googleapis/googleapis/blob/master/google/rpc/error_details.proto'
            type: array
            items:
              type: object
              additionalProperties: true
              description: Object according to Google's API.
    jumpcloud.organization_settings.ListFeatureSettingsResponse:
      type: object
      properties:
        features:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.organization_settings.Feature'
  requestBodies:
    AccessRiskSettingsService_UpdateBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              value: {}
      required: true
  securitySchemes:
    x-api-key:
      description: API key used to authenticate requests.
      in: header
      name: x-api-key
      type: apiKey
