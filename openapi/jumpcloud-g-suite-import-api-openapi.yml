openapi: 3.2.0
info:
  contact:
    name: JumpCloud Support
    url: https://jumpcloud.com/support/contact-jumpcloud-support
  description: '# Overview


    JumpCloud''s V2 API. This set of endpoints allows JumpCloud customers to manage objects, groupings and mappings and interact with the JumpCloud Graph. > **Note:** See JumpCloud Data Centers: Login URLs and Service Endpoints to learn more. ## API Best Practices


    Read the linked Help Article below for guidance on retrying failed requests to JumpCloud''s REST API, as well as best practices for structuring subsequent retry requests. Customizing retry mechanisms based on these recommendations will increase the reliability and dependability of your API calls. Covered topics include:

    1. Important Considerations

    2. Supported HTTP Request Methods

    3. Response codes

    4. API Key rotation

    5. Paginating

    6. Error handling

    7. Retry rates


    JumpCloud Help Center - API Best Practices


    # Directory Objects


    This API offers the ability to interact with some of our core features; otherwise known as Directory Objects. The Directory Objects are:


    * Commands

    * Policies

    * Policy Groups

    * Applications

    * Systems

    * Users

    * User Groups

    * System Groups

    * Radius Servers

    * Directories: Office 365, LDAP,G-Suite, Active Directory

    * Duo accounts and applications. The Directory Object is an important concept to understand in order to successfully use JumpCloud API. ## JumpCloud Graph


    We''ve also introduced the concept of the JumpCloud Graph along with Directory Objects. The Graph is a powerful aspect of our platform which will enable you to associate objects with each other, or establish membership for certain objects to become members of other objects. Specific `GET` endpoints will allow you to traverse the JumpCloud Graph to return all indirect and directly bound objects in your organization. | !alt text |

    |:--:|

    | **This diagram highlights our association and membership model as it relates to Directory Objects.** |


    # API Key


    ## Access Your API Key


    To locate your API Key:


    1. Log into the JumpCloud Admin Console. 2. Go to the username drop down located in the top-right of the Console. 3. Retrieve your API key from API Settings. ## API Key Considerations


    This API key is associated to the currently logged in administrator. Other admins will have different API keys. **WARNING** Please keep this API key secret, as it grants full access to any data accessible via your JumpCloud console account. You can also reset your API key in the same location in the JumpCloud Admin Console. ## Recycling or Resetting Your API Key


    In order to revoke access with the current API key, simply reset your API key. This will render all calls using the previous API key inaccessible. Your API key will be passed in as a header with the header name "x-api-key". ```bash

    curl -H "x-api-key: [YOUR_API_KEY_HERE]" "https://console.jumpcloud.com/api/v2/systemgroups"

    ```


    # System Context


    * Introduction

    * Supported endpoints

    * Response codes

    * Authentication

    * Additional examples

    * Third party


    ## Introduction


    JumpCloud System Context Authorization is an alternative way to authenticate with a subset of JumpCloud''s REST APIs. Using this method, a system can manage its information and resource associations, allowing modern auto provisioning environments to scale as needed. **Notes:**


    * The following documentation applies to Linux Operating Systems only. * Systems that have been automatically enrolled using Apple''s Device Enrollment Program (DEP) or systems enrolled using the User Portal install are not eligible to use the System Context API to prevent unauthorized access to system groups and resources. If a script that utilizes the System Context API is invoked on a system enrolled in this way, it will display an error. ## Supported Endpoints


    JumpCloud System Context Authorization can be used in conjunction with Systems endpoints found in the V1 API and certain System Group endpoints found in the v2 API.'
  title: JumpCloud G Suite Import API
  version: '2.0'
servers:
- url: https://console.jumpcloud.com/api/v2
  description: United States (US)
  x-jc-region: us
- url: https://console.eu.jumpcloud.com/api/v2
  description: European Union (EU)
  x-jc-region: eu
- url: https://console.in.jumpcloud.com/api/v2
  description: India (IN)
  x-jc-region: in
tags:
- name: G Suite Import
paths:
  /gsuites/{gsuite_id}/import/users:
    parameters:
    - name: gsuite_id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Get a list of users to import from a G Suite instance
      tags:
      - G Suite Import
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  nextPageToken:
                    type: string
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        primaryEmail:
                          type: string
                        givenName:
                          type: string
                        familyName:
                          type: string
                        thumbnailPhotoUrl:
                          type: string
      operationId: gsuites_listImportUsers
      security:
      - x-api-key: []
      x-scopes:
      - directories
      - directories.readonly
      parameters:
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_gsuite_maxResults'
      - $ref: '#/components/parameters/trait_gsuite_orderBy'
      - $ref: '#/components/parameters/trait_gsuite_pageToken'
      - $ref: '#/components/parameters/trait_gsuite_query'
      - $ref: '#/components/parameters/trait_gsuite_sortOrder'
      description: Lists G Suite users available for import.
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/gsuites/{gsuite_id}/import/users?limit=SOME_INTEGER_VALUE&maxResults=SOME_INTEGER_VALUE&orderBy=SOME_STRING_VALUE&pageToken=SOME_STRING_VALUE&query=SOME_STRING_VALUE&sortOrder=SOME_STRING_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/gsuites/{gsuite_id}/import/users"


          querystring = {"limit":"SOME_INTEGER_VALUE","maxResults":"SOME_INTEGER_VALUE","orderBy":"SOME_STRING_VALUE","pageToken":"SOME_STRING_VALUE","query":"SOME_STRING_VALUE","sortOrder":"SOME_STRING_VALUE"}


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/gsuites/{gsuite_id}/import/users?limit=SOME_INTEGER_VALUE&maxResults=SOME_INTEGER_VALUE&orderBy=SOME_STRING_VALUE&pageToken=SOME_STRING_VALUE&query=SOME_STRING_VALUE&sortOrder=SOME_STRING_VALUE'' -Method GET -Headers $headers'
  /gsuites/{gsuite_id}/import/jumpcloudusers:
    parameters:
    - name: gsuite_id
      in: path
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - users-import-google
    get:
      summary: Get a list of users in Jumpcloud format to import from a Google Workspace…
      tags:
      - G Suite Import
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  nextPageToken:
                    type: string
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
      operationId: gsuites_listImportJumpcloudUsers
      security:
      - x-api-key: []
      x-scopes:
      - directories
      - directories.readonly
      parameters:
      - $ref: '#/components/parameters/trait_gsuite_allowEmptyFields'
      - $ref: '#/components/parameters/trait_gsuite_maxResults'
      - $ref: '#/components/parameters/trait_gsuite_orderBy'
      - $ref: '#/components/parameters/trait_gsuite_pageToken'
      - $ref: '#/components/parameters/trait_gsuite_query'
      - $ref: '#/components/parameters/trait_gsuite_sortOrder'
      description: Lists available G Suite users for import, translated to the Jumpcloud user schema.
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/gsuites/{gsuite_id}/import/jumpcloudusers?allowEmptyFields=SOME_BOOLEAN_VALUE&maxResults=SOME_INTEGER_VALUE&orderBy=SOME_STRING_VALUE&pageToken=SOME_STRING_VALUE&query=SOME_STRING_VALUE&sortOrder=SOME_STRING_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/gsuites/{gsuite_id}/import/jumpcloudusers"


          querystring = {"allowEmptyFields":"SOME_BOOLEAN_VALUE","maxResults":"SOME_INTEGER_VALUE","orderBy":"SOME_STRING_VALUE","pageToken":"SOME_STRING_VALUE","query":"SOME_STRING_VALUE","sortOrder":"SOME_STRING_VALUE"}


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/gsuites/{gsuite_id}/import/jumpcloudusers?allowEmptyFields=SOME_BOOLEAN_VALUE&maxResults=SOME_INTEGER_VALUE&orderBy=SOME_STRING_VALUE&pageToken=SOME_STRING_VALUE&query=SOME_STRING_VALUE&sortOrder=SOME_STRING_VALUE'' -Method GET -Headers $headers'
components:
  parameters:
    trait_gsuite_allowEmptyFields:
      in: query
      name: allowEmptyFields
      description: '[EXPERIMENTAL] Allow empty fields of the user object to be sent in the response'
      schema:
        type: boolean
        default: false
    trait_gsuite_orderBy:
      in: query
      name: orderBy
      description: Google Directory API sort field parameter. See https://developers.google.com/admin-sdk/directory/reference/rest/v1/users/list.
      schema:
        type: string
    trait_gsuite_pageToken:
      in: query
      name: pageToken
      description: Google Directory API token used to access the next page of results. See https://developers.google.com/admin-sdk/directory/reference/rest/v1/users/list.
      schema:
        type: string
    trait_gsuite_query:
      in: query
      name: query
      description: Google Directory API search parameter. See https://developers.google.com/admin-sdk/directory/v1/guides/search-users.
      schema:
        type: string
    trait_limit_limit:
      description: The number of records to return at once. Limited to 100.
      in: query
      name: limit
      schema:
        type: integer
        default: 10
    trait_gsuite_maxResults:
      in: query
      name: maxResults
      description: Google Directory API maximum number of results per page. See https://developers.google.com/admin-sdk/directory/reference/rest/v1/users/list.
      schema:
        type: integer
    trait_gsuite_sortOrder:
      in: query
      name: sortOrder
      description: Google Directory API sort direction parameter. See https://developers.google.com/admin-sdk/directory/reference/rest/v1/users/list.
      schema:
        type: string
  schemas:
    User:
      title: User
      type: object
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        alternateEmail:
          type: string
        company:
          maxLength: 1024
          type: string
        costCenter:
          maxLength: 1024
          type: string
        department:
          maxLength: 1024
          type: string
        email:
          maxLength: 1024
          type: string
        employeeIdentifier:
          description: Must be unique per user.
          maxLength: 256
          type: string
        employeeType:
          maxLength: 1024
          type: string
        firstname:
          maxLength: 1024
          type: string
        jobTitle:
          maxLength: 1024
          type: string
        lastname:
          maxLength: 1024
          type: string
        location:
          maxLength: 1024
          type: string
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumber'
    PhoneNumber:
      type: object
      properties:
        id:
          type: string
        number:
          maxLength: 1024
          type: string
        type:
          maxLength: 1024
          type: string
    Address:
      type: object
      properties:
        country:
          maxLength: 1024
          type: string
        extendedAddress:
          maxLength: 1024
          type: string
        id:
          type: string
        locality:
          maxLength: 1024
          type: string
        poBox:
          maxLength: 1024
          type: string
        postalCode:
          maxLength: 1024
          type: string
        region:
          maxLength: 1024
          type: string
        streetAddress:
          maxLength: 1024
          type: string
        type:
          maxLength: 1024
          type: string
  securitySchemes:
    x-api-key:
      description: API key used to authenticate requests.
      in: header
      name: x-api-key
      type: apiKey
