paths:
  /devices/settings/signinwithjumpcloud:
    get:
      summary: Get the Sign In with JumpCloud Settings
      description: 'Gets the Sign In with JumpCloud Settings for an Organization.


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/devices/settings/signinwithjumpcloud \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key:{API_KEY}''

        ```'
      operationId: SystemsOrgSettings_GetSignInWithJumpCloudSettings
      responses:
        '200':
          description: Settings successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/devices.GetSignInWithJumpCloudSettingsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: organizationObjectId
        in: query
        required: false
        schema:
          type: string
          format: byte
      tags:
      - Systems Organization Settings
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - systems
      - systems.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/devices/settings/signinwithjumpcloud?organizationObjectId=SOME_STRING_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/devices/settings/signinwithjumpcloud"


          querystring = {"organizationObjectId":"SOME_STRING_VALUE"}


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/devices/settings/signinwithjumpcloud?organizationObjectId=SOME_STRING_VALUE'' -Method GET -Headers $headers'
    put:
      summary: Set the Sign In with JumpCloud Settings
      description: 'Sets the Sign In with JumpCloud Settings for an Organization.


        #### Sample Request

        ```

        curl -X PUT https://console.jumpcloud.com/api/v2/devices/settings/signinwithjumpcloud \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key:{API_KEY}'' \

        -d ''{"settings":[{"osFamily":"WINDOWS","enabled":true,"defaultPermission":"STANDARD"}]}''

        ```'
      operationId: SystemsOrgSettings_SetSignInWithJumpCloudSettings
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '204':
          description: Settings successfully changed.
          content:
            application/json:
              schema: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/devices.SetSignInWithJumpCloudSettingsRequest'
        required: true
      tags:
      - Systems Organization Settings
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - systems
      x-codeSamples:
      - lang: Shell
        source: "curl --request PUT \\\n  --url https://console.jumpcloud.com/api/v2/devices/settings/signinwithjumpcloud \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"organizationObjectId\":\"string\",\"settings\":[{\"defaultPermission\":\"STANDARD\",\"enabled\":true,\"osFamily\":\"UNKNOWN\"}]}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/devices/settings/signinwithjumpcloud\"\n\npayload = {\n    \"organizationObjectId\": \"string\",\n    \"settings\": [\n        {\n            \"defaultPermission\": \"STANDARD\",\n            \"enabled\": True,\n            \"osFamily\": \"UNKNOWN\"\n        }\n    ]\n}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"PUT\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/devices/settings/signinwithjumpcloud'' -Method PUT -Headers $headers -ContentType ''application/json'' -Body ''{"organizationObjectId":"string","settings":[{"defaultPermission":"STANDARD","enabled":true,"osFamily":"UNKNOWN"}]}'''
