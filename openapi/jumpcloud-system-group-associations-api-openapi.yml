paths:
  /systemgroups/{group_id}/associations:
    parameters:
    - description: ObjectID of the System Group.
      in: path
      name: group_id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - systemgroups
    get:
      description: 'This endpoint returns the _direct_ associations of a System Group.


        A direct association can be a non-homogeneous relationship between 2 different objects, for example System Groups and Users.


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/systemgroups/{GroupID}/associations?targets=user \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: graph_systemGroupAssociationsList
      parameters:
      - $ref: '#/components/parameters/trait_graphTargetsSystemGroup_targets'
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GraphConnection'
                type: array
      security:
      - x-api-key: []
      summary: List the associations of a System Group
      tags:
      - System Group Associations
      x-scopes:
      - associations.groups
      - associations.groups.readonly
      - associations
      - associations.readonly
      - associations.self
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/systemgroups/{group_id}/associations?targets=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/systemgroups/{group_id}/associations\"\n\nquerystring = {\"targets\":\"SOME_ARRAY_VALUE\",\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/systemgroups/{group_id}/associations?targets=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE'' -Method GET -Headers $headers'
    post:
      description: 'This endpoint allows you to manage the _direct_ associations of a System Group.


        A direct association can be a non-homogeneous relationship between 2 different objects, for example System Groups and Users.


        #### Sample Request

        ```

        curl -X POST https://console.jumpcloud.com/api/v2/systemgroups/{GroupID}/associations \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        "op": "add",

        "type": "user",

        "id": "{UserID}"

        }''

        ```'
      operationId: graph_systemGroupAssociationsPost
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphOperation-SystemGroup'
      responses:
        '204':
          description: OK
      security:
      - x-api-key: []
      summary: Manage the associations of a System Group
      tags:
      - System Group Associations
      x-scopes:
      - associations.groups
      - associations
      - associations.self
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/systemgroups/{group_id}/associations \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '{\"id\":\"string\",\"op\":\"add\",\"attributes\":{},\"type\":\"command\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/systemgroups/{group_id}/associations\"\n\npayload = {\n    \"id\": \"string\",\n    \"op\": \"add\",\n    \"attributes\": {},\n    \"type\": \"command\"\n}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/systemgroups/{group_id}/associations'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"id":"string","op":"add","attributes":{},"type":"command"}'''
  /systemgroups/{group_id}/commands:
    parameters:
    - description: ObjectID of the System Group.
      in: path
      name: group_id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - systemgroups
    - commands
    get:
      description: 'This endpoint will return all Commands bound to a System Group, either directly or indirectly, essentially traversing the JumpCloud Graph for your Organization.


        Each element will contain the group''s type, id, attributes and paths.


        The `attributes` object is a key/value hash of compiled graph attributes for all paths followed.


        The `paths` array enumerates each path from this System Group to the corresponding Command; this array represents all grouping and/or associations that would have to be removed to deprovision the Command from this System Group.


        See `/members` and `/associations` endpoints to manage those collections.


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/systemgroups/{GroupID}/commands \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
