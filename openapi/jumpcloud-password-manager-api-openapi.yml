        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/passwordmanager/sharedfolders/{folderId}/manage\"\n\npayload = {\n    \"userGroups\": {\n        \"addition\": [\n            {\n                \"accessLevelId\": \"string\",\n                \"id\": \"string\"\n            }\n        ],\n        \"deletion\": [\"string\"],\n        \"update\": [\n            {\n                \"accessLevelId\": \"string\",\n                \"id\": \"string\"\n            }\n        ]\n    },\n    \"users\": {\n        \"addition\": [\n            {\n                \"accessLevelId\": \"string\",\n                \"id\": \"string\"\n            }\n        ],\n        \"deletion\": [\"string\"],\n        \"update\": [\n            {\n                \"accessLevelId\": \"string\",\n                \"id\": \"string\"\n            }\n        ]\n    }\n}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/passwordmanager/sharedfolders/{folderId}/manage'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"userGroups":{"addition":[{"accessLevelId":"string","id":"string"}],"deletion":["string"],"update":[{"accessLevelId":"string","id":"string"}]},"users":{"addition":[{"accessLevelId":"string","id":"string"}],"deletion":["string"],"update":[{"accessLevelId":"string","id":"string"}]}}'''
  /password-manager:
    get:
      summary: List Password Manager Organization
      description: Get Password Manager Organization
      operationId: Config_Get
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.password_manager.GetConfigResponse'
      parameters:
      - name: organizationObjectId
        in: query
        required: false
        schema:
          type: string
          format: byte
      tags:
      - Password Manager
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - passwordmanager
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/password-manager?organizationObjectId=SOME_STRING_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/password-manager"


          querystring = {"organizationObjectId":"SOME_STRING_VALUE"}


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/password-manager?organizationObjectId=SOME_STRING_VALUE'' -Method GET -Headers $headers'
