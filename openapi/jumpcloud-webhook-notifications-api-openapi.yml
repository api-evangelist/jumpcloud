openapi: 3.2.0
info:
  contact:
    name: JumpCloud Support
    url: https://jumpcloud.com/support/contact-jumpcloud-support
  description: '# Overview


    JumpCloud''s V2 API. This set of endpoints allows JumpCloud customers to manage objects, groupings and mappings and interact with the JumpCloud Graph. > **Note:** See JumpCloud Data Centers: Login URLs and Service Endpoints to learn more. ## API Best Practices


    Read the linked Help Article below for guidance on retrying failed requests to JumpCloud''s REST API, as well as best practices for structuring subsequent retry requests. Customizing retry mechanisms based on these recommendations will increase the reliability and dependability of your API calls. Covered topics include:

    1. Important Considerations

    2. Supported HTTP Request Methods

    3. Response codes

    4. API Key rotation

    5. Paginating

    6. Error handling

    7. Retry rates


    JumpCloud Help Center - API Best Practices


    # Directory Objects


    This API offers the ability to interact with some of our core features; otherwise known as Directory Objects. The Directory Objects are:


    * Commands

    * Policies

    * Policy Groups

    * Applications

    * Systems

    * Users

    * User Groups

    * System Groups

    * Radius Servers

    * Directories: Office 365, LDAP,G-Suite, Active Directory

    * Duo accounts and applications. The Directory Object is an important concept to understand in order to successfully use JumpCloud API. ## JumpCloud Graph


    We''ve also introduced the concept of the JumpCloud Graph along with Directory Objects. The Graph is a powerful aspect of our platform which will enable you to associate objects with each other, or establish membership for certain objects to become members of other objects. Specific `GET` endpoints will allow you to traverse the JumpCloud Graph to return all indirect and directly bound objects in your organization. | !alt text |

    |:--:|

    | **This diagram highlights our association and membership model as it relates to Directory Objects.** |


    # API Key


    ## Access Your API Key


    To locate your API Key:


    1. Log into the JumpCloud Admin Console. 2. Go to the username drop down located in the top-right of the Console. 3. Retrieve your API key from API Settings. ## API Key Considerations


    This API key is associated to the currently logged in administrator. Other admins will have different API keys. **WARNING** Please keep this API key secret, as it grants full access to any data accessible via your JumpCloud console account. You can also reset your API key in the same location in the JumpCloud Admin Console. ## Recycling or Resetting Your API Key


    In order to revoke access with the current API key, simply reset your API key. This will render all calls using the previous API key inaccessible. Your API key will be passed in as a header with the header name "x-api-key". ```bash

    curl -H "x-api-key: [YOUR_API_KEY_HERE]" "https://console.jumpcloud.com/api/v2/systemgroups"

    ```


    # System Context


    * Introduction

    * Supported endpoints

    * Response codes

    * Authentication

    * Additional examples

    * Third party


    ## Introduction


    JumpCloud System Context Authorization is an alternative way to authenticate with a subset of JumpCloud''s REST APIs. Using this method, a system can manage its information and resource associations, allowing modern auto provisioning environments to scale as needed. **Notes:**


    * The following documentation applies to Linux Operating Systems only. * Systems that have been automatically enrolled using Apple''s Device Enrollment Program (DEP) or systems enrolled using the User Portal install are not eligible to use the System Context API to prevent unauthorized access to system groups and resources. If a script that utilizes the System Context API is invoked on a system enrolled in this way, it will display an error. ## Supported Endpoints


    JumpCloud System Context Authorization can be used in conjunction with Systems endpoints found in the V1 API and certain System Group endpoints found in the v2 API.'
  title: JumpCloud Webhook Notifications API
  version: '2.0'
servers:
- url: https://console.jumpcloud.com/api/v2
  description: United States (US)
  x-jc-region: us
- url: https://console.eu.jumpcloud.com/api/v2
  description: European Union (EU)
  x-jc-region: eu
- url: https://console.in.jumpcloud.com/api/v2
  description: India (IN)
  x-jc-region: in
tags:
- name: Webhook Notifications
paths:
  /notifications/webhook/test:
    post:
      summary: This endpoint is used to test a webhook
      description: This endpoint allows you to test a webhook.
      operationId: NotificationsChannelsService_TestWebhook
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.notifications.WebhookTestResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jumpcloud.notifications.WebhookTestRequest'
        required: true
      tags:
      - Webhook Notifications
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - notifications.channels
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/notifications/webhook/test \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"organizationObjectId\":\"string\",\"postSave\":{\"authPassword\":\"string\",\"authToken\":\"string\",\"authType\":\"WEBHOOK_AUTH_TYPE_UNSPECIFIED\",\"authUsername\":\"string\",\"customHeaders\":[{\"key\":\"string\",\"masked\":true,\"objectId\":\"string\",\"value\":\"string\"}],\"maskedUrlPortion\":[{\"key\":\"string\",\"objectId\":\"string\",\"value\":\"string\"}],\"objectId\":\"string\",\"sslVerification\":true,\"url\":\"string\",\"urlMasked\":true},\"preSave\":{\"authPassword\":\"string\",\"authToken\":\"string\",\"authType\":\"WEBHOOK_AUTH_TYPE_UNSPECIFIED\",\"authUsername\":\"string\",\"customHeaders\":[{\"key\":\"string\",\"masked\":true,\"objectId\":\"string\",\"value\":\"string\"}],\"sslVerification\":true,\"url\":\"string\",\"urlMasked\":true}}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/notifications/webhook/test\"\n\npayload = {\n    \"organizationObjectId\": \"string\",\n    \"postSave\": {\n        \"authPassword\": \"string\",\n        \"authToken\": \"string\",\n        \"authType\": \"WEBHOOK_AUTH_TYPE_UNSPECIFIED\",\n        \"authUsername\": \"string\",\n        \"customHeaders\": [\n            {\n                \"key\": \"string\",\n                \"masked\": True,\n                \"objectId\": \"string\",\n                \"value\": \"string\"\n            }\n        ],\n        \"maskedUrlPortion\": [\n            {\n                \"key\": \"string\",\n                \"objectId\": \"string\",\n                \"value\": \"string\"\n            }\n        ],\n        \"objectId\": \"string\",\n        \"sslVerification\": True,\n        \"url\": \"string\",\n        \"urlMasked\": True\n    },\n    \"preSave\": {\n        \"authPassword\": \"string\",\n        \"authToken\": \"string\",\n        \"authType\": \"WEBHOOK_AUTH_TYPE_UNSPECIFIED\",\n        \"authUsername\": \"string\",\n        \"customHeaders\": [\n            {\n                \"key\": \"string\",\n                \"masked\": True,\n                \"objectId\": \"string\",\n                \"value\": \"string\"\n            }\n        ],\n        \"sslVerification\": True,\n        \"url\": \"string\",\n        \"urlMasked\": True\n    }\n}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/notifications/webhook/test'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"organizationObjectId":"string","postSave":{"authPassword":"string","authToken":"string","authType":"WEBHOOK_AUTH_TYPE_UNSPECIFIED","authUsername":"string","customHeaders":[{"key":"string","masked":true,"objectId":"string","value":"string"}],"maskedUrlPortion":[{"key":"string","objectId":"string","value":"string"}],"objectId":"string","sslVerification":true,"url":"string","urlMasked":true},"preSave":{"authPassword":"string","authToken":"string","authType":"WEBHOOK_AUTH_TYPE_UNSPECIFIED","authUsername":"string","customHeaders":[{"key":"string","masked":true,"objectId":"string","value":"string"}],"sslVerification":true,"url":"string","urlMasked":true}}'''
components:
  schemas:
    jumpcloud.notifications.PreSaveWebhookRequest:
      type: object
      properties:
        authPassword:
          type: string
        authToken:
          type: string
        authType:
          $ref: '#/components/schemas/jumpcloud.notifications.WebhookAuthType'
        authUsername:
          type: string
        customHeaders:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.notifications.CustomHeaders'
        sslVerification:
          type: boolean
        url:
          type: string
        urlMasked:
          type: boolean
      description: PreSaveWebhookRequest represents the request to test a webhook before saving.
    jumpcloud.notifications.CustomHeaders:
      type: object
      properties:
        key:
          type: string
        masked:
          type: boolean
        objectId:
          type: string
          format: byte
        value:
          type: string
      description: CustomHeaders represents the custom headers for the webhook.
    jumpcloud.notifications.MaskedURLPortion:
      type: object
      properties:
        key:
          type: string
        objectId:
          type: string
          format: byte
        value:
          type: string
      description: MaskedURLPortion represents the masked portion of the URL.
    jumpcloud.notifications.WebhookTestResponse:
      type: object
      properties:
        responseMessage:
          type: string
        statusCode:
          type: integer
          format: int32
    jumpcloud.notifications.WebhookAuthType:
      type: string
      enum:
      - WEBHOOK_AUTH_TYPE_UNSPECIFIED
      - WEBHOOK_AUTH_TYPE_BASIC
      - WEBHOOK_AUTH_TYPE_BEARER
      default: WEBHOOK_AUTH_TYPE_UNSPECIFIED
      description: "WebhookAuthType represents the authentication type for the webhook.\n\n - WEBHOOK_AUTH_TYPE_UNSPECIFIED: WEBHOOK_AUTH_TYPE_UNSPECIFIED represents an invalid authentication type.\n - WEBHOOK_AUTH_TYPE_BASIC: WEBHOOK_AUTH_TYPE_BASIC represents basic authentication.\n - WEBHOOK_AUTH_TYPE_BEARER: WEBHOOK_AUTH_TYPE_BEARER represents bearer token authentication."
    jumpcloud.notifications.PostSaveWebhookRequest:
      type: object
      properties:
        authPassword:
          type: string
        authToken:
          type: string
        authType:
          $ref: '#/components/schemas/jumpcloud.notifications.WebhookAuthType'
        authUsername:
          type: string
        customHeaders:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.notifications.CustomHeaders'
        maskedUrlPortion:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.notifications.MaskedURLPortion'
        objectId:
          type: string
          format: byte
        sslVerification:
          type: boolean
        url:
          type: string
        urlMasked:
          type: boolean
      description: PostSaveWebhookRequest represents the request to test a webhook after saving.
    jumpcloud.notifications.WebhookTestRequest:
      type: object
      properties:
        organizationObjectId:
          type: string
          format: byte
        postSave:
          $ref: '#/components/schemas/jumpcloud.notifications.PostSaveWebhookRequest'
        preSave:
          $ref: '#/components/schemas/jumpcloud.notifications.PreSaveWebhookRequest'
  securitySchemes:
    x-api-key:
      description: API key used to authenticate requests.
      in: header
      name: x-api-key
      type: apiKey
