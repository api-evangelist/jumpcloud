  /softwareapps/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - devices-windows-software-app-crud
    - devices-darwin-software-app-crud
    delete:
      description: 'Removes a Software Application configuration.


        Warning: This is a destructive operation and will unmanage the application on all affected systems.


        #### Sample Request

        ```

        curl -X DELETE https://console.jumpcloud.com/api/v2/softwareapps/{id} \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: softwareApps_delete
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      responses:
        '204':
          description: ''
        '400':
          $ref: '#/components/responses/trait_standardErrors_400'
        '401':
          $ref: '#/components/responses/trait_standardErrors_401'
        '403':
          $ref: '#/components/responses/trait_standardErrors_403'
        '404':
          $ref: '#/components/responses/trait_standardErrors_404'
        '409':
          $ref: '#/components/responses/trait_standardErrors_409'
        '500':
          $ref: '#/components/responses/trait_standardErrors_500'
      security:
      - x-api-key: []
      summary: Delete a configured Software Application
      tags:
      - Software Apps
      x-scopes:
      - systems
      x-codeSamples:
      - lang: Shell
        source: "curl --request DELETE \\\n  --url https://console.jumpcloud.com/api/v2/softwareapps/{id} \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/softwareapps/{id}\"\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"DELETE\", url, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/softwareapps/{id}'' -Method DELETE -Headers $headers'
    put:
      summary: Update a Software Application Configuration
      description: 'This endpoint updates a specific Software Application configuration for the organization.

        displayName can be changed alone if no settings are provided.

        If a setting is provided, it should include all its information since this endpoint will update all the settings'' fields.

        The optional isConfigEnabled and appConfiguration apple_vpp attributes are not included in the response.


        #### Sample Request - displayName only

        ```

        curl -X PUT https://console.jumpcloud.com/api/v2/softwareapps/{id} \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        "displayName": "My Software App"

        }''

        ```


        #### Sample Request - all attributes

        ```

        curl -X PUT https://console.jumpcloud.com/api/v2/softwareapps/{id} \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        "displayName": "My Software App",

        "settings": [

        {

        "packageId": "123456",

        "autoUpdate": false,

        "allowUpdateDelay": false,

        "packageManager": "APPLE_VPP",

        "locationObjectId": "123456789012123456789012",

        "location": "123456",

        "desiredState": "Install",

        "appleVpp": {

        "appConfiguration": "MyKeyMy String",

        "assignedLicenses": 20,

        "availableLicenses": 10,

        "details": {},

        "isConfigEnabled": true,

        "supportedDeviceFamilies": [

        "IPAD",

        "MAC"

        ],

        "totalLicenses": 30

        },

        "packageSubtitle": "My package subtitle",

        "packageVersion": "1.2.3",

        "packageKind": "software-package",

        "assetKind": "software",

        "assetSha256Size": 256,

        "assetSha256Strings": [

        "a123b123c123d123"

        ],

        "description": "My app description"

        }

        ]

        }''

        ```'
      operationId: softwareApps_update
      tags:
      - Software Apps
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/software-app'
        x-examples:
          displayName-only:
            displayName: My Software App
          all-attributes:
