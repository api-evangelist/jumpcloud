    get:
      description: 'This endpoint allows you to get all configured Software Applications that will be managed by JumpCloud on associated JumpCloud systems.

        The optional isConfigEnabled and appConfiguration apple_vpp attributes are not included in the response.


        #### Sample Request

        ```

        $ curl -X GET https://console.jumpcloud.com/api/v2/softwareapps \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        ```'
      operationId: softwareApps_list
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      - $ref: '#/components/parameters/trait_filter_filter'
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_sort_sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/software-app'
      security:
      - x-api-key: []
      x-scopes:
      - systems
      - systems.readonly
      summary: Get all configured Software Applications
      tags:
      - Software Apps
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/softwareapps?filter=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/softwareapps\"\n\nquerystring = {\"filter\":\"SOME_ARRAY_VALUE\",\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\",\"sort\":\"SOME_ARRAY_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/softwareapps?filter=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE'' -Method GET -Headers $headers'
    post:
      description: 'This endpoint allows you to create a Software Application that will be managed by JumpCloud on associated JumpCloud systems.

        The optional isConfigEnabled and appConfiguration apple_vpp attributes are not included in the response.


        #### Sample Request

        ```

        $ curl -X POST https://console.jumpcloud.com/api/v2/softwareapps \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        "displayName": "Adobe Reader",

        "settings": [{"packageId": "adobereader"}]

        }''

        ```'
      operationId: softwareApps_post
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/software-app'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/software-app-create'
      security:
      - x-api-key: []
      summary: Create a Software Application that will be managed by JumpCloud
      x-scopes:
      - systems
      tags:
