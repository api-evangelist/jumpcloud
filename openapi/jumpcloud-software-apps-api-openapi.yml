    trait_standardErrors_403:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    trait_standardErrors_404:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    trait_standardErrors_401:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    trait_standardErrors_400:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetails'
  parameters:
    trait_limit_limit:
      description: The number of records to return at once. Limited to 100.
      in: query
      name: limit
      schema:
        type: integer
        default: 10
    trait_graphTargetsSoftwareApp_targets:
      name: targets
      description: Targets which a "software_app" can be associated to.
      in: query
      required: true
      style: form
      explode: false
      schema:
        type: array
        items:
          enum:
          - system
          - system_group
          type: string
    trait_filter_filter:
      description: 'A filter to apply to the query.


        **Filter structure**: `<field>:<operator>:<value>`.


        **field** = Populate with a valid field from an endpoint response.


        **operator** =  Supported operators are: eq, ne, gt, ge, lt, le, between, search, in.

        _Note: v1 operators differ from v2 operators._


        **value** = Populate with the value you want to search for. Is case sensitive. Supports wild cards.


        **EX:** `GET /api/v2/groups?filter=name:eq:Test+Group`'
      in: query
      name: filter
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        default: []
    trait_skip_skip:
      description: The offset into the records to return.
      in: query
      name: skip
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    trait_sort_sort:
      description: 'The comma separated fields used to sort the collection.

        Default sort is ascending, prefix with `-` to sort descending.

        '
      in: query
      name: sort
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        default: []
    trait_multiTenantRequestHeaders_x-org-id:
      description: Organization identifier that can be obtained from console settings.
      in: header
      name: x-org-id
      schema:
        type: string
  securitySchemes:
    x-api-key:
      description: API key used to authenticate requests.
      in: header
      name: x-api-key
      type: apiKey
