components:
  schemas:
    Error:
      title: Error
      type: object
      x-examples: {}
      description: ''
      properties:
        code:
          format: int32
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Error message
        status:
          type: string
          description: HTTP status description
    AdministratorOrganizationLinkReq:
      examples:
      - organization: 6230a0d26a4e4bc86c6b36f1
      properties:
        organization:
          description: The identifier for an organization to link this administrator to.
          type: string
      title: AdministratorOrganizationLinkReq
      type: object
    AdministratorOrganizationLink:
      examples:
      - administrator: 6230a0c233a6cbea7c470398
        organization: 6230a0d26a4e4bc86c6b36f1
      properties:
        administrator:
          description: The identifier for an administrator
          type: string
        organization:
          description: The identifier for an organization
          type: string
      title: AdministratorOrganizationLink
      type: object
    CasesResponse:
      title: CasesResponse
      type: object
      description: Response for retrieving the cases (support/feature requests)
      properties:
        totalCount:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Case'
    Case:
      title: Case
      type: object
      description: Details of the case (support/feature request)
      properties:
        caseNumber:
          type: string
        label:
          type: string
        status:
          type: string
        date:
          type: string
        subject:
          type: string
        description:
          type: string
        reporter:
          type: string
        reporterEmail:
          type: string
        organization:
          type: string
        os:
          type: string
        caseSubmissionProductType:
          type: string
    ErrorDetails:
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          details:
            description: 'Describes a list of objects with more detailed information of the given error. Each detail schema is according to one of the messages defined in Google''s API: https://github.com/googleapis/googleapis/blob/master/google/rpc/error_details.proto'
            type: array
            items:
              type: object
              additionalProperties: true
              description: Object according to Google's API.
  responses:
    trait_standardErrors_404:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    trait_standardErrors_403:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    trait_standardErrors_401:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    trait_standardErrors_500:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    trait_standardErrors_400:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetails'
  parameters:
    trait_limit_limit:
      description: The number of records to return at once. Limited to 100.
      in: query
      name: limit
      schema:
        type: integer
        default: 10
    trait_filter_filter:
      description: 'A filter to apply to the query.


        **Filter structure**: `<field>:<operator>:<value>`.


        **field** = Populate with a valid field from an endpoint response.


        **operator** =  Supported operators are: eq, ne, gt, ge, lt, le, between, search, in.

        _Note: v1 operators differ from v2 operators._


        **value** = Populate with the value you want to search for. Is case sensitive. Supports wild cards.


        **EX:** `GET /api/v2/groups?filter=name:eq:Test+Group`'
      in: query
      name: filter
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        default: []
    trait_skip_skip:
      description: The offset into the records to return.
      in: query
      name: skip
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    trait_sort_sort:
      description: 'The comma separated fields used to sort the collection.

        Default sort is ascending, prefix with `-` to sort descending.

        '
      in: query
      name: sort
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        default: []
  securitySchemes:
    x-api-key:
      description: API key used to authenticate requests.
      in: header
      name: x-api-key
      type: apiKey
