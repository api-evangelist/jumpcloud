paths:
  /administrators/{id}/organizationlinks:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - admin
    get:
      description: This endpoint returns the association links between an Administrator and Organizations.
      operationId: administratorOrganizations_listByAdministrator
      parameters:
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_skip_skip'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AdministratorOrganizationLink'
                type: array
        '400':
          $ref: '#/components/responses/trait_standardErrors_400'
        '401':
          $ref: '#/components/responses/trait_standardErrors_401'
        '403':
          $ref: '#/components/responses/trait_standardErrors_403'
        '404':
          $ref: '#/components/responses/trait_standardErrors_404'
        '500':
          $ref: '#/components/responses/trait_standardErrors_500'
      security:
      - x-api-key: []
      summary: List the association links between an Administrator and Organizations
      tags:
      - Organizations
      x-scopes:
      - administrators
      - administrators.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/administrators/{id}/organizationlinks?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/administrators/{id}/organizationlinks"


          querystring = {"limit":"SOME_INTEGER_VALUE","skip":"SOME_INTEGER_VALUE"}


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/administrators/{id}/organizationlinks?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE'' -Method GET -Headers $headers'
    post:
      description: This endpoint allows you to grant Administrator access to an Organization.
      operationId: administratorOrganizations_createByAdministrator
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdministratorOrganizationLinkReq'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorOrganizationLink'
        '400':
          $ref: '#/components/responses/trait_standardErrors_400'
        '401':
          $ref: '#/components/responses/trait_standardErrors_401'
        '403':
          $ref: '#/components/responses/trait_standardErrors_403'
        '404':
          $ref: '#/components/responses/trait_standardErrors_404'
        '500':
          $ref: '#/components/responses/trait_standardErrors_500'
      security:
      - x-api-key: []
      summary: Allow Adminstrator access to an Organization
      tags:
      - Organizations
      x-scopes:
      - administrators
      - administratorLinks
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/administrators/{id}/organizationlinks \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"organization\":\"6230a0d26a4e4bc86c6b36f1\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/administrators/{id}/organizationlinks\"\n\npayload = {\"organization\": \"6230a0d26a4e4bc86c6b36f1\"}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/administrators/{id}/organizationlinks'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"organization":"6230a0d26a4e4bc86c6b36f1"}'''
