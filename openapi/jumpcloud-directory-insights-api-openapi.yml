          $ref: '#/components/responses/trait_standardErrors_500'
      summary: POST provider Directory Insights events interval (converged audit)
      tags:
      - Directory Insights
      security:
      - x-api-key: []
      x-scopes:
      - directoryinsights.readonly
      - providers.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/providers/{provider_id}/directoryinsights/events/interval \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '{\"exclude_provider_activity\":true,\"organization_scope\":\"all\",\"organization_ids\":[\"string\"]}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/providers/{provider_id}/directoryinsights/events/interval\"\n\npayload = {\n    \"exclude_provider_activity\": True,\n    \"organization_scope\": \"all\",\n    \"organization_ids\": [\"string\"]\n}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/providers/{provider_id}/directoryinsights/events/interval'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"exclude_provider_activity":true,"organization_scope":"all","organization_ids":["string"]}'''
