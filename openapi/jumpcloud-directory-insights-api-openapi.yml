paths:
  /providers/{provider_id}/directoryinsights/organizations:
    parameters:
    - in: path
      name: provider_id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - di-events
    get:
      description: 'Lists organizations for the Provider Directory Insights org filter picker.


        Returns accessible live child organizations under the path provider. Deleted

        organization tombstones from ``organizations_deleted`` are included only when the

        caller has OU provider primary-organization access (Enterprise DI deleted-org gate).

        MSP deleted tombstones are not included.


        Wrong-provider tombstones are never returned. Legacy tombstones missing ``provider``

        are excluded by the provider-scoped query. Tombstones (or live orgs) missing a display

        name return ``name: null``; Portal should fall back to ``id``.


        Pagination and search:


        - ``skip`` / ``limit`` (default limit 10, max 100) apply after merge, optional search,

        and case-insensitive name sort.

        - ``search`` is an optional case-insensitive substring match on display name. Rows with

        a null name are omitted from search matches.'
      operationId: providers_directoryInsightsOrganizationsGet
      parameters:
      - $ref: '#/components/parameters/trait_limitMax100_limit'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_search_search'
      responses:
        '200':
          description: Accessible live orgs (+ authorized deleted tombstones).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDirectoryInsightsOrganizationsResponse'
        '400':
          $ref: '#/components/responses/trait_standardErrors_400'
        '401':
          $ref: '#/components/responses/trait_standardErrors_401'
        '403':
          $ref: '#/components/responses/trait_standardErrors_403'
        '404':
          $ref: '#/components/responses/trait_standardErrors_404'
        '500':
          $ref: '#/components/responses/trait_standardErrors_500'
      summary: List Provider Directory Insights organizations (org picker)
      tags:
      - Directory Insights
      security:
      - x-api-key: []
      x-scopes:
      - directoryinsights.readonly
      - providers.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/providers/{provider_id}/directoryinsights/organizations?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&search=SOME_STRING_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/providers/{provider_id}/directoryinsights/organizations"


          querystring = {"limit":"SOME_INTEGER_VALUE","skip":"SOME_INTEGER_VALUE","search":"SOME_STRING_VALUE"}


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/providers/{provider_id}/directoryinsights/organizations?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&search=SOME_STRING_VALUE'' -Method GET -Headers $headers'
  /providers/{provider_id}/directoryinsights/events:
    parameters:
    - in: path
      name: provider_id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - di-events
    post:
      description: 'Provider-scoped Directory Insights events query for converged (hybrid) audit logs.

        Proxies to insights-internal ``POST /v1/providers/events``.


        The ``provider_id`` in the path must match the authenticated provider (see ``providerTenancy``).

        ``x-org-id`` is optional. When ``SP-9645-EP-DI-EVENTS`` is disabled, organization scope is

        derived only from legacy ``x-org-id`` when present; otherwise the request remains provider-pillar

        scoped. When the flag is enabled, valid body org filters take precedence.


        Optional body field ``exclude_provider_activity`` (boolean): when true, excludes provider-pillar

        events only; it does not exclude primary-organization events included in resolved organization IDs.

        When ``SP-9645-EP-DI-EVENTS`` is enabled, this requires an organization scope.


        Optional body fields for multi-org filtering (Provider DI body org filter contract):


        - ``organization_scope`` (string: ``all`` | ``explicit``): when SP-9645-EP-DI-EVENTS is enabled,

        ``all`` expands to all accessible live organizations under the provider, including the primary

        organization when accessible. OU tombstones may be included only with primary-organization access;

        MSP tombstones are excluded. When the flag is disabled, SI does not interpret valid body filter

        fields in the Provider DI handler: legacy ``x-org-id`` behavior and provider-pillar

        behavior when ``x-org-id`` is absent are preserved. Valid body fields may still be forwarded

        downstream as part of the legacy passthrough body. Schema-level validation may still reject

        malformed shapes before the handler runs, such as unsupported scope enum values or non-array

        ``organization_ids``.

        - ``organization_ids`` (array of strings): explicit org filter when

        ``organization_scope`` is ``explicit`` (or omitted with this field present). When the flag is

        enabled, an empty array queries provider-pillar logs only, provided

        ``exclude_provider_activity`` is not true. Do not use ``"-"`` here (use

        ``organization_scope: "all"`` instead).


        When SP-9645-EP-DI-EVENTS is enabled and the request reaches the Provider DI handler, the

        following invalid combinations return ``400`` with message ``invalid organization context``:


        - ``organization_scope: "all"`` together with ``organization_ids`` present

        - ``organization_scope: "explicit"`` without ``organization_ids``

        - ``"-"`` inside ``organization_ids``

        - an empty ``organization_ids`` array with ``exclude_provider_activity: true``

        - no organization scope with ``exclude_provider_activity: true``

        - a malformed ObjectId in ``organization_ids``


        When enabled, valid filters are resolved by SI and forwarded as ``x-validated-org-id``. Unauthorized

        or wrong-provider IDs are pruned; if none remain, SI returns an empty organization-scoped result

        without calling insights-internal. When enabled, ``organization_ids: []`` is the provider-pillar

        sentinel when ``exclude_provider_activity`` is false or omitted.


        #### Sample Request

        ```

        curl -X POST ''https://console.jumpcloud.com/api/v2/providers/{provider_id}/directoryinsights/events'' \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -H ''x-org-id: {OPTIONAL_COMMA_SEPARATED_ORG_IDS}'' \

        -d ''{"service": ["radius"], "start_time": "2019-01-12T20:00:00Z" }''

        ```'
      operationId: providers_directoryInsightsEventsPost
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      requestBody:
        $ref: '#/components/requestBodies/providers_directoryInsightsEventsPostBody'
      responses:
        '200':
          description: directory insights provider-scoped events query
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          $ref: '#/components/responses/trait_standardErrors_400'
        '401':
          $ref: '#/components/responses/trait_standardErrors_401'
        '403':
          $ref: '#/components/responses/trait_standardErrors_403'
        '404':
          $ref: '#/components/responses/trait_standardErrors_404'
        '409':
          $ref: '#/components/responses/trait_standardErrors_409'
        '500':
          $ref: '#/components/responses/trait_standardErrors_500'
      summary: POST provider Directory Insights events query (converged audit)
      tags:
      - Directory Insights
      security:
      - x-api-key: []
      x-scopes:
      - directoryinsights.readonly
      - providers.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/providers/{provider_id}/directoryinsights/events \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '{\"exclude_provider_activity\":true,\"organization_scope\":\"all\",\"organization_ids\":[\"string\"]}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/providers/{provider_id}/directoryinsights/events\"\n\npayload = {\n    \"exclude_provider_activity\": True,\n    \"organization_scope\": \"all\",\n    \"organization_ids\": [\"string\"]\n}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/providers/{provider_id}/directoryinsights/events'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"exclude_provider_activity":true,"organization_scope":"all","organization_ids":["string"]}'''
