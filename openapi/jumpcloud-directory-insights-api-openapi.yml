        Optional body fields for multi-org filtering (Provider DI body org filter contract):


        - ``organization_scope`` (string: ``all`` | ``explicit``): when SP-9645-EP-DI-EVENTS is enabled,

        ``all`` expands to all accessible live organizations under the provider, including the primary

        organization when accessible. OU tombstones may be included only with primary-organization access;

        MSP tombstones are excluded. When the flag is disabled, SI does not interpret valid body filter

        fields in the Provider DI handler: legacy ``x-org-id`` behavior and provider-pillar

        behavior when ``x-org-id`` is absent are preserved. Valid body fields may still be forwarded

        downstream as part of the legacy passthrough body. Schema-level validation may still reject

        malformed shapes before the handler runs, such as unsupported scope enum values or non-array

        ``organization_ids``.

        - ``organization_ids`` (array of strings): explicit org filter when

        ``organization_scope`` is ``explicit`` (or omitted with this field present). When the flag is

        enabled, an empty array queries provider-pillar logs only, provided

        ``exclude_provider_activity`` is not true. Do not use ``"-"`` here (use

        ``organization_scope: "all"`` instead).


        When SP-9645-EP-DI-EVENTS is enabled and the request reaches the Provider DI handler, the

        following invalid combinations return ``400`` with

        message ``invalid organization context``:


        - ``organization_scope: "all"`` together with ``organization_ids`` present

        - ``organization_scope: "explicit"`` without ``organization_ids``

        - ``"-"`` inside ``organization_ids``

        - an empty ``organization_ids`` array with ``exclude_provider_activity: true``

        - no organization scope with ``exclude_provider_activity: true``

        - a malformed ObjectId in ``organization_ids``


        When enabled, valid filters are resolved by SI and forwarded as ``x-validated-org-id``. Unauthorized

        or wrong-provider IDs are pruned; if none remain, SI returns an empty organization-scoped result

        without calling insights-internal. When enabled, ``organization_ids: []`` is the provider-pillar

        sentinel when ``exclude_provider_activity`` is false or omitted.


        #### Sample Request

        ```

        curl -X POST ''https://console.jumpcloud.com/api/v2/providers/{provider_id}/directoryinsights/events/interval'' \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -H ''x-org-id: {OPTIONAL_COMMA_SEPARATED_ORG_IDS}'' \

        -d ''{"service": ["radius"], "start_time": "2019-01-12T20:00:00Z", "interval_unit": "d" }''

        ```'
      operationId: providers_directoryInsightsEventsIntervalPost
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      requestBody:
        $ref: '#/components/requestBodies/providers_directoryInsightsEventsPostBody'
      responses:
        '200':
          description: directory insights provider-scoped events interval query
          content:
            application/json:
              schema:
                type: object
        '400':
