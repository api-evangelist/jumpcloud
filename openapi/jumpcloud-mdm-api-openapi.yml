  /applemdms/{deviceManagerObjectId}/devices/{deviceObjectId}/lostmode:
    post:
      summary: Lost Mode
      description: This endpoint allows you to control the lost mode of a device
      operationId: Devices_LostMode
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.apple_mdm.CommandResponse'
        '204':
          description: A successful response.
          content:
            application/json:
              schema: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: deviceManagerObjectId
        in: path
        required: true
        schema:
          type: string
          format: byte
      - name: deviceObjectId
        in: path
        required: true
        schema:
          type: string
          format: byte
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                disableLostMode:
                  $ref: '#/components/schemas/jumpcloud.apple_mdm.DisableLostMode'
                enableLostMode:
                  $ref: '#/components/schemas/jumpcloud.apple_mdm.EnableLostMode'
        required: true
      tags:
      - mdm
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - mdm
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/applemdms/{deviceManagerObjectId}/devices/{deviceObjectId}/lostmode \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"disableLostMode\":{},\"enableLostMode\":{\"footnote\":\"string\",\"message\":\"string\",\"phoneNumber\":\"string\"}}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/applemdms/{deviceManagerObjectId}/devices/{deviceObjectId}/lostmode\"\n\npayload = {\n    \"disableLostMode\": {},\n    \"enableLostMode\": {\n        \"footnote\": \"string\",\n        \"message\": \"string\",\n        \"phoneNumber\": \"string\"\n    }\n}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/applemdms/{deviceManagerObjectId}/devices/{deviceObjectId}/lostmode'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"disableLostMode":{},"enableLostMode":{"footnote":"string","message":"string","phoneNumber":"string"}}'''
