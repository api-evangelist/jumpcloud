  /applemdms/{deviceManagerObjectId}/abm_devices:
    get:
      summary: ABM Devices List
      description: 'This endpoint lists the abm devices for the given device manager.


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/v2/applemdms/{device_manager_object_id}/abm_devices \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key:{API_KEY}''

        ```


        Note: The `limit` maximum is 100 Abm device Items in a single response.'
      operationId: DeviceManagers_ListABMDevices
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: deviceManagerObjectId
        in: path
        required: true
        schema:
          type: string
          format: byte
      - name: skip
        description: The offset into the records to return.
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: limit
        description: 'The number of resources to return at once.

          If the number of resources returned is less than `limit` there are no more resources to fetch.

          If the number of resources returned is equal to limit there may be more resources to fetch. Increment `skip` by `limit` to get the next set of resources.'
        in: query
        required: false
        schema:
          type: string
          format: int64
      - name: sort
        description: 'An optional comma separated field names used to sort the collection.

          Default sort is ascending, prefix with `-` to sort descending.'
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
        allowReserved: true
      - name: filter
        description: "A filter to apply to the query.\n\n\t**Filter structure**: `<field>:<operator>:<value>`.\n\n\t**field** = Populate with a valid field from an endpoint response.\n\n\t**operator** =  Supported operators are: eq, ne, gt, ge, lt, le, between, search, in.\n\n\t**value** = Populate with the value you want to search for. Is case sensitive. Supports wild cards.\n\n\t**Example** `GET /api/v2/groups?filter=name:eq:Test+Group`\n"
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
        allowReserved: true
      tags:
      - mdm
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
