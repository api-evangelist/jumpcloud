tags:
- name: Apple MDM
paths:
  /applemdms:
    x-functionalities-tags:
    - mdm
    get:
      description: 'Get a list of all Apple MDM configurations. An empty topic indicates that a signed certificate from Apple has not been provided to the PUT endpoint yet.


        Note: currently only one MDM configuration per organization is supported.


        #### Sample Request

        ```

        curl https://console.jumpcloud.com/api/v2/applemdms \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: applemdms_list
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      - $ref: '#/components/parameters/trait_limitDefault1_limit'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_filter_filter'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AppleMDM'
                type: array
      security:
      - x-api-key: []
      summary: List Apple MDMs
      tags:
      - Apple MDM
      x-scopes:
      - mdm
      - mdm.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/applemdms?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&filter=SOME_ARRAY_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/applemdms\"\n\nquerystring = {\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\",\"filter\":\"SOME_ARRAY_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/applemdms?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&filter=SOME_ARRAY_VALUE'' -Method GET -Headers $headers'
  /applemdms/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - mdm
    delete:
      description: 'Removes an Apple MDM configuration.


        Warning: This is a destructive operation and will remove your Apple Push Certificates. We will no longer be able to manage your devices and the only recovery option is to re-register all devices into MDM.


        #### Sample Request

        ```

        curl -X DELETE https://console.jumpcloud.com/api/v2/applemdms/{id} \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: applemdms_delete
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleMDM'
        '400':
          $ref: '#/components/responses/trait_standardErrors_400'
        '401':
          $ref: '#/components/responses/trait_standardErrors_401'
        '403':
          $ref: '#/components/responses/trait_standardErrors_403'
        '404':
          $ref: '#/components/responses/trait_standardErrors_404'
        '409':
          $ref: '#/components/responses/trait_standardErrors_409'
        '500':
          $ref: '#/components/responses/trait_standardErrors_500'
      security:
      - x-api-key: []
      summary: Delete an Apple MDM
      tags:
      - Apple MDM
      x-scopes:
      - mdm
      x-codeSamples:
      - lang: Shell
        source: "curl --request DELETE \\\n  --url https://console.jumpcloud.com/api/v2/applemdms/{id} \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/applemdms/{id}\"\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"DELETE\", url, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/applemdms/{id}'' -Method DELETE -Headers $headers'
    put:
      description: 'Updates an Apple MDM configuration. This endpoint is used to supply JumpCloud with a signed certificate from Apple in order to finalize the setup and allow JumpCloud to manage your devices. It may also be used to update the DEP Settings.


        #### Sample Request

        ```

        curl -X PUT https://console.jumpcloud.com/api/v2/applemdms/{ID} \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        "name": "MDM name",

        "appleSignedCert": "{CERTIFICATE}",

        "encryptedDepServerToken": "{SERVER_TOKEN}",

        "dep": {

        "welcomeScreen": {

        "title": "Welcome",

        "paragraph": "In just a few steps, you will be working securely from your Mac.",

        "button": "continue",

        },

        },

        }''

        ```'
      operationId: applemdms_put
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/apple-mdm-patch'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppleMDM'
        '400':
          $ref: '#/components/responses/trait_standardErrors_400'
        '401':
          $ref: '#/components/responses/trait_standardErrors_401'
        '403':
          $ref: '#/components/responses/trait_standardErrors_403'
        '404':
          $ref: '#/components/responses/trait_standardErrors_404'
        '409':
          $ref: '#/components/responses/trait_standardErrors_409'
        '500':
          $ref: '#/components/responses/trait_standardErrors_500'
      security:
      - x-api-key: []
      summary: Update an Apple MDM
      tags:
      - Apple MDM
      x-scopes:
      - mdm
      x-codeSamples:
      - lang: Shell
        source: "curl --request PUT \\\n  --url https://console.jumpcloud.com/api/v2/applemdms/{id} \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '{\"appleSignedCert\":\"string\",\"encryptedDepServerToken\":\"string\",\"name\":\"string\",\"defaultSystemGroupID\":\"string\",\"defaultIosUserEnrollmentDeviceGroupID\":\"string\",\"allowMobileUserEnrollment\":true,\"dep\":{\"welcomeScreen\":{\"title\":\"string\",\"paragraph\":\"string\",\"button\":\"string\"},\"setupAssistantOptions\":[{\"option\":\"accessibility\"}],\"enableZeroTouchEnrollment\":true},\"ades\":{\"macos\":{\"welcomeScreen\":{\"title\":\"string\",\"paragraph\":\"string\",\"button\":\"string\"},\"setupAssistantOptions\":[{\"option\":\"accessibility\"}],\"setupOptions\":[\"accessibility\"],\"enableZeroTouchEnrollment\":true,\"defaultDeviceGroupObjectIds\":[\"string\"]},\"ios\":{\"welcomeScreen\":{\"title\":\"string\",\"paragraph\":\"string\",\"button\":\"string\"},\"setupAssistantOptions\":[{\"option\":\"accessibility\"}],\"setupOptions\":[\"accessibility\"],\"enableZeroTouchEnrollment\":true,\"defaultDeviceGroupObjectIds\":[\"string\"]}},\"appleCertCreatorAppleID\":\"string\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/applemdms/{id}\"\n\npayload = {\n    \"appleSignedCert\": \"string\",\n    \"encryptedDepServerToken\": \"string\",\n    \"name\": \"string\",\n    \"defaultSystemGroupID\": \"string\",\n    \"defaultIosUserEnrollmentDeviceGroupID\": \"string\",\n    \"allowMobileUserEnrollment\": True,\n    \"dep\": {\n        \"welcomeScreen\": {\n            \"title\": \"string\",\n            \"paragraph\": \"string\",\n            \"button\": \"string\"\n        },\n        \"setupAssistantOptions\": [{\"option\": \"accessibility\"}],\n        \"enableZeroTouchEnrollment\": True\n    },\n    \"ades\": {\n        \"macos\": {\n            \"welcomeScreen\": {\n                \"title\": \"string\",\n                \"paragraph\": \"string\",\n                \"button\": \"string\"\n            },\n            \"setupAssistantOptions\": [{\"option\": \"accessibility\"}],\n            \"setupOptions\": [\"accessibility\"],\n            \"enableZeroTouchEnrollment\": True,\n            \"defaultDeviceGroupObjectIds\": [\"string\"]\n        },\n        \"ios\": {\n            \"welcomeScreen\": {\n                \"title\": \"string\",\n                \"paragraph\": \"string\",\n                \"button\": \"string\"\n            },\n            \"setupAssistantOptions\": [{\"option\": \"accessibility\"}],\n            \"setupOptions\": [\"accessibility\"],\n            \"enableZeroTouchEnrollment\": True,\n            \"defaultDeviceGroupObjectIds\": [\"string\"]\n        }\n    },\n    \"appleCertCreatorAppleID\": \"string\"\n}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"PUT\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/applemdms/{id}'' -Method PUT -Headers $headers -ContentType ''application/json'' -Body ''{"appleSignedCert":"string","encryptedDepServerToken":"string","name":"string","defaultSystemGroupID":"string","defaultIosUserEnrollmentDeviceGroupID":"string","allowMobileUserEnrollment":true,"dep":{"welcomeScreen":{"title":"string","paragraph":"string","button":"string"},"setupAssistantOptions":[{"option":"accessibility"}],"enableZeroTouchEnrollment":true},"ades":{"macos":{"welcomeScreen":{"title":"string","paragraph":"string","button":"string"},"setupAssistantOptions":[{"option":"accessibility"}],"setupOptions":["accessibility"],"enableZeroTouchEnrollment":true,"defaultDeviceGroupObjectIds":["string"]},"ios":{"welcomeScreen":{"title":"string","paragraph":"string","button":"string"},"setupAssistantOptions":[{"option":"accessibility"}],"setupOptions":["accessibility"],"enableZeroTouchEnrollment":true,"defaultDeviceGroupObjectIds":["string"]}},"appleCertCreatorAppleID":"string"}'''
  /applemdms/{apple_mdm_id}/csr:
    parameters:
