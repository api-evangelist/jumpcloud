openapi: 3.2.0
info:
  contact:
    name: JumpCloud Support
    url: https://jumpcloud.com/support/contact-jumpcloud-support
  description: '# Overview


    JumpCloud''s V2 API. This set of endpoints allows JumpCloud customers to manage objects, groupings and mappings and interact with the JumpCloud Graph. > **Note:** See JumpCloud Data Centers: Login URLs and Service Endpoints to learn more. ## API Best Practices


    Read the linked Help Article below for guidance on retrying failed requests to JumpCloud''s REST API, as well as best practices for structuring subsequent retry requests. Customizing retry mechanisms based on these recommendations will increase the reliability and dependability of your API calls. Covered topics include:

    1. Important Considerations

    2. Supported HTTP Request Methods

    3. Response codes

    4. API Key rotation

    5. Paginating

    6. Error handling

    7. Retry rates


    JumpCloud Help Center - API Best Practices


    # Directory Objects


    This API offers the ability to interact with some of our core features; otherwise known as Directory Objects. The Directory Objects are:


    * Commands

    * Policies

    * Policy Groups

    * Applications

    * Systems

    * Users

    * User Groups

    * System Groups

    * Radius Servers

    * Directories: Office 365, LDAP,G-Suite, Active Directory

    * Duo accounts and applications. The Directory Object is an important concept to understand in order to successfully use JumpCloud API. ## JumpCloud Graph


    We''ve also introduced the concept of the JumpCloud Graph along with Directory Objects. The Graph is a powerful aspect of our platform which will enable you to associate objects with each other, or establish membership for certain objects to become members of other objects. Specific `GET` endpoints will allow you to traverse the JumpCloud Graph to return all indirect and directly bound objects in your organization. | !alt text |

    |:--:|

    | **This diagram highlights our association and membership model as it relates to Directory Objects.** |


    # API Key


    ## Access Your API Key


    To locate your API Key:


    1. Log into the JumpCloud Admin Console. 2. Go to the username drop down located in the top-right of the Console. 3. Retrieve your API key from API Settings. ## API Key Considerations


    This API key is associated to the currently logged in administrator. Other admins will have different API keys. **WARNING** Please keep this API key secret, as it grants full access to any data accessible via your JumpCloud console account. You can also reset your API key in the same location in the JumpCloud Admin Console. ## Recycling or Resetting Your API Key


    In order to revoke access with the current API key, simply reset your API key. This will render all calls using the previous API key inaccessible. Your API key will be passed in as a header with the header name "x-api-key". ```bash

    curl -H "x-api-key: [YOUR_API_KEY_HERE]" "https://console.jumpcloud.com/api/v2/systemgroups"

    ```


    # System Context


    * Introduction

    * Supported endpoints

    * Response codes

    * Authentication

    * Additional examples

    * Third party


    ## Introduction


    JumpCloud System Context Authorization is an alternative way to authenticate with a subset of JumpCloud''s REST APIs. Using this method, a system can manage its information and resource associations, allowing modern auto provisioning environments to scale as needed. **Notes:**


    * The following documentation applies to Linux Operating Systems only. * Systems that have been automatically enrolled using Apple''s Device Enrollment Program (DEP) or systems enrolled using the User Portal install are not eligible to use the System Context API to prevent unauthorized access to system groups and resources. If a script that utilizes the System Context API is invoked on a system enrolled in this way, it will display an error. ## Supported Endpoints


    JumpCloud System Context Authorization can be used in conjunction with Systems endpoints found in the V1 API and certain System Group endpoints found in the v2 API.'
  title: JumpCloud Workflows API
  version: '2.0'
servers:
- url: https://console.jumpcloud.com/api/v2
  description: United States (US)
  x-jc-region: us
- url: https://console.eu.jumpcloud.com/api/v2
  description: European Union (EU)
  x-jc-region: eu
- url: https://console.in.jumpcloud.com/api/v2
  description: India (IN)
  x-jc-region: in
tags:
- name: Workflows
  description: Operations related to public workflows
paths:
  /workflows:
    get:
      tags:
      - Workflows
      summary: List workflows
      description: Get a list of workflows
      operationId: listWorkflows
      x-scopes:
      - workflows.readonly
      security:
      - x-api-key: []
      parameters:
      - name: limit
        in: query
        description: Number of workflows to return
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: skip
        in: query
        description: Number of workflows to skip
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: filter
        in: query
        description: "Comma-separated filters using the format: field:operator:value.\n\nSupported fields: name, status, description, created_by, created_at, updated_at, trigger_type.\n\nOperators:\n- Strings (name, status, description, created_by): eq, ne, in, nin, search\n- Strings (trigger_type): eq, ne, in, nin\n- Dates (created_at, updated_at): gt, ge, lt, le\n\nMultiple filters can be combined with commas and are ANDed together.\n\nExample:\n- name:eq:Workflow1, status:in:inactive|active, \n  name:search:workflow, description:search:import,\n  created_at:gt:2025-01-01, updated_at:le:2025-12-31,\n  trigger_type:eq:jc_events\n"
        schema:
          type: string
      - name: sort
        in: query
        description: 'Optional sort field.


          Syntax:

          - "name"  => sort by name ascending

          - "-name" => sort by name descending


          Supported fields: name, status, created_at, created_by, updated_at.

          '
        schema:
          type: string
      responses:
        '200':
          description: Workflows retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.workflows.WorkflowListResponse'
        '400':
          description: Bad request - invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.workflows.error'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.workflows.error'
        default:
          description: Generic error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.workflows.error'
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/workflows?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&filter=SOME_STRING_VALUE&sort=SOME_STRING_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/workflows"


          querystring = {"limit":"SOME_INTEGER_VALUE","skip":"SOME_INTEGER_VALUE","filter":"SOME_STRING_VALUE","sort":"SOME_STRING_VALUE"}


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/workflows?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&filter=SOME_STRING_VALUE&sort=SOME_STRING_VALUE'' -Method GET -Headers $headers'
    post:
      tags:
      - Workflows
      summary: Create workflow
      description: Create a new workflow
      operationId: createWorkflow
      x-scopes:
      - workflows
      security:
      - x-api-key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jumpcloud.http.workflows.CreateWorkflowRequest'
        description: Workflow creation request
        required: true
      responses:
        '201':
          description: Workflow created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.workflows.WorkflowResponse'
        '400':
          description: Bad request - invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.workflows.error'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.workflows.error'
        '409':
          description: Conflict - workflow with same name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.workflows.error'
        default:
          description: Generic error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.workflows.error'
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/workflows \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"name\":\"string\",\"description\":\"string\",\"dsl\":{},\"status\":\"active\",\"execution_role_id\":\"string\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/workflows\"\n\npayload = {\n    \"name\": \"string\",\n    \"description\": \"string\",\n    \"dsl\": {},\n    \"status\": \"active\",\n    \"execution_role_id\": \"string\"\n}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

