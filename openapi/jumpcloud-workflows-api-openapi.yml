          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/workflows'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"name":"string","description":"string","dsl":{},"status":"active","execution_role_id":"string"}'''
