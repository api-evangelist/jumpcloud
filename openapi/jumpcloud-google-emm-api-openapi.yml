paths:
  /google-emm/devices/{deviceId}:
    get:
      summary: Get device
      description: 'Gets a Google EMM enrolled device details.


        #### Sample Request


        ```

        curl -X GET https://console.jumpcloud.com/api/v2/google-emm/devices/{deviceId} \

        -H "Accept: application/json" \

        -H "Content-Type: application/json" \

        -H "x-api-key: ${API_KEY}"

        ```'
      operationId: Devices_GetDevice
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.google_emm.Device'
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
          format: byte
      tags:
      - Google EMM
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - mdm
      - mdm.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url https://console.jumpcloud.com/api/v2/google-emm/devices/{deviceId} \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/google-emm/devices/{deviceId}"


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/google-emm/devices/{deviceId}'' -Method GET -Headers $headers'
  /google-emm/devices/{deviceId}/lock:
    post:
      summary: Lock device
      description: 'Locks a Google EMM enrolled device, as if the lock screen timeout had

        expired.


        #### Sample Request


        ```

        curl -X POST https://console.jumpcloud.com/api/v2/google-emm/devices/{deviceId}/lock \

        -H "Accept: application/json" \

        -H "Content-Type: application/json" \

        -H "x-api-key: ${API_KEY}"

        ```'
      operationId: Devices_LockDevice
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.google_emm.CommandResponse'
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
          format: byte
      requestBody:
        $ref: '#/components/requestBodies/Devices_EraseDeviceBody'
      tags:
      - Google EMM
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - mdm
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/google-emm/devices/{deviceId}/lock \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/google-emm/devices/{deviceId}/lock\"\n\npayload = {}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/google-emm/devices/{deviceId}/lock'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{}'''
  /google-emm/devices/{deviceId}/resetpassword:
    post:
      summary: Reset Password of a device
      description: 'Reset the user''s password of a Google EMM enrolled device.


        #### Sample Request


        ```

        curl -X POST https://console.jumpcloud.com/api/v2/google-emm/devices/{deviceId}/resetpassword \

        -H "Accept: application/json" \

        -H "Content-Type: application/json" \

        -H "x-api-key: ${API_KEY}" \

        -d ''{"new_password" : "string"}''

        ```'
      operationId: Devices_ResetPassword
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.google_emm.CommandResponse'
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
          format: byte
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                flags:
                  type: array
                  items:
                    type: string
                newPassword:
                  type: string
                  description: Not logging as it contains sensitive information.
        required: true
      tags:
      - Google EMM
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - mdm
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/google-emm/devices/{deviceId}/resetpassword \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"flags\":[\"string\"],\"newPassword\":\"string\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/google-emm/devices/{deviceId}/resetpassword\"\n\npayload = {\n    \"flags\": [\"string\"],\n    \"newPassword\": \"string\"\n}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/google-emm/devices/{deviceId}/resetpassword'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"flags":["string"],"newPassword":"string"}'''
  /google-emm/enterprises:
    get:
      summary: List Google Enterprises
      description: 'List all Google EMM enterprises.

        An empty list indicates that the Organization is not configured with a

        Google EMM enterprise yet.


        Note: Currently only one Google Enterprise per Organization is supported.


        #### Sample Request


        ```

        curl -X GET https://console.jumpcloud.com/api/v2/google-emm/enterprises \

        -H "Accept: application/json" \

        -H "Content-Type: application/json" \

        -H "x-api-key: ${API_KEY}"

        ```'
      operationId: Enterprises_ListEnterprises
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.google_emm.ListEnterprisesResponse'
      parameters:
      - name: limit
        description: 'The number of records to return at once.

          Limited to 100.'
        in: query
        required: false
        schema:
          type: string
          format: int64
          default: '100'
      - name: skip
        description: The offset into the records to return.
        in: query
        required: false
        schema:
          type: string
          format: int64
          default: '0'
      tags:
      - Google EMM
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - mdm
      - mdm.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/google-emm/enterprises?limit=SOME_STRING_VALUE&skip=SOME_STRING_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/google-emm/enterprises"


          querystring = {"limit":"SOME_STRING_VALUE","skip":"SOME_STRING_VALUE"}


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/google-emm/enterprises?limit=SOME_STRING_VALUE&skip=SOME_STRING_VALUE'' -Method GET -Headers $headers'
    post:
      summary: Create a Google Enterprise
      description: 'Creates a Google EMM enterprise.


        #### Sample Request


        ```

        curl -X POST https://console.jumpcloud.com/api/v2/google-emm/enterprises \

        -H "Accept: application/json" \

        -H "Content-Type: application/json" \

        -H "x-api-key: ${API_KEY}" \

        -d ''{"signupUrlName": "string", "enrollmentToken": "string"}''

        ```'
      operationId: Enterprises_CreateEnterprise
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.google_emm.Enterprise'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jumpcloud.google_emm.CreateEnterpriseRequest'
        required: true
      tags:
      - Google EMM
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - mdm
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/google-emm/enterprises \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"enrollmentToken\":\"string\",\"signupUrlName\":\"string\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/google-emm/enterprises\"\n\npayload = {\n    \"enrollmentToken\": \"string\",\n    \"signupUrlName\": \"string\"\n}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/google-emm/enterprises'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"enrollmentToken":"string","signupUrlName":"string"}'''
  /google-emm/enterprises/{enterpriseId}:
    delete:
      summary: Delete a Google Enterprise
      description: 'Removes a Google EMM enterprise.


        Warning: This is a destructive operation and will remove all data

        associated with Google EMM enterprise from JumpCloud including devices and

        applications associated with the given enterprise.


        #### Sample Request


        ```

        curl -X DELETE https://console.jumpcloud.com/api/v2/google-emm/devices/{enterpriseId} \

        -H "Accept: application/json" \

        -H "Content-Type: application/json" \

        -H "x-api-key: ${API_KEY}"

        ```'
      operationId: Enterprises_DeleteEnterprise
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                type: object
                properties: {}
      parameters:
      - name: enterpriseId
        in: path
        required: true
        schema:
          type: string
          format: byte
      tags:
      - Google EMM
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - mdm
      x-codeSamples:
      - lang: Shell
        source: "curl --request DELETE \\\n  --url https://console.jumpcloud.com/api/v2/google-emm/enterprises/{enterpriseId} \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/google-emm/enterprises/{enterpriseId}"


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("DELETE", url, headers=headers)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/google-emm/enterprises/{enterpriseId}'' -Method DELETE -Headers $headers'
    patch:
      summary: Update a Google Enterprise
      description: 'Updates a Google EMM enterprise details.


        #### Sample Request


        ```

        curl -X PATCH https://console.jumpcloud.com/api/v2/google-emm/enterprises \

        -H "Accept: application/json" \

        -H "Content-Type: application/json" \

        -H "x-api-key: ${API_KEY}"

        -d ''{"allowDeviceEnrollment": true, "deviceGroupId": "string"}''

        ```'
      operationId: Enterprises_PatchEnterprise
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.google_emm.Enterprise'
      parameters:
      - name: enterpriseId
        in: path
        required: true
        schema:
          type: string
          format: byte
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                allowDeviceEnrollment:
                  type: boolean
                deviceGroupId:
                  type: string
                  format: byte
        required: true
      tags:
      - Google EMM
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - mdm
      x-codeSamples:
      - lang: Shell
        source: "curl --request PATCH \\\n  --url https://console.jumpcloud.com/api/v2/google-emm/enterprises/{enterpriseId} \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"allowDeviceEnrollment\":true,\"deviceGroupId\":\"string\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/google-emm/enterprises/{enterpriseId}\"\n\npayload = {\n    \"allowDeviceEnrollment\": True,\n    \"deviceGroupId\": \"string\"\n}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"PATCH\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/google-emm/enterprises/{enterpriseId}'' -Method PATCH -Headers $headers -ContentType ''application/json'' -Body ''{"allowDeviceEnrollment":true,"deviceGroupId":"string"}'''
