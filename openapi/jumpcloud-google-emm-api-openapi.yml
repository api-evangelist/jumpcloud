        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/google-emm/devices/{deviceId}/lostmode/stop\"\n\npayload = {}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/google-emm/devices/{deviceId}/lostmode/stop'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{}'''
  /google-emm/enterprises/{enterpriseId}/generate-upgrade-url:
    post:
      summary: Generates an upgrade URL for an enterprise
      description: 'Provides an upgrade URL to upgrade the Google EMM enterprise,

        from Managed Google Play Account to Managed Google Domain.


        #### Sample Request


        ```

        curl -X POST https://console.jumpcloud.com/api/v2/google-emm/enterprises/{enterpriseId}/generate-upgrade-url \

        -H "Accept: application/json" \

        -H "Content-Type: application/json" \

        -H "x-api-key: ${API_KEY}" \

        -d ''{"domainsAllowed": ["string"]}''

        ```'
      operationId: Enterprises_GenerateEnterpriseUpgradeURL
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.google_emm.GenerateEnterpriseUpgradeURLResponse'
      parameters:
      - name: enterpriseId
        in: path
        required: true
        schema:
          type: string
          format: byte
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                domainsAllowed:
                  type: array
                  items:
                    type: string
        required: true
      tags:
      - Google EMM
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - mdm
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/google-emm/enterprises/{enterpriseId}/generate-upgrade-url \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"domainsAllowed\":[\"string\"]}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/google-emm/enterprises/{enterpriseId}/generate-upgrade-url\"\n\npayload = {\"domainsAllowed\": [\"string\"]}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/google-emm/enterprises/{enterpriseId}/generate-upgrade-url'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"domainsAllowed":["string"]}'''
