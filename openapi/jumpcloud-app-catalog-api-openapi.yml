        packageId:
          type: string
        packageKind:
          type: string
        packageManager:
          $ref: '#/components/schemas/devices.SoftwareAppPackageManager'
        packageSubtitle:
          type: string
        packageVersion:
          type: string
        packageVersionUpdatedAt:
          type:
          - string
          - 'null'
          format: date-time
        scope:
          $ref: '#/components/schemas/devices.SoftwareApp.Setting.Scope'
        shortVersion:
          type: string
        silentInstallFlags:
          type: array
          items:
            type: string
