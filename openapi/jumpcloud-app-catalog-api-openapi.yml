      - PROMPT
      - GRANT
      - DENY
      default: PERMISSION_POLICY_UNSPECIFIED
    devices.DetectionRuleRegistry:
      type: object
      properties:
        registryExpectedValue:
          type: string
        registryPath:
          type: string
        registryValueName:
          type: string
    devices.SoftwareAppGoogleAndroid:
      type: object
      properties:
        androidFeatures:
          type: array
          items:
            type: string
        appPricing:
          type: string
        appVersion:
          type: string
        author:
          type: string
        autoUpdateMode:
          $ref: '#/components/schemas/devices.SoftwareAppAutoUpdateMode'
        category:
          type: string
        contentRating:
          type: string
        disabled:
          type: boolean
        displayMode:
          type: string
        distributionChannel:
          type: string
        fullDescription:
          type: string
        iconUrl:
          type: string
        installPriority:
          type: integer
          format: int32
        installType:
          $ref: '#/components/schemas/devices.SoftwareAppInstallType'
        managedConfigurationTemplateId:
          type: string
        managedProperties:
          type: boolean
        minSdkVersion:
          type: string
          format: int64
        name:
          type: string
        permissionGrants:
          type: array
          items:
            $ref: '#/components/schemas/devices.SoftwareAppPermissionGrant'
        playStoreUrl:
          type: string
        runtimePermission:
          $ref: '#/components/schemas/devices.SoftwareAppRuntimePermission'
        startUrl:
          type: string
        type:
          $ref: '#/components/schemas/devices.SoftwareAppType'
        updateTime:
          type: string
        versionCode:
          type: string
          format: int64
    devices.WindowsCustomInstallerConfig:
      type: object
      properties:
        successExitCodes:
          type: array
          items:
            type: integer
            format: int32
    devices.SoftwareAppInstallType:
      type: string
      enum:
      - INSTALL_TYPE_UNSPECIFIED
      - PREINSTALLED
      - FORCE_INSTALLED
      - BLOCKED
      - AVAILABLE
      - REQUIRED_FOR_SETUP
      - KIOSK
      default: INSTALL_TYPE_UNSPECIFIED
    ErrorDetails:
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          details:
            description: 'Describes a list of objects with more detailed information of the given error. Each detail schema is according to one of the messages defined in Google''s API: https://github.com/googleapis/googleapis/blob/master/google/rpc/error_details.proto'
            type: array
            items:
              type: object
              additionalProperties: true
              description: Object according to Google's API.
    devices.MetadataMSI:
      type: object
      properties:
        manufacturer:
          type: string
        productCode:
          type: string
        productName:
          type: string
        productVersion:
          type: string
        sha256sum:
          type: string
        upgradeCode:
          type: string
    devices.ObjectStorageReferrer:
      type: object
      properties:
        trackObject:
          $ref: '#/components/schemas/devices.TrackObject'
      description: 'When the status of an object changes we need to know how to contact external objects that refer to us.

        Since a oneof field cannot be repeated we are wrapping it with the ObjectStorageReferrer.'
    devices.WindowsCustomDetectionRules:
      type: object
      properties:
        customScript:
          $ref: '#/components/schemas/devices.DetectionRuleCustomScript'
        displayName:
          $ref: '#/components/schemas/devices.DetectionRuleDisplayName'
        registry:
          $ref: '#/components/schemas/devices.DetectionRuleRegistry'
    devices.MetadataIPA:
      type: object
      properties:
        assetKind:
          type: string
        bundleIdentifier:
          type: string
        bundleVersion:
          type: string
        packageKind:
          type: string
        sha256sum:
          type: string
        shortVersion:
          type: string
        subtitle:
          type: string
        title:
          type: string
    devices.SoftwareApp.Setting.AdminManagementIntent:
      type: string
      enum:
      - INTENT_UNSPECIFIED
      - INTENT_FORCE_MANAGED
      - INTENT_FORCE_UNMANAGED
      default: INTENT_UNSPECIFIED
    directory.Type:
      type: string
      enum:
      - UNKNOWN
      - USER
      - USER_GROUP
      - SYSTEM
      - SYSTEM_GROUP
      - RADIUS_SERVER
      - RADIUS_SERVER_GROUP
      - APPLICATION
      - APPLICATION_GROUP
      - COMMAND
      - COMMAND_GROUP
      - G_SUITE
      - G_SUITE_GROUP
      - OFFICE_365
      - OFFICE_365_GROUP
      - LDAP_SERVER
      - LDAP_SERVER_GROUP
      - PASSWORD_MANAGER_ITEM
      - PASSWORD_MANAGER_ITEM_GROUP
      - POLICY
      - POLICY_GROUP
      - ACTIVE_DIRECTORY
      - ACTIVE_DIRECTORY_GROUP
      - WORKDAY
      - WORKDAY_GROUP
      - SCIM_CLIENT
      - SCIM_CLIENT_GROUP
      - SOFTWARE_APP
      - SOFTWARE_APP_GROUP
      - IDP_ROUTING_POLICY
      - IDP_ROUTING_POLICY_GROUP
      - RULE
      - RULE_GROUP
      default: UNKNOWN
      description: " - UNKNOWN: Unknown represents a type of directory object from the database the code\ndoesn't recognize; in general it should never ever happen.\n - USER: Groups should be even, non-groups odd for the code to correct traverse; if\nnecessary reserve a space where we do not support a group for that type\nyet."
    devices.ObjectStorageItem:
      type: object
      properties:
        objectId:
          type: string
          format: byte
        references:
          type: array
          items:
            $ref: '#/components/schemas/devices.ObjectStorageReferrer'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/devices.ObjectStorageVersion'
    devices.TrackObject:
      type: object
      properties:
        objectId:
          type: string
          format: byte
        type:
          $ref: '#/components/schemas/directory.Type'
      description: TrackObject is a slimmed down version of a jumpcloud.directory.GraphObject.
