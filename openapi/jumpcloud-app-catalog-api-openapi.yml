        storedPackage:
          $ref: '#/components/schemas/devices.ObjectStorageItem'
        storedPackageObjectId:
          type: string
          format: byte
        teamId:
          type: string
        uninstallOnUnbind:
          type: boolean
        unsafeUninstall:
          type: boolean
        updateTool:
          type: string
        updateToolArguments:
          type: string
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
        versionlessDownloadUrl:
          type: boolean
    devices.SoftwareApp.Setting.Format:
      type: string
      enum:
      - PKG
      - APP_IN_DMG
      - PKG_IN_DMG
      - IPA
      - APP_IN_ZIP
      - PKG_IN_ZIP
      - APP_IN_DMG_ZIP
      default: PKG
    devices.SoftwareAppAppleVpp:
      type: object
      properties:
        appConfiguration:
          type: string
          title: Not adding an instrumentation annotation since this could potentially contain sensitive info
        assignedLicenses:
          type: string
          format: int64
        availableLicenses:
          type: string
          format: int64
        details:
          type: string
        isConfigEnabled:
          type: boolean
        supportedDeviceFamilies:
          type: array
          items:
            $ref: '#/components/schemas/devices.SoftwareAppAppleVpp.DeviceFamily'
        totalLicenses:
          type: string
          format: int64
    devices.SoftwareAppMicrosoftStore:
      type: object
      properties:
        doNotUpdate:
          type: boolean
        nonRemovable:
          type: boolean
        packageFamilyName:
          type: string
    devices.ObjectStorageVersion:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        displayVersion:
          type: string
          description: Optional admin display label for this upload; copied to software_app_settings on successful validation.
        metadata:
          $ref: '#/components/schemas/devices.ObjectStorageMetadata'
        name:
          type: string
        objectId:
          type: string
          format: byte
        rejectedReason:
          type: string
        sha256sum:
          type: string
        size:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/devices.ObjectStorageVersion.Status'
        storagePath:
          type: string
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
      description: The Version is the details of actual blob stored by the underlying storage subsystem.
    devices.MetadataFile:
      type: object
      properties:
        mimeType:
          type: string
        sha256sum:
          type: string
        size:
          type: integer
          format: int64
    devices.DetectionRuleCustomScript:
      type: object
      properties:
        powerShellScript:
          type: string
    devices.AppCatalogInstallableItem:
      type: object
      properties:
        architectures:
          type: array
          items:
            type: string
        installerType:
          type: string
        objectId:
          type: string
          format: byte
        operatingSystem:
          type: string
        softwareApp:
          $ref: '#/components/schemas/devices.SoftwareApp'
        version:
          type: string
    devices.SoftwareAppType:
      type: string
      enum:
      - APP_TYPE_UNSPECIFIED
      - PUBLIC
      - PRIVATE
      - WEBAPP
      default: APP_TYPE_UNSPECIFIED
    devices.ObjectStorageMetadata:
      type: object
      properties:
        metadataExe:
          $ref: '#/components/schemas/devices.MetadataEXE'
        metadataFile:
          $ref: '#/components/schemas/devices.MetadataFile'
        metadataIpa:
          $ref: '#/components/schemas/devices.MetadataIPA'
        metadataMsi:
          $ref: '#/components/schemas/devices.MetadataMSI'
        metadataPkg:
          $ref: '#/components/schemas/devices.MetadataPKG'
    devices.SoftwareAppAppleVpp.DeviceFamily:
