      - MANAGED_INSTALL_ELIGIBILITY_NOT_EVALUATED
      - MANAGED_INSTALL_ELIGIBLE
      - MANAGED_INSTALL_INELIGIBLE
      - MANAGED_INSTALL_ELIGIBILITY_UNKNOWN
      default: MANAGED_INSTALL_ELIGIBILITY_NOT_EVALUATED
    devices.MetadataEXE:
      type: object
      properties:
        arch:
          type: string
        author:
          type: string
        installerEngineVersion:
          type: string
        sha256sum:
          type: string
        signatureLabel:
          type: string
        size:
          type: integer
          format: int64
        title:
          type: string
        url:
          type: string
        version:
          type: string
      description: MetadataEXE holds parsed metadata for a Windows .exe installer (NSIS, Inno Setup, etc.).
    devices.SoftwareAppPackageManager:
      type: string
      enum:
      - UNKNOWN
      - CHOCOLATEY
      - APPLE_VPP
      - APPLE_CUSTOM
      - GOOGLE_ANDROID
      - WINDOWS_MDM
      - MICROSOFT_STORE
      - WINGET
      - MAC_OS_APP_CATALOG
      - WINDOWS_CUSTOM
      default: UNKNOWN
      description: " - WINDOWS_MDM: Private-repo MSI installers (object storage).\n - WINDOWS_CUSTOM: Private-repo EXE/MSIX and other non-MSI custom installers (object storage); agent uses windowsCustom."
    Error:
      title: Error
      type: object
      x-examples: {}
      description: ''
      properties:
        code:
          format: int32
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Error message
        status:
          type: string
          description: HTTP status description
    devices.SoftwareApp.Setting:
      type: object
      properties:
        adminIntent:
          $ref: '#/components/schemas/devices.SoftwareApp.Setting.AdminManagementIntent'
        allowUpdateDelay:
          type: boolean
        appCatalogInstallableObjectId:
          type: string
          format: byte
        appDeliveryMethod:
          $ref: '#/components/schemas/devices.SoftwareApp.Setting.AppDeliveryMethod'
        appFileName:
          type: string
        appleVpp:
          $ref: '#/components/schemas/devices.SoftwareAppAppleVpp'
        architectures:
          type: array
          items:
            type: string
        assetKind:
          type: string
        assetSha256Size:
          type: integer
          format: int64
        assetSha256Strings:
          type: array
          items:
            type: string
        autoUpdate:
          type: boolean
        autoUpdateNotificationsDisabled:
          type: boolean
        bundleId:
          type: string
        commandLineArguments:
          type: string
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        description:
          type: string
        desiredState:
          $ref: '#/components/schemas/devices.SoftwareAppDesiredState'
        detectionRules:
          anyOf:
          - $ref: '#/components/schemas/devices.WindowsCustomDetectionRules'
          - type: 'null'
        displayVersion:
          type: string
        downloadUrl:
          type: string
        enterpriseObjectId:
          type: string
          format: byte
        format:
          $ref: '#/components/schemas/devices.SoftwareApp.Setting.Format'
        googleAndroid:
          $ref: '#/components/schemas/devices.SoftwareAppGoogleAndroid'
        iconUrl:
          type: string
        installerConfig:
          anyOf:
          - $ref: '#/components/schemas/devices.WindowsCustomInstallerConfig'
