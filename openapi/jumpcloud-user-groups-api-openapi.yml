tags:
- name: User Groups
paths:
  /usergroups:
    x-functionalities-tags:
    - systems
    get:
      description: 'This endpoint returns all User Groups.


        Available filter fields:

        - `name`

        - `disabled`

        - `type`

        - `membershipMethod`

        - `memberQueryErrorFlags`

        - `suggestionCounts.add`

        - `suggestionCounts.remove`

        - `suggestionCounts.total`

        - `attributes.sudo.enabled`

        - `attributes.sudo.withoutPassword`


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/usergroups \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: groups_user_list
      parameters:
      - $ref: '#/components/parameters/trait_fields_fields'
      - $ref: '#/components/parameters/trait_filter_filter'
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_sort_sort'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserGroup'
                type: array
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - x-api-key: []
      summary: List all User Groups
      tags:
      - User Groups
      x-scopes:
      - groups
      - groups.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/usergroups?fields=SOME_ARRAY_VALUE&filter=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/usergroups\"\n\nquerystring = {\"fields\":\"SOME_ARRAY_VALUE\",\"filter\":\"SOME_ARRAY_VALUE\",\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\",\"sort\":\"SOME_ARRAY_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/usergroups?fields=SOME_ARRAY_VALUE&filter=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE'' -Method GET -Headers $headers'
    post:
      description: 'This endpoint allows you to create a new User Group.


        See the Dynamic Group Configuration KB article for more details on maintaining a Dynamic Group.


        #### Sample Request

        ```

        curl -X POST https://console.jumpcloud.com/api/v2/usergroups \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        "name": "{Group_Name}"

        }''

        ```'
      operationId: groups_user_post
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      - $ref: '#/components/parameters/trait_queryDsl_x-query-dsl'
      requestBody:
        $ref: '#/components/requestBodies/UserGroupPost'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroup'
      security:
      - x-api-key: []
      summary: Create a new User Group
      tags:
      - User Groups
      x-scopes:
      - groups
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/usergroups \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --header 'x-query-dsl: SOME_STRING_VALUE' \\\n  --data '{\"attributes\":{\"sudo\":{\"enabled\":true,\"withoutPassword\":true},\"ldapGroups\":[{\"name\":\"string\"}],\"posixGroups\":[{\"id\":0,\"name\":\"string\"}],\"radius\":{\"reply\":[{\"name\":\"string\",\"value\":\"string\"}]},\"sambaEnabled\":true},\"email\":\"string\",\"description\":\"string\",\"memberQuery\":{\"queryType\":\"Filter\",\"filters\":[null]},\"memberQueryExemptions\":[{\"id\":\"string\",\"organizationId\":\"string\",\"type\":\"string\"}],\"memberSuggestionsNotify\":true,\"membershipMethod\":\"NOTSET\",\"name\":\"string\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/usergroups\"\n\npayload = {\n    \"attributes\": {\n        \"sudo\": {\n            \"enabled\": True,\n            \"withoutPassword\": True\n        },\n        \"ldapGroups\": [{\"name\": \"string\"}],\n        \"posixGroups\": [\n            {\n                \"id\": 0,\n                \"name\": \"string\"\n            }\n        ],\n        \"radius\": {\"reply\": [\n                {\n                    \"name\": \"string\",\n                    \"value\": \"string\"\n                }\n            ]},\n        \"sambaEnabled\": True\n    },\n    \"email\": \"string\",\n    \"description\": \"string\",\n    \"memberQuery\": {\n        \"queryType\": \"Filter\",\n        \"filters\": [None]\n    },\n    \"memberQueryExemptions\": [\n        {\n            \"id\": \"string\",\n            \"organizationId\": \"string\",\n            \"type\": \"string\"\n        }\n    ],\n    \"memberSuggestionsNotify\": True,\n    \"membershipMethod\": \"NOTSET\",\n    \"name\": \"string\"\n}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-query-dsl\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-query-dsl", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/usergroups'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"attributes":{"sudo":{"enabled":true,"withoutPassword":true},"ldapGroups":[{"name":"string"}],"posixGroups":[{"id":0,"name":"string"}],"radius":{"reply":[{"name":"string","value":"string"}]},"sambaEnabled":true},"email":"string","description":"string","memberQuery":{"queryType":"Filter","filters":[null]},"memberQueryExemptions":[{"id":"string","organizationId":"string","type":"string"}],"memberSuggestionsNotify":true,"membershipMethod":"NOTSET","name":"string"}'''
  /usergroups/{group_id}/activedirectories:
    parameters:
    - description: ObjectID of the User Group.
