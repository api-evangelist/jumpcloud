- name: GCEP
paths:
  /gcep/configuration:
    get:
      description: Returns the GCEP integration configuration for an organization
      operationId: GoogleChromeEnterprisePremiumService_GetConfiguration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.partners.GetConfigurationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - GCEP
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - partners
      - partners.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url https://console.jumpcloud.com/api/v2/gcep/configuration \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/gcep/configuration"


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/gcep/configuration'' -Method GET -Headers $headers'
      summary: Google chrome enterprise premium service get configuration
      x-summary-source: derived
    put:
      description: Creates or updates the GCEP integration configuration for an organization
      operationId: GoogleChromeEnterprisePremiumService_SetConfiguration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.partners.CommandResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jumpcloud.partners.SetConfigurationRequest'
        required: true
      tags:
      - GCEP
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - partners
      x-codeSamples:
      - lang: Shell
        source: "curl --request PUT \\\n  --url https://console.jumpcloud.com/api/v2/gcep/configuration \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"applicableOsFamilies\":[\"unspecified\"],\"customerId\":\"string\",\"googleUserEmail\":\"string\",\"state\":\"configuration_state_unspecified\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/gcep/configuration\"\n\npayload = {\n    \"applicableOsFamilies\": [\"unspecified\"],\n    \"customerId\": \"string\",\n    \"googleUserEmail\": \"string\",\n    \"state\": \"configuration_state_unspecified\"\n}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"PUT\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/gcep/configuration'' -Method PUT -Headers $headers -ContentType ''application/json'' -Body ''{"applicableOsFamilies":["unspecified"],"customerId":"string","googleUserEmail":"string","state":"configuration_state_unspecified"}'''
      summary: Google chrome enterprise premium service set configuration
      x-summary-source: derived
    delete:
      description: Deletes the GCEP integration configuration for an organization
      operationId: GoogleChromeEnterprisePremiumService_DeleteConfiguration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.partners.CommandResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - GCEP
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - partners
      x-codeSamples:
      - lang: Shell
        source: "curl --request DELETE \\\n  --url https://console.jumpcloud.com/api/v2/gcep/configuration \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/gcep/configuration"


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("DELETE", url, headers=headers)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/gcep/configuration'' -Method DELETE -Headers $headers'
      summary: Google chrome enterprise premium service delete configuration
      x-summary-source: derived
  /gcep/systems/{systemObjectId}/device-state:
    get:
      summary: Returns GCEP device trust state from the partners sync mirror for a system
      operationId: GoogleChromeEnterprisePremiumService_GetDeviceState
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.partners.GetDeviceStateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: systemObjectId
        in: path
        required: true
        schema:
          type: string
          format: byte
      tags:
      - GCEP
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - partners
      - partners.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url https://console.jumpcloud.com/api/v2/gcep/systems/{systemObjectId}/device-state \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/gcep/systems/{systemObjectId}/device-state"


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/gcep/systems/{systemObjectId}/device-state'' -Method GET -Headers $headers'
components:
  schemas:
    Error:
      title: Error
      type: object
      x-examples: {}
      description: ''
      properties:
        code:
          format: int32
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Error message
        status:
          type: string
          description: HTTP status description
    jumpcloud.partners.OSFamily:
      type: string
      enum:
      - unspecified
      - mac_os
      - windows
      default: unspecified
    jumpcloud.partners.ConnectedState:
      type: string
      enum:
      - connected_state_unspecified
      - connected_state_disconnected
      - connected_state_connected
      default: connected_state_unspecified
    jumpcloud.partners.DeviceUser:
      type: object
      properties:
        deviceUserId:
          type: string
          description: Direct read of the google_chrome_ep_device_user mirror column.
        googleEmail:
          type: string
          description: PII or sensitive data; do not log.
        lastSuccessfulReportedTime:
          type:
          - string
          - 'null'
          format: date-time
        localDeviceUsername:
          type: string
    jumpcloud.partners.SetConfigurationRequest:
      type: object
      properties:
        applicableOsFamilies:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.partners.OSFamily'
        customerId:
          type: string
        googleUserEmail:
          type: string
          description: PII or sensitive data; do not log.
        state:
          $ref: '#/components/schemas/jumpcloud.partners.ConfigurationState'
    jumpcloud.partners.CommandResponse:
      type: object
    jumpcloud.partners.ManagementStatus:
      type: string
      enum:
      - managed_unspecified
      - managed
      - not_managed
      default: managed_unspecified
    jumpcloud.partners.GetDeviceStateResponse:
      type: object
      properties:
        deviceUsers:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.partners.DeviceUser'
          description: Active google_chrome_ep_device_user rows only.
        managementStatus:
          $ref: '#/components/schemas/jumpcloud.partners.ManagementStatus'
        registrationStatus:
          $ref: '#/components/schemas/jumpcloud.partners.RegistrationStatus'
    jumpcloud.partners.GetConfigurationResponse:
      type: object
      properties:
        applicableOsFamilies:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.partners.OSFamily'
        configuredByEmail:
          type: string
          description: PII or sensitive data; do not log.
        configuredByName:
          type: string
          description: PII or sensitive data; do not log.
        configuredByUserId:
          type: string
          format: byte
        connectedState:
          $ref: '#/components/schemas/jumpcloud.partners.ConnectedState'
        customerId:
          type: string
        googleUserEmail:
          type: string
          description: PII or sensitive data; do not log.
        organizationObjectId:
          type: string
          format: byte
        registeredAt:
          type:
          - string
          - 'null'
          format: date-time
        state:
          $ref: '#/components/schemas/jumpcloud.partners.ConfigurationState'
    ErrorDetails:
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          details:
            description: 'Describes a list of objects with more detailed information of the given error. Each detail schema is according to one of the messages defined in Google''s API: https://github.com/googleapis/googleapis/blob/master/google/rpc/error_details.proto'
            type: array
            items:
              type: object
              additionalProperties: true
              description: Object according to Google's API.
    jumpcloud.partners.RegistrationStatus:
      type: string
      enum:
      - not_registered
      - registered
      default: not_registered
    jumpcloud.partners.ConfigurationState:
      type: string
      enum:
      - configuration_state_unspecified
      - configuration_state_enabled
      - configuration_state_disabled
      - configuration_state_pending_delete
      default: configuration_state_unspecified
  securitySchemes:
    x-api-key:
      description: API key used to authenticate requests.
      in: header
      name: x-api-key
      type: apiKey
