    put:
      description: 'This endpoint allows you to update the name and Custom Report URL for a Workday Instance.


        Currently, the name can not be changed from the default of `Workday Import`.


        ##### Sample Request

        ```

        curl -X PUT https://console.jumpcloud.com/api/v2/workdays/{WorkdayID} \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        "reportUrl":"{Report_URL}",

        "name":"{Name}"

        } ''

        ```'
      operationId: workdays_put
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workday-fields'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workday-output'
      security:
      - x-api-key: []
      summary: Update Workday
      tags:
      - Workday Import
      x-scopes:
      - directories
      x-codeSamples:
      - lang: Shell
        source: "curl --request PUT \\\n  --url https://console.jumpcloud.com/api/v2/workdays/{id} \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '{\"name\":\"string\",\"reportUrl\":\"string\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/workdays/{id}\"\n\npayload = {\n    \"name\": \"string\",\n    \"reportUrl\": \"string\"\n}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"PUT\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/workdays/{id}'' -Method PUT -Headers $headers -ContentType ''application/json'' -Body ''{"name":"string","reportUrl":"string"}'''
