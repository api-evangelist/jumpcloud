paths:
  /workdays:
    x-functionalities-tags:
    - workday
    get:
      description: 'This endpoint will return all the available information about all your instances of Workday.


        ##### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/workdays/ \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: workdays_list
      parameters:
      - $ref: '#/components/parameters/trait_fields_fields'
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_sort_sort'
      - $ref: '#/components/parameters/trait_filter_filter'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/workday-output'
                type: array
      security:
      - x-api-key: []
      summary: List Workdays
      tags:
      - Workday Import
      x-scopes:
      - directories
      - directories.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/workdays?fields=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE&filter=SOME_ARRAY_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/workdays\"\n\nquerystring = {\"fields\":\"SOME_ARRAY_VALUE\",\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\",\"sort\":\"SOME_ARRAY_VALUE\",\"filter\":\"SOME_ARRAY_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/workdays?fields=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE&filter=SOME_ARRAY_VALUE'' -Method GET -Headers $headers'
    post:
      description: 'This endpoint allows you to create a new workday instance.


        You must supply a username and password for `Basic Authentication` that is the same as your WorkDay Integrator System User. Failure to provide these credentials will result in the request being rejected.


        Currently `O-Auth` isn''t a supported authentication protocol for WorkDay, but will be in the future.


        Currently, only one instance is allowed and it must be `Workday Import`.


        #### Sample Request

        ```

        curl -X POST https://console.jumpcloud.com/api/v2/workdays/ \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        "name": "Workday2",

        "reportUrl":"https://workday.com/ccx/service/customreport2/gms/user/reportname?format=json",

        "auth": {

        "basic": {

        "username": "someDeveloper",

        "password": "notTheRealPassword"

        }

        }

        }''

        ```'
      operationId: workdays_post
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workday-input'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workday-output'
      security:
      - x-api-key: []
      summary: Create new Workday
      tags:
      - Workday Import
      x-scopes:
      - directories
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/workdays \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '{\"auth\":{\"basic\":{\"password\":\"in tempor ipsum quis\",\"username\":\"mollit ex\"},\"oauth\":{\"code\":\"non laborum dolore\"}},\"name\":\"dolore tempor\",\"reportUrl\":\"est sit laboris\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/workdays\"\n\npayload = {\n    \"auth\": {\n        \"basic\": {\n            \"password\": \"in tempor ipsum quis\",\n            \"username\": \"mollit ex\"\n        },\n        \"oauth\": {\"code\": \"non laborum dolore\"}\n    },\n    \"name\": \"dolore tempor\",\n    \"reportUrl\": \"est sit laboris\"\n}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/workdays'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"auth":{"basic":{"password":"in tempor ipsum quis","username":"mollit ex"},"oauth":{"code":"non laborum dolore"}},"name":"dolore tempor","reportUrl":"est sit laboris"}'''
