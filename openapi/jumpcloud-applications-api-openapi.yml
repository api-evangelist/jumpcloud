openapi: 3.2.0
info:
  contact:
    name: JumpCloud Support
    url: https://jumpcloud.com/support/contact-jumpcloud-support
  description: '# Overview


    JumpCloud''s V2 API. This set of endpoints allows JumpCloud customers to manage objects, groupings and mappings and interact with the JumpCloud Graph. > **Note:** See JumpCloud Data Centers: Login URLs and Service Endpoints to learn more. ## API Best Practices


    Read the linked Help Article below for guidance on retrying failed requests to JumpCloud''s REST API, as well as best practices for structuring subsequent retry requests. Customizing retry mechanisms based on these recommendations will increase the reliability and dependability of your API calls. Covered topics include:

    1. Important Considerations

    2. Supported HTTP Request Methods

    3. Response codes

    4. API Key rotation

    5. Paginating

    6. Error handling

    7. Retry rates


    JumpCloud Help Center - API Best Practices


    # Directory Objects


    This API offers the ability to interact with some of our core features; otherwise known as Directory Objects. The Directory Objects are:


    * Commands

    * Policies

    * Policy Groups

    * Applications

    * Systems

    * Users

    * User Groups

    * System Groups

    * Radius Servers

    * Directories: Office 365, LDAP,G-Suite, Active Directory

    * Duo accounts and applications. The Directory Object is an important concept to understand in order to successfully use JumpCloud API. ## JumpCloud Graph


    We''ve also introduced the concept of the JumpCloud Graph along with Directory Objects. The Graph is a powerful aspect of our platform which will enable you to associate objects with each other, or establish membership for certain objects to become members of other objects. Specific `GET` endpoints will allow you to traverse the JumpCloud Graph to return all indirect and directly bound objects in your organization. | !alt text |

    |:--:|

    | **This diagram highlights our association and membership model as it relates to Directory Objects.** |


    # API Key


    ## Access Your API Key


    To locate your API Key:


    1. Log into the JumpCloud Admin Console. 2. Go to the username drop down located in the top-right of the Console. 3. Retrieve your API key from API Settings. ## API Key Considerations


    This API key is associated to the currently logged in administrator. Other admins will have different API keys. **WARNING** Please keep this API key secret, as it grants full access to any data accessible via your JumpCloud console account. You can also reset your API key in the same location in the JumpCloud Admin Console. ## Recycling or Resetting Your API Key


    In order to revoke access with the current API key, simply reset your API key. This will render all calls using the previous API key inaccessible. Your API key will be passed in as a header with the header name "x-api-key". ```bash

    curl -H "x-api-key: [YOUR_API_KEY_HERE]" "https://console.jumpcloud.com/api/v2/systemgroups"

    ```


    # System Context


    * Introduction

    * Supported endpoints

    * Response codes

    * Authentication

    * Additional examples

    * Third party


    ## Introduction


    JumpCloud System Context Authorization is an alternative way to authenticate with a subset of JumpCloud''s REST APIs. Using this method, a system can manage its information and resource associations, allowing modern auto provisioning environments to scale as needed. **Notes:**


    * The following documentation applies to Linux Operating Systems only. * Systems that have been automatically enrolled using Apple''s Device Enrollment Program (DEP) or systems enrolled using the User Portal install are not eligible to use the System Context API to prevent unauthorized access to system groups and resources. If a script that utilizes the System Context API is invoked on a system enrolled in this way, it will display an error. ## Supported Endpoints


    JumpCloud System Context Authorization can be used in conjunction with Systems endpoints found in the V1 API and certain System Group endpoints found in the v2 API.'
  title: JumpCloud Applications API
  version: '2.0'
servers:
- url: https://console.jumpcloud.com/api/v2
  description: United States (US)
  x-jc-region: us
- url: https://console.eu.jumpcloud.com/api/v2
  description: European Union (EU)
  x-jc-region: eu
- url: https://console.in.jumpcloud.com/api/v2
  description: India (IN)
  x-jc-region: in
tags:
- name: Applications
paths:
  /applications/{application_id}:
    parameters:
    - description: ObjectID of the Application.
      in: path
      name: application_id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - user-portal-applications
    get:
      description: The endpoint retrieves an Application.
      operationId: applications_get
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
      security:
      - x-api-key: []
      summary: Get an Application
      tags:
      - Applications
      x-scopes:
      - applications
      - applications.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url https://console.jumpcloud.com/api/v2/applications/{application_id} \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/applications/{application_id}\"\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/applications/{application_id}'' -Method GET -Headers $headers'
  /applications/{application_id}/associations:
    parameters:
    - description: ObjectID of the Application.
      in: path
      name: application_id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - user-portal-applications
    get:
      description: 'This endpoint will return the _direct_ associations of an Application. A direct association can be a non-homogeneous relationship between 2 different objects, for example Applications and User Groups.


        #### Sample Request

        ```

        curl -X GET ''https://console.jumpcloud.com/api/v2/applications/{Application_ID}/associations?targets=user_group \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: graph_applicationAssociationsList
      parameters:
      - $ref: '#/components/parameters/trait_graphTargetsApplication_targets'
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GraphConnection'
                type: array
      security:
      - x-api-key: []
      summary: List the associations of an Application
      tags:
      - Applications
      x-scopes:
      - associations.applications
      - associations.applications.readonly
      - associations
      - associations.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/applications/{application_id}/associations?targets=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/applications/{application_id}/associations\"\n\nquerystring = {\"targets\":\"SOME_ARRAY_VALUE\",\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/applications/{application_id}/associations?targets=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE'' -Method GET -Headers $headers'
    post:
      description: 'This endpoint allows you to manage the _direct_ associations of an Application. A direct association can be a non-homogeneous relationship between 2 different objects, for example Application and User Groups.


        #### Sample Request

        ```

        curl -X POST ''https://console.jumpcloud.com/api/v2/applications/{Application_ID}/associations'' \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        "op": "add",

        "type": "user_group",

        "id": "{Group_ID}"

        }''

        ```'
      operationId: graph_applicationAssociationsPost
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphOperation-Application'
      responses:
        '204':
          description: OK
      security:
      - x-api-key: []
      summary: Manage the associations of an Application
      tags:
      - Applications
      x-scopes:
      - associations.applications
      - associations
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/applications/{application_id}/associations \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '{\"id\":\"string\",\"op\":\"add\",\"attributes\":{},\"type\":\"agent_group\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/applications/{application_id}/associations\"\n\npayload = {\n    \"id\": \"string\",\n    \"op\": \"add\",\n    \"attributes\": {},\n    \"type\": \"agent_group\"\n}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/applications/{application_id}/associations'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"id":"string","op":"add","attributes":{},"type":"agent_group"}'''
  /applications/{application_id}/import/jobs:
    parameters:
    - description: ObjectID of the Application.
      in: path
      name: application_id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - user-portal-applications
    post:
      description: 'This endpoint allows you to create a user import job that will import new users and/or update existing users in JumpCloud from the application. The endpoint can currently only be used for applications that have an active Identity Management custom API integration. The request will fail with a “Not found” error for applications if that type of integration is not configured. To learn more about configuring this type of integration, read Import users from an external identity source using a custom API integration.

        #### Sample Request

        ```

        curl -X POST https://console.jumpcloud.com/api/v2/applications/{application_id}/import/jobs \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -H ''x-org-id: {ORG_ID}'' \

        -d ''{

        "allowUserReactivation": true,

        "operations": [

        "users.create",

        "users.update"

        ]

        "queryString": "location=Chicago&department=IT"

        }''

        ```'
      operationId: import_create
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportUsersRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/job-id'
        '400':
          $ref: '#/components/responses/trait_standardErrors_400'
        '401':
          $ref: '#/components/responses/trait_standardErrors_401'
        '403':
          $ref: '#/components/responses/trait_standardErrors_403'
        '404':
          $ref: '#/components/responses/trait_standardErrors_404'
        '500':
          $ref: '#/components/responses/trait_standardErrors_500'
      security:
      - x-api-key: []
      summary: Create an import job
      tags:
      - Applications
      x-scopes:
      - applications
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/applications/{application_id}/import/jobs \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '{\"queryString\":\"\",\"allowUserReactivation\":true,\"operations\":[\"users.create\",\"users.update\"]}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/applications/{application_id}/import/jobs\"\n\npayload = {\n    \"queryString\": \"\",\n    \"allowUserReactivation\": True,\n    \"operations\": [\"users.create\", \"users.update\"]\n}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/applications/{application_id}/import/jobs'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"queryString":"","allowUserReactivation":true,"operations":["users.create","users.update"]}'''
  /applications/{application_id}/logo:
    x-functionalities-tags:
    - user-portal-applications
    post:
      summary: Save application logo
      tags:
      - Applications
      operationId: applications_postLogo
      responses:
        '204':
          description: NO_CONTENT
        '400':
          $ref: '#/components/responses/trait_standardErrors_400'
        '401':
          $ref: '#/components/responses/trait_standardErrors_401'
        '403':
          $ref: '#/components/responses/trait_standardErrors_403'
        '404':
          $ref: '#/components/responses/trait_standardErrors_404'
        '409':
          $ref: '#/components/responses/trait_standardErrors_409'
        '500':
          $ref: '#/components/responses/trait_standardErrors_500'
      security:
      - x-api-key: []
      x-scopes:
      - applications
      - applications.update
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  description: The file to upload.
                  type: string
                  contentMediaType: application/octet-stream
      description: 'This endpoint sets the logo for an application.


        #### Sample Request

        ```

        curl -X POST ''https://console.jumpcloud.com/api/v2/applications/{Application_ID}/logo \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/applications/{application_id}/logo \\\n  --header 'content-type: multipart/form-data' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --form image=string"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/applications/{application_id}/logo\"\n\npayload = \"-----011000010111000001101001\\r\\nContent-Disposition: form-data; name=\\\"image\\\"\\r\\n\\r\\nstring\\r\\n-----011000010111000001101001--\\r\\n\"\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"multipart/form-data\"\n}\n\nresponse = requests.request(\"POST\", url, data=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "multipart/form-data")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/applications/{application_id}/logo'' -Method POST -Headers $headers -ContentType ''multipart/form-data'' -Body ''-----011000010111000001101001

          Content-Disposition: form-data; name="image"


          string

          -----011000010111000001101001--

          '''
    delete:
      description: Deletes the specified image from an application
      operationId: applications_deleteLogo
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      responses:
        '204':
          description: NO_CONTENT
        '400':
          $ref: '#/components/responses/trait_standardErrors_400'
        '401':
          $ref: '#/components/responses/trait_standardErrors_401'
        '403':
          $ref: '#/components/responses/trait_standardErrors_403'
        '404':
          $ref: '#/components/responses/trait_standardErrors_404'
        '409':
          $ref: '#/components/responses/trait_standardErrors_409'
        '500':
          $ref: '#/components/responses/trait_standardErrors_500'
      security:
      - x-api-key: []
      summary: Delete application image
      tags:
      - Applications
      x-scopes:
      - applications
      - applications.update
      x-codeSamples:
      - lang: Shell
        source: "curl --request DELETE \\\n  --url https://console.jumpcloud.com/api/v2/applications/{application_id}/logo \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/applications/{application_id}/logo\"\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"DELETE\", url, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/applications/{application_id}/logo'' -Method DELETE -Headers $headers'
  /applications/{application_id}/agents:
    parameters:
    - description: Application ID (24-character hexadecimal string).
      in: path
      name: application_id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - user-portal-applications
    - agent-groups
    get:
      description: Retrieves a list of all agents assigned to an application in your organization.
      operationId: graph_applicationTraverseAgent
      parameters:
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_filter_filter'
      - in: query
        name: syncStatus
        description: When `true`, includes each agent's provisioning sync status for this application in the `syncStatus` and `externalId` fields.
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GraphObjectWithPaths'
                type: array
      security:
      - x-api-key: []
      summary: List an application's assigned agents
      tags:
      - Applications
      x-scopes:
      - agents
      - agents.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/applications/{application_id}/agents?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&filter=SOME_ARRAY_VALUE&syncStatus=SOME_BOOLEAN_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/applications/{application_id}/agents\"\n\nquerystring = {\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\",\"filter\":\"SOME_ARRAY_VALUE\",\"syncStatus\":\"SOME_BOOLEAN_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/applications/{application_id}/agents?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&filter=SOME_ARRAY_VALUE&syncStatus=SOME_BOOLEAN_VALUE'' -Method GET -Headers $headers'
  /applications/{application_id}/usergroups:
    parameters:
    - description: ObjectID of the Application.
      in: path
      name: application_id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - user-portal-applications
    get:
      description: 'This endpoint will return all Users Groups bound to an Application, either directly or indirectly, essentially traversing the JumpCloud Graph for your Organization.


        Each element will contain the group''s type, id, attributes and paths.


        The `attributes` object is a key/value hash of compiled graph attributes for all paths followed.


        The `paths` array enumerates each path from this Application to the corresponding User Group; this array represents all grouping and/or associations that would have to be removed to deprovision the User Group from this Application.


        See `/members` and `/associations` endpoints to manage those collections.


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/applications/{Application_ID}/usergroups \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: graph_applicationTraverseUserGroup
      parameters:
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_filter_filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GraphObjectWithPaths'
                type: array
      security:
      - x-api-key: []
      summary: List the User Groups bound to an Application
      tags:
      - Applications
      x-scopes:
      - groups
      - groups.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/applications/{application_id}/usergroups?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&filter=SOME_ARRAY_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/applications/{application_id}/usergroups\"\n\nquerystring = {\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\",\"filter\":\"SOME_ARRAY_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/applications/{application_id}/usergroups?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&filter=SOME_ARRAY_VALUE'' -Method GET -Headers $headers'
  /applications/{application_id}/users:
    parameters:
    - description: ObjectID of the Application.
      in: path
      name: application_id
      required: true
