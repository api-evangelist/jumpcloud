          type: boolean
        enableResetLockoutCounter:
          type: boolean
        lockoutTimeInSeconds:
          type: integer
          format: int32
        maxHistory:
          type: integer
          format: int32
        maxLoginAttempts:
          type: integer
          format: int32
        minChangePeriodInDays:
          type: integer
          format: int32
        minLength:
          type: integer
          format: int32
        name:
          type: string
