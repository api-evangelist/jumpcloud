          type: boolean
        needsNumeric:
          type: boolean
        needsSymbolic:
          type: boolean
        needsUppercase:
          type: boolean
        passwordExpirationInDays:
          type: integer
          format: int32
        precedence:
          type: integer
          format: int32
        resetLockoutCounterMinutes:
          type: integer
          format: int32
    jumpcloud.password.CustomBannedKeywordsResponse:
      type: object
      properties:
        count:
          type: integer
          format: int32
        keywords:
          type: array
          items:
            type: string
        max:
          type: integer
          format: int32
    jumpcloud.password.PolicyPrecedence:
      type: object
      properties:
        objectId:
          type: string
          format: byte
        precedence:
          type: integer
          format: int32
    jumpcloud.password.Response:
      type: object
      properties:
        cached:
          type: boolean
