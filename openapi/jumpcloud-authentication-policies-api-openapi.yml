  /authn/policy-evaluations/summary:
    post:
      summary: Get Policy Evaluations Summary
      description: 'Get aggregated KPI summary and available policies for Conditional Access Policy (CAP) evaluations.


        #### Sample Request

        ```

        curl -X POST https://console.jumpcloud.com/api/v2/authn/policy-evaluations/summary \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        "timeRange": {

        "start": "2026-06-01T00:00:00Z",

        "end": "2026-06-07T00:00:00Z"

        },

        "filters": {

        "resourceType": "USER_PORTAL"

        }

        }''

        ```'
