components:
  schemas:
    AuthnPolicyTargets:
      title: AuthnPolicyTargets
      type: object
      properties:
        excludedApplications:
          type: array
          items:
            type: string
          description: 'SSO application IDs to exclude when the policy applies to all applications (resources = [{ type: application }] with no id). Omitted or empty when targeting specific applications.'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/AuthnPolicyResourceTarget'
        userAttributes:
          $ref: '#/components/schemas/AuthnPolicyUserAttributeTarget'
        userGroups:
          $ref: '#/components/schemas/AuthnPolicyUserGroupTarget'
        users:
          $ref: '#/components/schemas/AuthnPolicyUserTarget'
    Error:
      title: Error
      type: object
      x-examples: {}
      description: ''
      properties:
        code:
          format: int32
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Error message
        status:
          type: string
          description: HTTP status description
    AuthnPolicyEvaluationsTimeRange:
      type: object
      description: Inclusive UTC window; maximum span is 90 days.
      required:
      - start
      - end
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    AuthnPolicyCustomErrorMessage:
      title: AuthnPolicyCustomErrorMessage
      type: object
      description: Custom error message for an authentication policy.
      properties:
        message:
          type: string
          description: The custom error message to be displayed when the policy is applied.
        enabled:
          type: boolean
          description: Indicates whether the custom error message is enabled or not.
        primary_help:
          $ref: '#/components/schemas/AuthnPolicyHelpLink'
        secondary_help:
          $ref: '#/components/schemas/AuthnPolicyHelpLink'
      required:
      - message
      - enabled
    AuthnPolicyUserAttributeFilter:
      title: AuthnPolicyUserAttributeFilter
      type: object
      properties:
        field:
          type: string
          description: The only field that is currently supported is ldap_binding_user
        operator:
          type: string
          enum:
          - EQ
        value:
          $ref: '#/components/schemas/AnyValue'
    AuthnPolicyEvaluationsFilterOption:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    AuthnPolicyEvaluationsSummaryResponse:
      type: object
      properties:
        aggregates:
          type: object
          properties:
            totalHits:
              type: integer
            policiesApplied:
              type: integer
            notApplied:
              type: integer
            failedConditionCounts:
              type: object
              additionalProperties:
                type: integer
            actionResultDistribution:
              type: object
              additionalProperties:
                type: integer
            mfaDistribution:
              type: object
              additionalProperties:
                type: integer
        availablePolicies:
          type: array
          items:
            $ref: '#/components/schemas/AuthnPolicyEvaluationsAvailablePolicy'
    AuthnPolicyEvaluationsAvailablePolicy:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    AuthnPolicyType:
      title: AuthnPolicyType
      type: string
      enum:
      - user_portal
      - application
      - ldap
      - admin_portal
      default: user_portal
    ErrorDetails:
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          details:
            description: 'Describes a list of objects with more detailed information of the given error. Each detail schema is according to one of the messages defined in Google''s API: https://github.com/googleapis/googleapis/blob/master/google/rpc/error_details.proto'
            type: array
            items:
              type: object
              additionalProperties: true
              description: Object according to Google's API.
    AuthnPolicyEvaluationsDetailsRequest:
      type: object
      properties:
        timeRange:
          $ref: '#/components/schemas/AuthnPolicyEvaluationsTimeRange'
        filters:
          $ref: '#/components/schemas/AuthnPolicyEvaluationsFilters'
        limit:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        skip:
          type: integer
          default: 0
          minimum: 0
    AuthnPolicyHelpLink:
      title: AuthnPolicyHelpLink
      type: object
      description: Help link for an authentication policy.
      properties:
        text:
          type: string
          description: The text to be displayed for the help link.
        url:
          type: string
          description: The URL to be opened when the help link is clicked.
    AuthnPolicyUserTarget:
      title: AuthnPolicyUserTarget
      type: object
      properties:
        inclusions:
          type: array
          items:
            type: string
    AuthnPolicyEffect:
      title: AuthnPolicyEffect
      type: object
      properties:
        action:
          type: string
          enum:
          - allow
          - deny
          - unknown
        obligations:
          $ref: '#/components/schemas/AuthnPolicyObligations'
        custom_error_message:
          $ref: '#/components/schemas/AuthnPolicyCustomErrorMessage'
      required:
      - action
      x-examples:
        example-allow-with-mfa:
          action: allow
          obligations:
            mfa:
              required: true
        example-allow:
          action: allow
        example-deny:
          action: deny
    AuthnPolicyEvaluationsFilterOptionsRequest:
      type: object
      description: Request to get filter options for the authn policy evaluations.
      required:
      - timeRange
      properties:
        timeRange:
          $ref: '#/components/schemas/AuthnPolicyEvaluationsTimeRange'
        policyId:
          type: string
        policyName:
          type: string
    AuthnPolicyObligations:
      title: AuthnPolicyObligations
      type: object
      properties:
        mfa:
          type: object
          properties:
            required:
              type: boolean
            interval:
              type: object
              description: Optional MFA sign-in interval. Absent means every access.
              properties:
                preset:
                  type: string
                  description: 1h | 4h | 8h | 12h | 24h. Omit interval for every access.
                custom:
                  type: object
                  properties:
                    value:
                      type: integer
                    unit:
                      type: string
                      description: hours | days
        userVerification:
          type: object
          properties:
            requirement:
              type: string
              enum:
              - none
              - optional
              - required
        mfaFactors:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - DURT
                - WEBAUTHN
                - PUSH
                - DUO
                - TOTP
                - SMS_OTP
    AnyValue:
      description: Can be any value - string, number, boolean, array or object.
    AuthnPolicyResourceTarget:
      title: AuthnPolicyResourceTarget
      type: object
      properties:
        type:
          type: string
          enum:
          - admin_portal
          - user_portal
          - application
          - ldap
        id:
          description: Object ID of the resource target. If undefined, then all resources of the given type are targeted.
          type: string
      required:
      - type
    AuthnPolicyEvaluationsSummaryRequest:
      type: object
      properties:
        timeRange:
          $ref: '#/components/schemas/AuthnPolicyEvaluationsTimeRange'
        filters:
          $ref: '#/components/schemas/AuthnPolicyEvaluationsFilters'
    AuthnPolicyEvaluationsDetailsResponse:
      type: object
      properties:
        governedCount:
          type: integer
        notGovernedCount:
          type: integer
        totalRowCount:
          type: integer
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AuthnPolicyEvaluationsEvent'
    AuthnPolicyEvaluationsOptionsResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AuthnPolicyEvaluationsFilterOption'
        applications:
          type: array
          items:
            $ref: '#/components/schemas/AuthnPolicyEvaluationsFilterOption'
        userGroups:
          type: array
          items:
            $ref: '#/components/schemas/AuthnPolicyEvaluationsFilterOption'
        resourceTypes:
          type: array
          items:
            type: string
        usersTruncated:
          description: Indicates if the users list is truncated.
          type: boolean
        applicationsTruncated:
          description: Indicates if the applications list is truncated.
          type: boolean
        userGroupsTruncated:
          description: Indicates if the user groups list is truncated.
          type: boolean
    AuthnPolicyUserAttributeTarget:
      title: AuthnPolicyUserAttributeTarget
      description: User attribute targets are currently only supported for LDAP policies.
      type: object
      properties:
        exclusions:
          type: array
          items:
            $ref: '#/components/schemas/AuthnPolicyUserAttributeFilter'
        inclusions:
          type: array
          items:
            $ref: '#/components/schemas/AuthnPolicyUserAttributeFilter'
    AuthnPolicyEvaluationsEvent:
      type: object
      properties:
        correlationId:
          type: string
        policy:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        user:
          type: object
          properties:
            id:
              type: string
            displayName:
              type: string
        application:
          type: object
          properties:
            id:
              type: string
            displayName:
              type: string
        userGroups:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              displayName:
                type: string
        resourceType:
          type: string
        actionResult:
          type: string
        monitorOnly:
          type: boolean
        createdAt:
          type: string
          format: date-time
    AuthnPolicyEvaluationsFilters:
      type: object
      properties:
        policyId:
          type: string
        policyName:
          type: string
        userGroupIds:
          type: array
          maxItems: 50
          items:
            type: string
        userObjectId:
          type: string
        applicationObjectId:
          type: string
        resourceType:
          type: string
    AuthnPolicyUserGroupTarget:
      title: AuthnPolicyUserGroupTarget
      type: object
      properties:
        inclusions:
          type: array
          items:
            type: string
        exclusions:
          type: array
          items:
            type: string
    AuthnPolicy:
      title: AuthnPolicy
      type: object
      description: This represents an authentication policy.  See the details of each field for valid values and restrictions.
      properties:
        id:
          readOnly: true
          type: string
        name:
          type: string
        description:
          type: string
        disabled:
          type: boolean
        monitorOnly:
          type: boolean
        managedBy:
          type: string
          description: Policy ownership.
          readOnly: true
          enum:
          - ORGANIZATION
          - ENTERPRISE
          - UNKNOWN
        orgId:
          type: string
          description: Owning organization object id (hex). Populated on aggregate list rows.
          readOnly: true
        orgName:
          type: string
          description: Live owning organization display name from organization metadata. Populated on aggregate list rows when managedBy is ORGANIZATION.
          readOnly: true
        effect:
          $ref: '#/components/schemas/AuthnPolicyEffect'
        targets:
          $ref: '#/components/schemas/AuthnPolicyTargets'
        type:
          $ref: '#/components/schemas/AuthnPolicyType'
        conditions:
          type: object
          description: "Conditions may be added to an authentication policy using the following conditional language:\n\n```\n<conditions> ::= <expression>\n<expression> ::= <deviceEncrypted> | <deviceManaged> | <ipAddressIn> |\n                 <locationIn> | <notExpression> | <allExpression> |\n                 <anyExpression>\n<deviceEncrypted> ::= { \"deviceEncrypted\": <boolean> }\n<deviceManaged> ::= { \"deviceManaged\": <boolean> }\n<ipAddressIn> ::= { \"ipAddressIn\": [ <objectId>, ... ] }\n<locationIn> ::= { \"locationIn\": {\n                     \"countries\": [\n                       <iso_3166_country_code>, ...\n                     ]\n                   }\n                 }\n<notExpression> ::= { \"not\": <expression> }\n<allExpression> ::= { \"all\": [ <expression>, ... ] }\n<anyExpression> ::= { \"any\": [ <expression>, ... ] }\n```\n\nFor example, to add a condition that applies to IP addresses in a given list, the following condition can be added:\n\n```\n{\"ipAddressIn\": [ <ip_list_object_id> ]}\n```\n\nIf you would rather exclude IP addresses in the given lists, the following condition could be added:\n\n```\n{\n  \"not\": {\n    \"ipAddressIn\": [ <ip_list_object_id_1>, <ip_list_object_id_2> ]\n  }\n}\n```\n\nYou may also include more than one condition and choose whether \"all\" or \"any\" of them must be met for the policy to apply:\n\n```\n{\n  \"all\": [\n    {\n      \"ipAddressIn\": [ <ip_list_object_id>, ... ]\n    },\n    {\n      \"deviceManaged\": true\n    },\n    {\n      \"locationIn\": {\n        countries: [ <iso_3166_country_code>, ... ]\n      }\n    }\n  ]\n}\n```"
  responses:
    trait_standardErrors_409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    trait_standardErrors_500:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    trait_standardErrors_400:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetails'
    trait_standardErrors_403:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    trait_standardErrors_404:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    trait_standardErrors_401:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    trait_limit_limit:
      description: The number of records to return at once. Limited to 100.
      in: query
      name: limit
      schema:
        type: integer
        default: 10
    trait_filter_filter:
      description: 'A filter to apply to the query.


        **Filter structure**: `<field>:<operator>:<value>`.


        **field** = Populate with a valid field from an endpoint response.


        **operator** =  Supported operators are: eq, ne, gt, ge, lt, le, between, search, in.

        _Note: v1 operators differ from v2 operators._


        **value** = Populate with the value you want to search for. Is case sensitive. Supports wild cards.


        **EX:** `GET /api/v2/groups?filter=name:eq:Test+Group`'
      in: query
      name: filter
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        default: []
    trait_skip_skip:
      description: The offset into the records to return.
      in: query
      name: skip
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    trait_sort_sort:
      description: 'The comma separated fields used to sort the collection.

        Default sort is ascending, prefix with `-` to sort descending.

        '
      in: query
      name: sort
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        default: []
    trait_multiTenantRequestHeaders_x-org-id:
      description: Organization identifier that can be obtained from console settings.
      in: header
      name: x-org-id
      schema:
        type: string
    trait_listCount_x-total-count:
      in: header
      name: x-total-count
      schema:
        type: integer
  requestBodies:
    AuthnPolicy:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthnPolicy'
  securitySchemes:
    x-api-key:
      description: API key used to authenticate requests.
      in: header
      name: x-api-key
      type: apiKey
