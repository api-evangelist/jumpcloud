      - authn
      - authn.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/authn/policy-evaluations/summary \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '{\"timeRange\":{\"start\":\"2019-08-24T14:15:22Z\",\"end\":\"2019-08-24T14:15:22Z\"},\"filters\":{\"policyId\":\"string\",\"policyName\":\"string\",\"userGroupIds\":[\"string\"],\"userObjectId\":\"string\",\"applicationObjectId\":\"string\",\"resourceType\":\"string\"}}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/authn/policy-evaluations/summary\"\n\npayload = {\n    \"timeRange\": {\n        \"start\": \"2019-08-24T14:15:22Z\",\n        \"end\": \"2019-08-24T14:15:22Z\"\n    },\n    \"filters\": {\n        \"policyId\": \"string\",\n        \"policyName\": \"string\",\n        \"userGroupIds\": [\"string\"],\n        \"userObjectId\": \"string\",\n        \"applicationObjectId\": \"string\",\n        \"resourceType\": \"string\"\n    }\n}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
