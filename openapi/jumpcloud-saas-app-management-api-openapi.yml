paths:
  /saas-management/application-catalog:
    get:
      tags:
      - SaaS App Management
      summary: List catalog applications
      description: Retrieve a paginated list of catalog applications. Supports filtering by name and batch retrieval by IDs.
      operationId: listCatalogApplications
      x-scopes:
      - saas
      - saas.readonly
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      parameters:
      - name: limit
        in: query
        description: Maximum number of catalog applications to return
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        description: Number of catalog applications to skip
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: name
        in: query
        description: Filter catalog applications by name
        required: false
        schema:
          type: string
      - name: ids
        in: query
        description: List of catalog application IDs to retrieve (batch-get). When provided, pagination and name filter are ignored.
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: List of catalog applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.saas_app_management.PublicAPIListCatalogApplicationsResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.saas_app_management.error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.saas_app_management.error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.saas_app_management.error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.saas_app_management.error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.saas_app_management.error'
        default:
          description: Generic error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.saas_app_management.error'
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/saas-management/application-catalog?limit=SOME_INTEGER_VALUE&offset=SOME_INTEGER_VALUE&name=SOME_STRING_VALUE&ids=SOME_ARRAY_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
