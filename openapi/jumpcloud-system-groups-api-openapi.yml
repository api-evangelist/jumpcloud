paths:
  /systemgroups:
    x-functionalities-tags:
    - systemgroups
    get:
      description: 'This endpoint returns all System Groups.


        Available filter fields:

        - `name`

        - `disabled`

        - `type`

        - `membershipMethod`

        - `memberQueryErrorFlags`


        #### Sample Request


        ```

        curl -X GET https://console.jumpcloud.com/api/v2/systemgroups \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: groups_system_list
      parameters:
      - $ref: '#/components/parameters/trait_fields_fields'
      - $ref: '#/components/parameters/trait_filter_filter'
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_sort_sort'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SystemGroup'
                type: array
              examples:
                response:
                  value:
                  - id: 5f91c8695e980f0001c44611
                  - type: system_group
                  - id: 5f91c8695e980f0001c44615
                    name: group1
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - x-api-key: []
      summary: List all System Groups
      tags:
      - System Groups
      x-scopes:
      - groups
      - groups.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/systemgroups?fields=SOME_ARRAY_VALUE&filter=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/systemgroups\"\n\nquerystring = {\"fields\":\"SOME_ARRAY_VALUE\",\"filter\":\"SOME_ARRAY_VALUE\",\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\",\"sort\":\"SOME_ARRAY_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/systemgroups?fields=SOME_ARRAY_VALUE&filter=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE'' -Method GET -Headers $headers'
    post:
      description: 'This endpoint allows you to create a new System Group.


        See the Dynamic Group Configuration KB article for more details on maintaining a Dynamic Group.


        #### Sample Request


        ```

        curl -X POST https://console.jumpcloud.com/api/v2/systemgroups \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        "name": "{Group_Name}"

        }''

        ```'
      operationId: groups_system_post
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      - $ref: '#/components/parameters/trait_queryDsl_x-query-dsl'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemGroupPost'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemGroup'
      security:
      - x-api-key: []
      summary: Create a new System Group
      tags:
      - System Groups
      x-scopes:
      - groups
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/systemgroups \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --header 'x-query-dsl: SOME_STRING_VALUE' \\\n  --data '{\"attributes\":{},\"email\":\"string\",\"description\":\"string\",\"name\":\"string\",\"memberQuery\":{\"queryType\":\"Filter\",\"filters\":[null]},\"membershipMethod\":\"NOTSET\",\"memberSuggestionsNotify\":true,\"memberQueryExemptions\":[{\"id\":\"string\",\"organizationId\":\"string\",\"type\":\"string\"}]}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/systemgroups\"\n\npayload = {\n    \"attributes\": {},\n    \"email\": \"string\",\n    \"description\": \"string\",\n    \"name\": \"string\",\n    \"memberQuery\": {\n        \"queryType\": \"Filter\",\n        \"filters\": [None]\n    },\n    \"membershipMethod\": \"NOTSET\",\n    \"memberSuggestionsNotify\": True,\n    \"memberQueryExemptions\": [\n        {\n            \"id\": \"string\",\n            \"organizationId\": \"string\",\n            \"type\": \"string\"\n        }\n    ]\n}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-query-dsl\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-query-dsl", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/systemgroups'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"attributes":{},"email":"string","description":"string","name":"string","memberQuery":{"queryType":"Filter","filters":[null]},"membershipMethod":"NOTSET","memberSuggestionsNotify":true,"memberQueryExemptions":[{"id":"string","organizationId":"string","type":"string"}]}'''
