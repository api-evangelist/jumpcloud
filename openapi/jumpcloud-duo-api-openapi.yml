    get:
      description: 'This endpoint returns all the Duo accounts for your organization. Note: There can currently only be one Duo account for your organization.


        #### Sample Request

        ```

        curl https://console.jumpcloud.com/api/v2/duo/accounts \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: duo_accountList
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DuoAccount'
                type: array
      security:
      - x-api-key: []
      summary: List Duo Accounts
      tags:
      - Duo
      x-scopes:
      - mfa
      - mfa.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url https://console.jumpcloud.com/api/v2/duo/accounts \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/duo/accounts\"\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/duo/accounts'' -Method GET -Headers $headers'
    post:
      description: 'Registers a Duo account for an organization. Only one Duo account will be allowed,

        in case an organization has a Duo account already a 409 (Conflict) code will be returned.


        #### Sample Request

        ```

        curl -X POST https://console.jumpcloud.com/api/v2/duo/accounts \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{}''

        ```'
