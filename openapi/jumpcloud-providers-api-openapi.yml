paths:
  /providers/{provider_id}/cases:
    parameters:
    - in: path
      name: provider_id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - cases
    get:
      summary: Get all cases (Support/Feature requests) for provider
      tags:
      - Providers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasesResponse'
      parameters:
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_sort_sort'
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_filter_filter'
      operationId: providers_providerListCase
      description: This endpoint returns the cases (Support/Feature requests) for the provider
      security:
      - x-api-key: []
      x-scopes:
      - support
      - support.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/providers/{provider_id}/cases?skip=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&filter=SOME_ARRAY_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/providers/{provider_id}/cases"


          querystring = {"skip":"SOME_INTEGER_VALUE","sort":"SOME_ARRAY_VALUE","limit":"SOME_INTEGER_VALUE","filter":"SOME_ARRAY_VALUE"}


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/providers/{provider_id}/cases?skip=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&filter=SOME_ARRAY_VALUE'' -Method GET -Headers $headers'
