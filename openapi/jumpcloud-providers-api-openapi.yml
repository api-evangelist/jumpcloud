  /providers/{provider_id}/activedirectories/{ad_id}/associations:
    parameters:
    - name: provider_id
      in: path
      required: true
      description: The ID of the provider
      schema:
        type: string
    - name: ad_id
      in: path
      required: true
      description: The ID of the Active Directory integration
      schema:
        type: string
    x-functionalities-tags:
    - active-directory
    - mtp-account-overview
    get:
      description: 'This endpoint allows you to list all the associations for an Active Directory integration.


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/providers/{provider_id}/activedirectories/{ad_id}/associations \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-org-id: -'' \

        -H ''x-api-key: {API_KEY}''

        ```'
