tags:
- name: Commands
paths:
  /commands/{command_id}/associations:
    parameters:
    - description: ObjectID of the Command.
      in: path
      name: command_id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - commands
    get:
      description: 'This endpoint will return the _direct_ associations of this Command.


        A direct association can be a non-homogeneous relationship between 2 different objects, for example Commands and User Groups.


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/commands/{Command_ID}/associations?targets=system_group \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: graph_commandAssociationsList
      parameters:
      - $ref: '#/components/parameters/trait_graphTargetsCommand_targets'
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GraphConnection'
                type: array
      security:
      - x-api-key: []
      summary: List the associations of a Command
      tags:
      - Commands
      x-scopes:
      - associations.commands
      - associations.commands.readonly
      - associations
      - associations.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/commands/{command_id}/associations?targets=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/commands/{command_id}/associations\"\n\nquerystring = {\"targets\":\"SOME_ARRAY_VALUE\",\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/commands/{command_id}/associations?targets=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE'' -Method GET -Headers $headers'
    post:
      description: 'This endpoint will allow you to manage the _direct_ associations of this Command.


        A direct association can be a non-homogeneous relationship between 2 different objects, for example Commands and User Groups.


        #### Sample Request

        ```

        curl -X POST https://console.jumpcloud.com/api/v2/commands/{Command_ID}/associations \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        "op": "add",

        "type": "system_group",

        "id": "Group_ID"

        }''

        ```'
      operationId: graph_commandAssociationsPost
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphOperation-Command'
      responses:
        '204':
          description: OK
      security:
      - x-api-key: []
      summary: Manage the associations of a Command
      tags:
      - Commands
      x-scopes:
      - associations.commands
      - associations
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/commands/{command_id}/associations \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '{\"id\":\"string\",\"op\":\"add\",\"attributes\":{},\"type\":\"system\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/commands/{command_id}/associations\"\n\npayload = {\n    \"id\": \"string\",\n    \"op\": \"add\",\n    \"attributes\": {},\n    \"type\": \"system\"\n}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/commands/{command_id}/associations'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"id":"string","op":"add","attributes":{},"type":"system"}'''
  /commands/{command_id}/systemgroups:
    parameters:
    - description: ObjectID of the Command.
      in: path
      name: command_id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - systemgroups
    - commands
    get:
      description: 'This endpoint will return all System Groups bound to a Command, either directly or indirectly, essentially traversing the JumpCloud Graph for your Organization.


        Each element will contain the group''s type, id, attributes and paths.


        The `attributes` object is a key/value hash of compiled graph attributes for all paths followed.


        The `paths` array enumerates each path from this Command to the corresponding System Group; this array represents all grouping and/or associations that would have to be removed to deprovision the System Group from this Command.


        See `/members` and `/associations` endpoints to manage those collections.


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/commands/{Command_ID}/systemgroups \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: graph_commandTraverseSystemGroup
      parameters:
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_filter_filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GraphObjectWithPaths'
                type: array
      security:
      - x-api-key: []
      summary: List the System Groups bound to a Command
      tags:
      - Commands
      x-scopes:
      - groups
      - groups.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/commands/{command_id}/systemgroups?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&filter=SOME_ARRAY_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/commands/{command_id}/systemgroups\"\n\nquerystring = {\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\",\"filter\":\"SOME_ARRAY_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/commands/{command_id}/systemgroups?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&filter=SOME_ARRAY_VALUE'' -Method GET -Headers $headers'
  /commands/{command_id}/systems:
    parameters:
    - description: ObjectID of the Command.
      in: path
      name: command_id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - systems
    - commands
    get:
      description: 'This endpoint will return all Systems bound to a Command, either directly or indirectly, essentially traversing the JumpCloud Graph for your Organization.


        Each element will contain the type, id, attributes and paths.


        The `attributes` object is a key/value hash of compiled graph attributes for all paths followed.


        The `paths` array enumerates each path from this Command to the corresponding System; this array represents all grouping and/or associations that would have to be removed to deprovision the System from this Command.


        See `/members` and `/associations` endpoints to manage those collections.


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/commands/{Command_ID}/systems \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: graph_commandTraverseSystem
      parameters:
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_filter_filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GraphObjectWithPaths'
                type: array
      security:
      - x-api-key: []
      summary: List the Systems bound to a Command
      tags:
      - Commands
      x-scopes:
      - systems
      - systems.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/commands/{command_id}/systems?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&filter=SOME_ARRAY_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/commands/{command_id}/systems\"\n\nquerystring = {\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\",\"filter\":\"SOME_ARRAY_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/commands/{command_id}/systems?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&filter=SOME_ARRAY_VALUE'' -Method GET -Headers $headers'
  /queuedcommand/workflows:
    parameters: []
    x-functionalities-tags:
    - queued-commands
    get:
      description: 'This endpoint will return all queued Commands for an Organization.


        Each element will contain the workflow ID, the command name, the launch type (e.g. manual, triggered, or scheduled), the target OS, the number of assigned devices, and the number of pending devices that have not yet ran the command.


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/queuedcommand/workflows \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: commands_getQueuedCommandsByWorkflow
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      - $ref: '#/components/parameters/trait_limitMax100_limit'
      - $ref: '#/components/parameters/trait_filter_filter'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_sort_sort'
      - $ref: '#/components/parameters/trait_search_search'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedCommandList'
        '400':
          $ref: '#/components/responses/trait_standardErrors_400'
        '401':
          $ref: '#/components/responses/trait_standardErrors_401'
        '403':
          $ref: '#/components/responses/trait_standardErrors_403'
        '404':
          $ref: '#/components/responses/trait_standardErrors_404'
        '409':
          $ref: '#/components/responses/trait_standardErrors_409'
        '500':
          $ref: '#/components/responses/trait_standardErrors_500'
      security:
      - x-api-key: []
      summary: Fetch the queued Commands for an Organization
      tags:
      - Commands
      x-scopes:
      - commands
      - commands.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/queuedcommand/workflows?limit=SOME_INTEGER_VALUE&filter=SOME_ARRAY_VALUE&skip=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE&search=SOME_STRING_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/queuedcommand/workflows\"\n\nquerystring = {\"limit\":\"SOME_INTEGER_VALUE\",\"filter\":\"SOME_ARRAY_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\",\"sort\":\"SOME_ARRAY_VALUE\",\"search\":\"SOME_STRING_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/queuedcommand/workflows?limit=SOME_INTEGER_VALUE&filter=SOME_ARRAY_VALUE&skip=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE&search=SOME_STRING_VALUE'' -Method GET -Headers $headers'
  /commandqueue/{workflow_instance_id}:
    parameters:
    - name: workflow_instance_id
      in: path
      required: true
      description: Workflow instance Id of the queued commands to cancel.
      schema:
        type: string
    x-functionalities-tags:
    - queued-commands
    delete:
      description: 'This endpoint allows all queued commands for one workflow instance to be canceled.


        #### Sample Request

        ```

        curl -X DELETE https://console.jumpcloud.com/api/v2/commandqueue/{workflow_instance_id} \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: commands_cancelQueuedCommandsByWorkflowInstanceId
      responses:
        '204':
          description: OK
        '400':
          $ref: '#/components/responses/trait_standardErrors_400'
        '401':
          $ref: '#/components/responses/trait_standardErrors_401'
        '403':
          $ref: '#/components/responses/trait_standardErrors_403'
        '404':
          $ref: '#/components/responses/trait_standardErrors_404'
        '409':
          $ref: '#/components/responses/trait_standardErrors_409'
        '500':
          $ref: '#/components/responses/trait_standardErrors_500'
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      summary: Cancel all queued commands for an organization by workflow instance Id
      tags:
      - Commands
      x-scopes:
      - systems
      - systems.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request DELETE \\\n  --url https://console.jumpcloud.com/api/v2/commandqueue/{workflow_instance_id} \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/commandqueue/{workflow_instance_id}\"\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"DELETE\", url, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/commandqueue/{workflow_instance_id}'' -Method DELETE -Headers $headers'
components:
  schemas:
    Error:
      title: Error
      type: object
      x-examples: {}
      description: ''
      properties:
        code:
          format: int32
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Error message
        status:
          type: string
          description: HTTP status description
    GraphConnection:
      description: Represents an edge between two graph objects. From can be omitted if it is clear from context.
      properties:
        attributes:
          $ref: '#/components/schemas/GraphAttributes'
        from:
          $ref: '#/components/schemas/GraphObject'
        to:
          $ref: '#/components/schemas/GraphObject'
      required:
      - to
      title: GraphConnection
      type: object
    GraphAttributes:
      additionalProperties: true
      description: The graph attributes.
      title: GraphAttributes
      type:
      - object
      - 'null'
    GraphType:
      description: A graph object type.
      enum:
      - active_directory
      - agent
      - agent_group
      - application
      - command
      - g_suite
      - idp_routing_policy
      - ldap_server
      - office_365
      - policy
      - policy_group
      - radius_server
      - password_manager_item
      - system
      - system_group
      - user
      - user_group
      title: GraphType
      type: string
    ErrorDetails:
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          details:
            description: 'Describes a list of objects with more detailed information of the given error. Each detail schema is according to one of the messages defined in Google''s API: https://github.com/googleapis/googleapis/blob/master/google/rpc/error_details.proto'
            type: array
            items:
              type: object
              additionalProperties: true
              description: Object according to Google's API.
    GraphObject:
      properties:
        attributes:
          $ref: '#/components/schemas/GraphAttributes'
        id:
          description: The ObjectID of the graph object.
          type: string
        type:
          description: The type of graph object.
          type: string
      required:
      - type
      - id
      title: GraphObject
      type: object
    SyncStatus:
      description: Sync status information for this object. Only present when syncStatus query parameter is true.
      type: object
      properties:
        syncedAt:
          description: The last time the object was synced.
          type: string
          format: date-time
        code:
          description: Status code of the sync operation.
          type: integer
        message:
          description: Status message of the sync operation.
          type: string
        details:
          description: Additional details about the sync status.
          type: array
          items:
            type: object
    QueuedCommandList:
      title: QueuedCommandList
      type: object
      description: List of queued commands
      properties:
        totalCount:
          type: integer
          description: The total number of queued command results.
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: The workflowInstanceId.
              command:
                type: string
                description: The ID of the command, from savedAgentCommands.
              system:
                type: string
                description: The ID of the device the command is bound to.
              pendingCount:
                type: integer
                description: The number of devices that still haven't received the directive.
    GraphOperation:
      properties:
        id:
          description: The ObjectID of graph object being added or removed as an association.
          type: string
        op:
          description: How to modify the graph connection.
          enum:
          - add
          - remove
          - update
          type: string
      required:
      - id
      - op
      title: GraphOperation
      type: object
    GraphObjectWithPaths:
      properties:
        compiledAttributes:
          $ref: '#/components/schemas/GraphAttributes'
        id:
          description: Object ID of this graph object.
          type: string
        paths:
          description: Every path through the graph from the requested object to this object. Each path lists the groupings and associations it follows; all of them would have to be removed to remove this object from the requested object.
          items:
            items:
              $ref: '#/components/schemas/GraphConnection'
            type: array
          type: array
        type:
          $ref: '#/components/schemas/GraphType'
        externalId:
          description: The external resource ID that is being synced. Only present when syncStatus query parameter is true.
          type: string
        syncStatus:
          $ref: '#/components/schemas/SyncStatus'
      required:
      - type
      - id
      - paths
      title: GraphObjectWithPaths
      type: object
    GraphOperation-Command:
      allOf:
      - $ref: '#/components/schemas/GraphOperation'
      - properties:
          attributes:
            $ref: '#/components/schemas/GraphAttributes'
          type:
