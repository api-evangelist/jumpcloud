paths:
  /identityrisk/access-geolocations:
    get:
      summary: Get identity risk geo distribution
      description: 'This endpoint gets the geographic distribution for identity risk detections in an organization.


        **Example request:**

        ```

        GET /api/v2/identityrisk/access-geolocations?start_time=2024-01-01T00:00:00Z&end_time=2024-01-31T23:59:59Z

        ```'
      operationId: RiskStatsService_GetRiskyAccessGeolocation
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.identity_risk.GetRiskyAccessGeolocationResponse'
      parameters:
      - name: startTime
        in: query
        required: false
        schema:
          type: string
      - name: endTime
        in: query
        required: false
        schema:
          type: string
      tags:
      - Identity Risk
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - identityrisk
      - identityrisk.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/identityrisk/access-geolocations?startTime=SOME_STRING_VALUE&endTime=SOME_STRING_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/identityrisk/access-geolocations"


          querystring = {"startTime":"SOME_STRING_VALUE","endTime":"SOME_STRING_VALUE"}


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/identityrisk/access-geolocations?startTime=SOME_STRING_VALUE&endTime=SOME_STRING_VALUE'' -Method GET -Headers $headers'
  /identityrisk/events:
    get:
      summary: List identity risk events
      description: 'This endpoint lists all identity risk events for an organization.


        **Example request:**

        ```

        GET /api/v2/identityrisk/events?filter=level:eq:RISK_LEVEL_MEDIUM&limit=10&skip=0&sort=-lastOccurrenceAt

        ```


        **Example request with multiple filters:**

        ```

        GET /api/v2/identityrisk/events?filter=level:eq:RISK_LEVEL_MEDIUM&filter=resolutionStatus:eq:RISK_RESOLUTION_STATUS_OPEN&limit=25&skip=0

        ```'
      operationId: RiskEventsService_ListRiskEvents
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.identity_risk.ListRiskEventsResponse'
      parameters:
      - name: filter
        description: "A filter to apply to the query.\n\n  **Filter structure**: `<field>:<operator>:<value>`.\n\n  **field** = A supported collection field name (camelCase): identityObjectId, identityType, identityIdentifier, score, occurrenceCount, level, resolutionStatus, resolutionState, firstOccurrenceAt, lastOccurrenceAt, loginResource, loginStatus, countryCode, city, riskFactorCode.\n\n  **operator** =  Supported operators are: eq, ne, gt, ge, lt, le, search, in.\n\n  **value** = Populate with the value you want to search for. Is case sensitive. Supports wild cards.\n\n  **Example** `GET /api/v2/identityrisk/events?filter=level:eq:RISK_LEVEL_MEDIUM`\n  **Example for users** `GET /api/v2/identityrisk/events?filter=identityIdentifier:in:user1,user2`\n  **Example for score** `GET /api/v2/identityrisk/events?filter=score:gt:50`\n"
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
        allowReserved: true
      - name: fields
        description: The fields on the items listed to return.
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: skip
        description: The offset into the records to return.
        in: query
        required: false
        schema:
          type: string
          format: int64
          default: '0'
      - name: sort
        description: 'An optional comma separated field names used to sort the collection.

          Default sort is ascending, prefix with `-` to sort descending.'
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
        allowReserved: true
      - name: limit
        description: 'The number of records to return at once.

          If the number returned is less than `limit` there are no more records to fetch.

          If the number returned equals `limit` there may be more records. Increment `skip` by `limit` to get the next set.'
        in: query
        required: false
        schema:
          type: string
          format: int64
          default: '100'
      - name: searchTerm
        description: "A free-text search term matched against all string filter fields (case-insensitive substring) and object-id fields objectId and identityObjectId (exact hex match). A match on any field is sufficient (logical OR), and searchTerm is combined with `filter` using logical AND.\n\n  **Example** `GET /api/v2/identityrisk/events?searchTerm=john.doe`\n  **Combined with filters** `GET /api/v2/identityrisk/events?searchTerm=john&filter=resolutionStatus:eq:RISK_RESOLUTION_STATUS_OPEN`"
        in: query
        required: false
        schema:
          type: string
      tags:
      - Identity Risk
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - identityrisk
      - identityrisk.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/identityrisk/events?filter=SOME_ARRAY_VALUE&fields=SOME_ARRAY_VALUE&skip=SOME_STRING_VALUE&sort=SOME_ARRAY_VALUE&limit=SOME_STRING_VALUE&searchTerm=SOME_STRING_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
