          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/identityrisk/login-types?startTime=SOME_STRING_VALUE&endTime=SOME_STRING_VALUE'' -Method GET -Headers $headers'
  /identityrisk/stats:
    get:
      summary: Get identity risk Stats
      description: 'This endpoint gets the identity risk Stats (dashboard metrics) for an organization.


        **Example request:**

        ```

        GET /api/v2/identityrisk/stats?start_time=2024-01-01T00:00:00Z&end_time=2024-01-31T23:59:59Z

        ```'
      operationId: RiskStatsService_GetStats
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.identity_risk.IdentityRiskStats'
      parameters:
      - name: startTime
        in: query
        required: false
        schema:
          type: string
      - name: endTime
        in: query
        required: false
        schema:
          type: string
      tags:
      - Identity Risk
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - identityrisk
      - identityrisk.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/identityrisk/stats?startTime=SOME_STRING_VALUE&endTime=SOME_STRING_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/identityrisk/stats"


          querystring = {"startTime":"SOME_STRING_VALUE","endTime":"SOME_STRING_VALUE"}


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/identityrisk/stats?startTime=SOME_STRING_VALUE&endTime=SOME_STRING_VALUE'' -Method GET -Headers $headers'
components:
  schemas:
    jumpcloud.identity_risk.IdentityRiskStats:
      type: object
      properties:
        adminResolved:
          $ref: '#/components/schemas/jumpcloud.identity_risk.RiskStatCount'
        autoResolvedByMfa:
          $ref: '#/components/schemas/jumpcloud.identity_risk.RiskStatCount'
        criticalRisk:
          $ref: '#/components/schemas/jumpcloud.identity_risk.RiskStatCount'
        mfaFailed:
          type: integer
          format: int32
        normalIdentities:
          type: integer
          format: int32
        openDetections:
          $ref: '#/components/schemas/jumpcloud.identity_risk.RiskStatCount'
        overallDetections:
          $ref: '#/components/schemas/jumpcloud.identity_risk.RiskStatCount'
        privilegedIdentities:
          type: integer
          format: int32
        totalResolved:
          $ref: '#/components/schemas/jumpcloud.identity_risk.RiskStatCount'
    jumpcloud.identity_risk.RiskResolutionState:
      type: string
      enum:
      - RISK_RESOLUTION_STATE_UNSPECIFIED
      - RISK_RESOLUTION_STATE_SAFE
      - RISK_RESOLUTION_STATE_UNSAFE
      default: RISK_RESOLUTION_STATE_UNSPECIFIED
    jumpcloud.identity_risk.GetTimelineRequest:
      type: object
      properties:
        endTime:
          type: string
        intervalType:
          type: string
        intervalValue:
          type: string
        riskFactorTypes:
          type: array
          items:
            type: string
        startTime:
          type: string
    jumpcloud.identity_risk.GetRiskyAccessGeolocationResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.identity_risk.GeoItem'
    jumpcloud.identity_risk.Trend:
      type: object
      properties:
        comparisonPeriod:
          type: string
        currentDetectionCount:
          type: integer
          format: int32
        previousDetectionCount:
          type: integer
          format: int32
    jumpcloud.identity_risk.RiskLevel:
      type: string
      enum:
      - RISK_LEVEL_NONE
      - RISK_LEVEL_LOW
      - RISK_LEVEL_MEDIUM
      - RISK_LEVEL_HIGH
      - RISK_LEVEL_CRITICAL
      default: RISK_LEVEL_NONE
    jumpcloud.identity_risk.RiskFactorSeverity:
      type: string
      enum:
      - RISK_FACTOR_SEVERITY_UNSPECIFIED
      - RISK_FACTOR_SEVERITY_LOW
      - RISK_FACTOR_SEVERITY_MEDIUM
      - RISK_FACTOR_SEVERITY_HIGH
      - RISK_FACTOR_SEVERITY_CRITICAL
      default: RISK_FACTOR_SEVERITY_UNSPECIFIED
    jumpcloud.identity_risk.LoginTypeItem:
      type: object
      properties:
        count:
          type: integer
          format: int32
        loginResource:
          $ref: '#/components/schemas/jumpcloud.identity_risk.TargetResourceType'
    jumpcloud.identity_risk.RiskTimelineResponse:
      type: object
      properties:
        timelineData:
          type: object
      description: 'since we are using google.protobuf.Struct for timeline_data.

        This allows arbitrary JSON structures (like dynamic maps).'
    jumpcloud.identity_risk.Profile:
      type: object
      properties:
        applications:
          type: array
          items:
            type: string
        avgLoginSessionCountPerDay:
          type: integer
          format: int32
        deviceIds:
          type: array
          items:
            type: string
        devices:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.identity_risk.Device'
        objectId:
          type: string
          format: byte
        profileData:
          type: object
          description: 'profile_data is the full stored identity profile document (JSON-compatible).

            Populated when a specific identity profile is retrieved via GetProfile.'
        typicalBrowsers:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.identity_risk.Browser'
        typicalLoginDays:
          type: array
          items:
            type: string
        typicalLoginHours:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.identity_risk.TypicalLoginHour'
        typicalLoginHoursEnd:
          type: string
        typicalLoginHoursStart:
          type: string
        typicalLoginLocations:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.identity_risk.LoginLocation'
        typicalNetworks:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.identity_risk.Network'
    jumpcloud.identity_risk.Device:
      type: object
      properties:
        isPrimary:
          type: boolean
        name:
          type: string
        operatingSystem:
          type: string
        osVersion:
          type: string
    jumpcloud.identity_risk.TypicalLoginHour:
      type: object
      properties:
        count:
          type: integer
          format: int32
        hour:
          type: string
    jumpcloud.identity_risk.RiskResolutionStatus:
      type: string
      enum:
      - RISK_RESOLUTION_STATUS_UNSPECIFIED
      - RISK_RESOLUTION_STATUS_OPEN
      - RISK_RESOLUTION_STATUS_RESOLVED
      - RISK_RESOLUTION_STATUS_MFA_RESOLVED
      - RISK_RESOLUTION_STATUS_DISMISSED
      default: RISK_RESOLUTION_STATUS_UNSPECIFIED
    jumpcloud.identity_risk.ListRiskEventsResponse:
      type: object
      properties:
        riskEvents:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.identity_risk.RiskEvent'
        totalCount:
          type: integer
          format: int64
          description: total_count is the total number of risk events matching the query (before pagination).
    jumpcloud.identity_risk.IdentityType:
      type: string
      enum:
      - IDENTITY_TYPE_UNSPECIFIED
      - IDENTITY_TYPE_ADMIN
      - IDENTITY_TYPE_USER
      default: IDENTITY_TYPE_UNSPECIFIED
    jumpcloud.identity_risk.GeoItem:
      type: object
      properties:
        city:
          type: string
        count:
          type: integer
          format: int32
        countryCode:
          type: string
        countryName:
          type: string
    jumpcloud.identity_risk.LoginTypeDistribution:
      type: object
      properties:
        loginTypes:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.identity_risk.LoginTypeItem'
    jumpcloud.identity_risk.RiskFactorType:
      type: string
      enum:
      - RISK_FACTOR_TYPE_UNSPECIFIED
      - RISK_FACTOR_TYPE_NEW_DEVICE_LOGIN
      - RISK_FACTOR_TYPE_UNUSUAL_GEOLOCATION
      - RISK_FACTOR_TYPE_UNUSUAL_LOGIN_TIME
      - RISK_FACTOR_TYPE_UNUSUAL_USER_AGENT
      - RISK_FACTOR_TYPE_IMPOSSIBLE_TRAVEL
      - RISK_FACTOR_TYPE_DORMANT_ACCOUNT_LOGIN
      - RISK_FACTOR_TYPE_NEW_ASN
      - RISK_FACTOR_TYPE_EXCESSIVE_FAILED_LOGIN_ATTEMPTS
      - RISK_FACTOR_TYPE_HIGH_VOLUME_LOGIN_ATTEMPTS
      - RISK_FACTOR_TYPE_UNUSUAL_APPLICATION_LOGIN
      - RISK_FACTOR_TYPE_UNUSUAL_BROWSER_ID
      - RISK_FACTOR_TYPE_BROWSER_ENVIRONMENT_MISMATCH
      default: RISK_FACTOR_TYPE_UNSPECIFIED
      description: RiskFactorType identifies the kind of risk factor contributing to the score.
    jumpcloud.identity_risk.GetRiskyIdentitiesResponse:
      type: object
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.identity_risk.IdentityItem'
        totalIdentitiesWithRisk:
          type: integer
          format: int32
          description: total_identities_with_risk is the total number of identities with at least one open risk event.
        trendsCount:
          type: integer
          format: int32
    jumpcloud.identity_risk.RiskStatCount:
      type: object
      properties:
        currentCount:
          type: integer
          format: int32
        previousCount:
          type: integer
          format: int32
      description: RiskStatCount holds the current and previous count values for a risk statistic.
    jumpcloud.identity_risk.Network:
      type: object
      properties:
        isPrimary:
          type: boolean
        network:
          type: string
        networkType:
          type: string
    jumpcloud.identity_risk.IdentityItem:
      type: object
      properties:
        count:
          type: integer
          format: int32
        displayName:
          type: string
        identifier:
          type: string
        identityObjectId:
          type: string
          format: byte
    jumpcloud.identity_risk.RiskFactor:
      type: object
      properties:
        description:
          type: string
        metadata:
          type: object
        severity:
          $ref: '#/components/schemas/jumpcloud.identity_risk.RiskFactorSeverity'
        type:
          $ref: '#/components/schemas/jumpcloud.identity_risk.RiskFactorType'
        weight:
          type: integer
          format: int64
      description: 'RiskFactor represents one contributing risk factor (e.g. NEW_DEVICE_LOGIN, UNUSUAL_GEOLOCATION).

        Metadata is generic for now; can be evolved to typed oneof per factor type later.'
    jumpcloud.identity_risk.RiskEvent:
      type: object
      properties:
        applicationDisplayName:
          type: string
        applicationName:
          type: string
        city:
          type: string
        clientIp:
          type: string
          description: client_ip is the client IP from the Directory Insights login event for the latest occurrence.
        countryCode:
          type: string
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        description:
          type: string
          description: 'description is a human readable description of the risk event.

            not populated when a list of risk events is retrieved.'
        diEvent:
          type: object
          description: 'di_event is the full Directory Insights event for the latest occurrence (JSON-compatible).

            Populated when a specific risk event is retrieved via GetRiskEvent.'
        firstOccurrenceAt:
          type:
          - string
          - 'null'
          format: date-time
        identityDisplayName:
          type: string
        identityIdentifier:
          type: string
        identityObjectId:
          type: string
          format: byte
        identityType:
          $ref: '#/components/schemas/jumpcloud.identity_risk.IdentityType'
        lastOccurrenceAt:
          type:
          - string
          - 'null'
          format: date-time
        level:
          $ref: '#/components/schemas/jumpcloud.identity_risk.RiskLevel'
        location:
          type: string
          description: location is "city, country code" format.
        loginResource:
          $ref: '#/components/schemas/jumpcloud.identity_risk.TargetResourceType'
        loginStatus:
          type: boolean
        mfaMethod:
          type: string
          description: 'mfa_method is the MFA method enum name (mfa_method_type), derived from auth_context.auth_methods keys.

            Supported values: MFA_METHOD_JUMPCLOUD_GO, MFA_METHOD_JUMPCLOUD_GO_UV, MFA_METHOD_WEBAUTHN,

            MFA_METHOD_PUSH, MFA_METHOD_JC_PROTECT_PUSH, MFA_METHOD_DUO, MFA_METHOD_TOTP, MFA_METHOD_SMS.

            Returns MFA_METHOD_UNSPECIFIED when no matching key is found.'
        mfaStatus:
          type: boolean
        objectId:
          type: string
          format: byte
        occurrenceCount:
          type: integer
          format: int32
        regionName:
          type: string
        resolutionNotes:
          type: string
        resolutionState:
          $ref: '#/components/schemas/jumpcloud.identity_risk.RiskResolutionState'
        resolutionStatus:
          $ref: '#/components/schemas/jumpcloud.identity_risk.RiskResolutionStatus'
        resolvedAt:
          type:
          - string
          - 'null'
          format: date-time
        resolvedBy:
          type:
          - string
          - 'null'
          format: byte
        resolvedByEmail:
          type: string
        riskFactorTypes:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.identity_risk.RiskFactorType'
          description: 'risk_factor_types is a list of risk factor types that contributed to this risk event.

            populated when a list of risk events is retrieved. Risk factor types are the codes of the risk factors.'
        riskFactors:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.identity_risk.RiskFactor'
          description: 'risk_factors is a list of risk factors that contributed to this risk event.

            populated when a specific risk event is retrieved.'
        riskPolicyId:
          type:
          - string
          - 'null'
          format: byte
          description: risk_policy_id is the applied identity risk policy object_id at scoring time.
        riskPolicyName:
          type: string
          description: risk_policy_name is the display name of the policy referenced by risk_policy_id (when present).
        score:
          type: integer
          format: int32
        sourceEventObjectId:
          type: string
          format: byte
          description: Source DI context for the last occurrence of this risk event (flattened).
        sourceEventTimestamp:
          type:
          - string
          - 'null'
          format: date-time
        sourceEventType:
          type: string
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
    jumpcloud.identity_risk.TargetResourceType:
      type: string
      enum:
      - TARGET_RESOURCE_TYPE_UNSPECIFIED
      - TARGET_RESOURCE_TYPE_USER_PORTAL
      - TARGET_RESOURCE_TYPE_ADMIN_PORTAL
      - TARGET_RESOURCE_TYPE_APPLICATION
      - TARGET_RESOURCE_TYPE_DEVICE
      default: TARGET_RESOURCE_TYPE_UNSPECIFIED
      description: TargetResourceType is the type of resource targeted by the event (e.g. Device for login_attempt).
    jumpcloud.identity_risk.LoginLocation:
      type: object
      properties:
        city:
          type: string
        countryName:
          type: string
        isPrimary:
          type: boolean
        percentage:
          type: string
    jumpcloud.identity_risk.Browser:
      type: object
      properties:
        isPrimary:
          type: boolean
        name:
          type: string
  securitySchemes:
    x-api-key:
      description: API key used to authenticate requests.
      in: header
      name: x-api-key
      type: apiKey
