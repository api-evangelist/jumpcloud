        source: "curl --request GET \\\n  --url https://console.jumpcloud.com/api/v2/identityrisk/events/{objectId} \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/identityrisk/events/{objectId}"


