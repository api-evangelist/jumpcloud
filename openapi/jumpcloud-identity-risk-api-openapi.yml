  /identityrisk/events/{objectId}/resolve:
    patch:
      summary: Resolve an identity risk event
      description: 'This endpoint allows you to resolve an identity risk event using its id.


        **Example request:**

        ```

        PATCH /api/v2/identityrisk/events/{object_id}/resolve

        Content-Type: application/json


        {

        "resolution_status": "RISK_RESOLUTION_STATUS_RESOLVED",

        "resolution_state": "RISK_RESOLUTION_STATE_SAFE",

        "resolution_notes": "Verified with the user — login was legitimate."

        }

        ```'
      operationId: RiskEventsService_ResolveRiskEvent
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.identity_risk.RiskEvent'
      parameters:
      - name: objectId
        description: object_id is the bson Object id of the risk event.
        in: path
        required: true
        schema:
          type: string
          format: byte
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resolutionNotes:
                  type: string
                resolutionState:
                  $ref: '#/components/schemas/jumpcloud.identity_risk.RiskResolutionState'
                resolutionStatus:
                  $ref: '#/components/schemas/jumpcloud.identity_risk.RiskResolutionStatus'
        required: true
      tags:
      - Identity Risk
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - identityrisk
      x-codeSamples:
      - lang: Shell
        source: "curl --request PATCH \\\n  --url https://console.jumpcloud.com/api/v2/identityrisk/events/{objectId}/resolve \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"resolutionNotes\":\"string\",\"resolutionState\":\"RISK_RESOLUTION_STATE_UNSPECIFIED\",\"resolutionStatus\":\"RISK_RESOLUTION_STATUS_UNSPECIFIED\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/identityrisk/events/{objectId}/resolve\"\n\npayload = {\n    \"resolutionNotes\": \"string\",\n    \"resolutionState\": \"RISK_RESOLUTION_STATE_UNSPECIFIED\",\n    \"resolutionStatus\": \"RISK_RESOLUTION_STATUS_UNSPECIFIED\"\n}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"PATCH\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/identityrisk/events/{objectId}/resolve'' -Method PATCH -Headers $headers -ContentType ''application/json'' -Body ''{"resolutionNotes":"string","resolutionState":"RISK_RESOLUTION_STATE_UNSPECIFIED","resolutionStatus":"RISK_RESOLUTION_STATUS_UNSPECIFIED"}'''
  /identityrisk/factors-timeline:
    post:
      summary: Query identity risk detections timeline
      description: 'This endpoint gets the identity risk detections timeline (counts over time) for an organization.


        **Example request:**

        ```

        POST /api/v2/identityrisk/factors-timeline

        {

        "interval": "day",

        "start_time": "2024-01-01T00:00:00Z",

        "end_time": "2024-01-31T23:59:59Z"

        }

        ```


        **Example request filtered by risk factor:**

        ```

        POST /api/v2/identityrisk/factors-timeline

        {

        "interval": "day",

        "start_time": "2024-01-01T00:00:00Z",

        "end_time": "2024-01-31T23:59:59Z",

        "risk_factor_types": ["IMPOSSIBLE_TRAVEL"]

        }

        ```'
      operationId: RiskStatsService_GetTimeline
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.identity_risk.RiskTimelineResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jumpcloud.identity_risk.GetTimelineRequest'
        required: true
      tags:
      - Identity Risk
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
