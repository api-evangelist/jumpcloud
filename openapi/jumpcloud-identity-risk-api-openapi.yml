      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/identityrisk/factors-timeline\"\n\npayload = {\n    \"endTime\": \"string\",\n    \"intervalType\": \"string\",\n    \"intervalValue\": \"string\",\n    \"riskFactorTypes\": [\"string\"],\n    \"startTime\": \"string\"\n}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
