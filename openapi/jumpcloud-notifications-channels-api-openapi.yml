paths:
  /notifications/channels:
    get:
      summary: This endpoint is used for listing the notification channels
      description: This endpoint allows you to list notification channels.
      operationId: NotificationsChannelsService_ListChannels
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.notifications.ListChannelsResponse'
      parameters:
      - name: filter
        description: "A filter to apply to the query.\n\n  **Filter structure**: `<field>:<operator>:<value>`.\n\n  **field** = Populate with a valid field from an endpoint response.\n\n  **operator** =  Supported operators are: eq, ne, gt, ge, lt, le, between, search, in.\n\n  **value** = Populate with the value you want to search for. Is case sensitive. Supports wild cards.\n\n  **Example** `GET /api/v2/groups?filter=name:eq:Test+Group`\n"
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
        allowReserved: true
      - name: fields
        description: The fields on the items listed to return.
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: skip
        description: The offset into the records to return.
        in: query
        required: false
        schema:
          type: string
          format: int64
          default: '0'
      - name: sort
        description: 'An optional comma separated field names used to sort the collection.

          Default sort is ascending, prefix with `-` to sort descending.'
        in: query
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
        allowReserved: true
      - name: limit
        description: 'The number of channels to return at once.

          If the number of channels returned is less than `limit` there are no more channels to fetch.

          If the number of channels returned is equal to limit there may be more channels to fetch. Increment `skip` by `limit` to get the next set of channels.'
        in: query
        required: false
        schema:
          type: string
          format: int64
          default: '100'
      tags:
      - Notifications Channels
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - notifications.channels
      - notifications.channels.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/notifications/channels?filter=SOME_ARRAY_VALUE&fields=SOME_ARRAY_VALUE&skip=SOME_STRING_VALUE&sort=SOME_ARRAY_VALUE&limit=SOME_STRING_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/notifications/channels"


          querystring = {"filter":"SOME_ARRAY_VALUE","fields":"SOME_ARRAY_VALUE","skip":"SOME_STRING_VALUE","sort":"SOME_ARRAY_VALUE","limit":"SOME_STRING_VALUE"}


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/notifications/channels?filter=SOME_ARRAY_VALUE&fields=SOME_ARRAY_VALUE&skip=SOME_STRING_VALUE&sort=SOME_ARRAY_VALUE&limit=SOME_STRING_VALUE'' -Method GET -Headers $headers'
    post:
      summary: This endpoint is used for creating the channels
      description: This endpoint allows you to create a notification channel.
