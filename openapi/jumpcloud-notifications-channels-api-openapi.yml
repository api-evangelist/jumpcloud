      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jumpcloud.notifications.CreateChannelRequest'
        description: CreateChannelRequest represents the request to create a channel.
        required: true
      tags:
      - Notifications Channels
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - notifications.channels
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/notifications/channels \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"channel\":{\"config\":{\"email\":{\"role\":[{\"objectId\":\"string\",\"roleObjectId\":\"string\"}],\"user\":[{\"address\":\"string\",\"name\":\"string\",\"objectId\":\"string\"}]},\"slack\":{\"slackChannel\":[{\"objectId\":\"string\",\"slackChannelId\":\"string\",\"slackTeamId\":\"string\",\"slackWorkspaceName\":\"string\"}]},\"webhook\":{\"authPassword\":\"string\",\"authToken\":\"string\",\"authType\":\"WEBHOOK_AUTH_TYPE_UNSPECIFIED\",\"authUsername\":\"string\",\"customHeaders\":[{\"key\":\"string\",\"masked\":true,\"objectId\":\"string\",\"value\":\"string\"}],\"maskedUrlPortion\":[{\"key\":\"string\",\"objectId\":\"string\",\"value\":\"string\"}],\"objectId\":\"string\",\"sslVerification\":true,\"url\":\"string\",\"urlMasked\":true}},\"description\":\"string\",\"enabled\":true,\"name\":\"string\",\"type\":\"CHANNEL_TYPE_UNSPECIFIED\"}}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/notifications/channels\"\n\npayload = {\"channel\": {\n        \"config\": {\n            \"email\": {\n                \"role\": [\n                    {\n                        \"objectId\": \"string\",\n                        \"roleObjectId\": \"string\"\n                    }\n                ],\n                \"user\": [\n                    {\n                        \"address\": \"string\",\n                        \"name\": \"string\",\n                        \"objectId\": \"string\"\n                    }\n                ]\n            },\n            \"slack\": {\"slackChannel\": [\n                    {\n                        \"objectId\": \"string\",\n                        \"slackChannelId\": \"string\",\n                        \"slackTeamId\": \"string\",\n                        \"slackWorkspaceName\": \"string\"\n                    }\n                ]},\n            \"webhook\": {\n                \"authPassword\": \"string\",\n                \"authToken\": \"string\",\n                \"authType\": \"WEBHOOK_AUTH_TYPE_UNSPECIFIED\",\n                \"authUsername\": \"string\",\n                \"customHeaders\": [\n                    {\n                        \"key\": \"string\",\n                        \"masked\": True,\n                        \"objectId\": \"string\",\n                        \"value\": \"string\"\n                    }\n                ],\n                \"maskedUrlPortion\": [\n                    {\n                        \"key\": \"string\",\n                        \"objectId\": \"string\",\n                        \"value\": \"string\"\n                    }\n                ],\n                \"objectId\": \"string\",\n                \"sslVerification\": True,\n                \"url\": \"string\",\n                \"urlMasked\": True\n            }\n        },\n        \"description\": \"string\",\n        \"enabled\": True,\n        \"name\": \"string\",\n        \"type\": \"CHANNEL_TYPE_UNSPECIFIED\"\n    }}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/notifications/channels'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"channel":{"config":{"email":{"role":[{"objectId":"string","roleObjectId":"string"}],"user":[{"address":"string","name":"string","objectId":"string"}]},"slack":{"slackChannel":[{"objectId":"string","slackChannelId":"string","slackTeamId":"string","slackWorkspaceName":"string"}]},"webhook":{"authPassword":"string","authToken":"string","authType":"WEBHOOK_AUTH_TYPE_UNSPECIFIED","authUsername":"string","customHeaders":[{"key":"string","masked":true,"objectId":"string","value":"string"}],"maskedUrlPortion":[{"key":"string","objectId":"string","value":"string"}],"objectId":"string","sslVerification":true,"url":"string","urlMasked":true}},"description":"string","enabled":true,"name":"string","type":"CHANNEL_TYPE_UNSPECIFIED"}}'''
