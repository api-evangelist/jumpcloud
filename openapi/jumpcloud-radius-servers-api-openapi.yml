components:
  parameters:
    trait_multiTenantRequestHeaders_x-org-id:
      description: Organization identifier that can be obtained from console settings.
      in: header
      name: x-org-id
      schema:
        type: string
    trait_graphTargetsRadiusServer_targets:
      name: targets
      description: Targets which a "radius_server" can be associated to.
      in: query
      required: true
      style: form
      explode: false
      schema:
        type: array
        items:
          enum:
          - user
          - user_group
          - system_group
          type: string
    trait_filter_filter:
      description: 'A filter to apply to the query.


        **Filter structure**: `<field>:<operator>:<value>`.


        **field** = Populate with a valid field from an endpoint response.


        **operator** =  Supported operators are: eq, ne, gt, ge, lt, le, between, search, in.

        _Note: v1 operators differ from v2 operators._


        **value** = Populate with the value you want to search for. Is case sensitive. Supports wild cards.


        **EX:** `GET /api/v2/groups?filter=name:eq:Test+Group`'
      in: query
      name: filter
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        default: []
    trait_skip_skip:
      description: The offset into the records to return.
      in: query
      name: skip
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    trait_limit_limit:
      description: The number of records to return at once. Limited to 100.
      in: query
      name: limit
      schema:
        type: integer
        default: 10
  schemas:
    GraphObject:
      properties:
        attributes:
          $ref: '#/components/schemas/GraphAttributes'
        id:
          description: The ObjectID of the graph object.
          type: string
        type:
          description: The type of graph object.
          type: string
      required:
      - type
      - id
      title: GraphObject
      type: object
    GraphAttributes:
      additionalProperties: true
      description: The graph attributes.
      title: GraphAttributes
      type:
      - object
      - 'null'
    GraphOperation:
      properties:
        id:
          description: The ObjectID of graph object being added or removed as an association.
          type: string
        op:
          description: How to modify the graph connection.
          enum:
          - add
          - remove
          - update
          type: string
      required:
      - id
      - op
      title: GraphOperation
      type: object
    GraphObjectWithPaths:
      properties:
        compiledAttributes:
          $ref: '#/components/schemas/GraphAttributes'
        id:
          description: Object ID of this graph object.
          type: string
        paths:
          description: Every path through the graph from the requested object to this object. Each path lists the groupings and associations it follows; all of them would have to be removed to remove this object from the requested object.
          items:
            items:
              $ref: '#/components/schemas/GraphConnection'
            type: array
          type: array
        type:
          $ref: '#/components/schemas/GraphType'
        externalId:
          description: The external resource ID that is being synced. Only present when syncStatus query parameter is true.
          type: string
        syncStatus:
          $ref: '#/components/schemas/SyncStatus'
      required:
      - type
      - id
      - paths
      title: GraphObjectWithPaths
      type: object
    GraphOperation-RadiusServer:
      allOf:
      - $ref: '#/components/schemas/GraphOperation'
      - properties:
          attributes:
            $ref: '#/components/schemas/GraphAttributes'
          type:
            description: Targets which a "radius_server" can be associated to.
            enum:
            - user
            - user_group
            - system_group
            type: string
        required:
        - type
      title: GraphOperation (RadiusServer)
      type: object
    GraphConnection:
      description: Represents an edge between two graph objects. From can be omitted if it is clear from context.
      properties:
        attributes:
          $ref: '#/components/schemas/GraphAttributes'
        from:
          $ref: '#/components/schemas/GraphObject'
        to:
          $ref: '#/components/schemas/GraphObject'
      required:
      - to
      title: GraphConnection
      type: object
    SyncStatus:
      description: Sync status information for this object. Only present when syncStatus query parameter is true.
      type: object
      properties:
        syncedAt:
          description: The last time the object was synced.
          type: string
          format: date-time
        code:
          description: Status code of the sync operation.
          type: integer
        message:
          description: Status message of the sync operation.
          type: string
        details:
          description: Additional details about the sync status.
          type: array
          items:
            type: object
    GraphType:
      description: A graph object type.
      enum:
      - active_directory
      - agent
      - agent_group
      - application
      - command
      - g_suite
      - idp_routing_policy
      - ldap_server
      - office_365
      - policy
      - policy_group
      - radius_server
      - password_manager_item
      - system
      - system_group
      - user
      - user_group
      title: GraphType
      type: string
  securitySchemes:
    x-api-key:
      description: API key used to authenticate requests.
      in: header
      name: x-api-key
      type: apiKey
