tags:
- name: Assets
  description: Operations related to Assets
paths:
  /assets/field-configurations:
    get:
      tags:
      - Assets
      summary: List field configurations
      description: Retrieve a list of field configurations available for assets. Field configurations define all fields and their properties for organizing asset data.
      operationId: listFieldConfigurations
      x-scopes:
      - assets
      - assets.readonly
      security:
      - x-api-key: []
      responses:
        '200':
          description: Field configurations retrieved successfully
          x-examples:
            application/json:
              sampleList:
                summary: Mix of default and custom fields across scopes
                value:
                  results:
                  - id: 507f1f77bcf86cd799439011
                    label: Status
                    default: true
                    mandatory: true
                    scope: Device
                  - id: 605a1f77bcf86cd7994390aa
                    label: Owner
                    default: true
                    mandatory: false
                    scope: Common
                  - id: 6924631f16a853000117a601
                    label: Tag
                    default: false
                    mandatory: false
                    scope: Accessory
                  totalCount: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.ListFieldConfigsResponse'
        '400':
          description: Bad request - invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
        default:
          description: Generic error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url https://console.jumpcloud.com/api/v2/assets/field-configurations \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/assets/field-configurations"


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/assets/field-configurations'' -Method GET -Headers $headers'
  /assets/field-configurations/{id}/select-options:
    get:
      tags:
      - Assets
      summary: List select options for a field configuration
      description: Get all select options available for a specific field configuration by ID
      operationId: getFieldConfigSelectOptions
      x-scopes:
      - assets
      - assets.readonly
      security:
      - x-api-key: []
      parameters:
      - name: id
        in: path
        required: true
        description: The field configuration ID
        schema:
          type: string
      responses:
        '200':
          description: Select options retrieved successfully
          x-examples:
            application/json:
              statusOptions:
                summary: Select options for a field such as Status (IDs match `value.id` on references in asset responses)
                value:
                  results:
                  - id: 6924631f16a853000117a678
                    value: In stock
                  - id: 6924631f16a853000117a679
                    value: Deployed
                  - id: 6924631f16a853000117a67a
                    value: Retired
                  totalCount: 3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.ListSelectOptionsResponse'
        '400':
          description: Bad request - invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
        '404':
          description: Field configuration not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
        default:
          description: Generic error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url https://console.jumpcloud.com/api/v2/assets/field-configurations/{id}/select-options \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/assets/field-configurations/{id}/select-options"


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/assets/field-configurations/{id}/select-options'' -Method GET -Headers $headers'
  /assets/devices/{id}:
    get:
      tags:
      - Assets
      summary: Get a device asset by ID
      description: Retrieve a specific device asset by its ID
      operationId: getDeviceAsset
      x-scopes:
      - assets
      - assets.readonly
      security:
      - x-api-key: []
      parameters:
      - name: id
        in: path
        required: true
        description: The device asset ID
        schema:
          type: string
      responses:
        '200':
          description: Device asset retrieved successfully
          x-examples:
            application/json:
              stringsAndReferences:
                summary: Strings and references — each field is a `FieldValue` (`editable` + `value`); reference `value` matches create/update `fields` plus `name`/`type`
                value:
                  id: 507f1f77bcf86cd799439011
                  jcSystemId: 605c3f99bcf86cd7994390cc
                  fields:
                    Name:
                      editable: true
                      value: Finance laptop 12
                    Model:
                      editable: true
                      value: MacBookPro18,3
                    Serial Number:
                      editable: true
                      value: C02XK0ZLMN8Q
                    Status:
                      editable: true
                      value:
                        id: 6924631f16a853000117a678
                        name: In stock
                        type: select
                    Owner:
                      editable: true
                      value:
                        id: 605a1f77bcf86cd7994390aa
                        name: Jane Smith
                        type: user
                    Location:
                      editable: true
                      value:
                        id: 605b2f88bcf86cd7994390bb
                        name: London HQ
                        type: location
              datesDatetimePriceBoolean:
                summary: Calendar date, RFC3339 datetime, price object, and boolean in `FieldValue.value`
                value:
                  id: 507f1f77bcf86cd799439011
                  jcSystemId: 605c3f99bcf86cd7994390cc
                  fields:
                    Name:
                      editable: true
                      value: Staging MacBook
                    Purchase Date:
                      editable: true
                      value: 2024-11-01
                    Warranty Expiry Date:
                      editable: true
                      value: 2027-11-01
                    Date Deployed:
                      editable: true
                      value: 2024-11-05 16:45:00
                    Purchase Cost:
                      editable: true
                      value:
                        amount: 1799
                        currency: USD
                    Disk Encrypted:
                      editable: true
                      value: true
              integers:
                summary: Integer fields as JSON numbers in `FieldValue.value`
                value:
                  id: 507f1f77bcf86cd799439011
                  jcSystemId: 605c3f99bcf86cd7994390cc
                  fields:
                    Name:
                      editable: true
                      value: Lab workstation
                    RAM:
                      editable: true
                      value: 16384
                    Warranty Period:
                      editable: true
                      value: 36
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.Asset'
        '400':
          description: Bad request - invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
        '404':
          description: Device asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
        default:
          description: Generic error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url https://console.jumpcloud.com/api/v2/assets/devices/{id} \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/assets/devices/{id}"


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/assets/devices/{id}'' -Method GET -Headers $headers'
    put:
      tags:
      - Assets
      summary: Update a device asset
      description: Update an existing device asset by its ID
      operationId: updateDeviceAsset
      x-scopes:
      - assets
      security:
      - x-api-key: []
      parameters:
      - name: id
        in: path
        required: true
        description: The device asset ID
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jumpcloud.http.assets.UpdateAssetRequest'
        description: Device asset update data
        required: true
        x-examples:
          application/json:
            partialReferenceAndStrings:
              summary: Update reference fields and plain strings
              value:
                fields:
                  Status:
                    id: 6924631f16a853000117a679
                  Model: MacBookPro18,5
                  Serial Number: C02XK0ZLMN8Q
            partialDatesDatetimePrice:
              summary: Update calendar date, RFC3339 datetime, and purchase cost
              value:
                fields:
                  Purchase Date: 2025-01-10
                  Warranty Expiry Date: 2028-01-10
                  Date Deployed: 2025-01-10 09:00:00
                  Purchase Cost:
                    amount: 1999.5
                    currency: USD
            partialIntegersAndBoolean:
              summary: Update integer fields and a boolean as JSON numbers/boolean
              value:
                fields:
                  RAM: 32768
                  Warranty Period: 24
                  Disk Encrypted: false
      responses:
        '200':
          description: Device asset updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.Asset'
        '400':
          description: Bad request - invalid data or ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
        '404':
          description: Device asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
        default:
          description: Generic error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
      x-codeSamples:
      - lang: Shell
        source: "curl --request PUT \\\n  --url https://console.jumpcloud.com/api/v2/assets/devices/{id} \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"fields\":{\"Status\":{\"id\":\"6924631f16a853000117a679\"},\"Model\":\"MacBookPro18,5\",\"Purchase Date\":\"2025-01-10\",\"Date Deployed\":\"2025-01-10T09:00:00\",\"Purchase Cost\":{\"amount\":1999.5,\"currency\":\"USD\"}}}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/assets/devices/{id}\"\n\npayload = {\"fields\": {\n        \"Status\": {\"id\": \"6924631f16a853000117a679\"},\n        \"Model\": \"MacBookPro18,5\",\n        \"Purchase Date\": \"2025-01-10\",\n        \"Date Deployed\": \"2025-01-10T09:00:00\",\n        \"Purchase Cost\": {\n            \"amount\": 1999.5,\n            \"currency\": \"USD\"\n        }\n    }}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"PUT\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/assets/devices/{id}'' -Method PUT -Headers $headers -ContentType ''application/json'' -Body ''{"fields":{"Status":{"id":"6924631f16a853000117a679"},"Model":"MacBookPro18,5","Purchase Date":"2025-01-10","Date Deployed":"2025-01-10T09:00:00","Purchase Cost":{"amount":1999.5,"currency":"USD"}}}'''
    delete:
      tags:
      - Assets
      summary: Delete a device asset
      description: Delete an existing device asset by its ID
      operationId: deleteDeviceAsset
      x-scopes:
      - assets
      security:
      - x-api-key: []
      parameters:
      - name: id
        in: path
        required: true
        description: The device asset ID
        schema:
          type: string
      responses:
        '204':
          description: Device asset deleted successfully
        '400':
          description: Bad request - invalid ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
        '404':
          description: Device asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
        default:
          description: Generic error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
      x-codeSamples:
      - lang: Shell
        source: "curl --request DELETE \\\n  --url https://console.jumpcloud.com/api/v2/assets/devices/{id} \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/assets/devices/{id}"


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("DELETE", url, headers=headers)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/assets/devices/{id}'' -Method DELETE -Headers $headers'
  /assets/devices:
    get:
      tags:
      - Assets
      summary: List device assets
      description: Retrieve a list of device assets with optional pagination
      operationId: listDeviceAssets
      x-scopes:
      - assets
      - assets.readonly
      security:
      - x-api-key: []
      parameters:
      - name: limit
        in: query
        description: Maximum number of results to return
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
          default: 10
      - name: skip
        in: query
        description: Number of results to skip for pagination
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
      - name: fields
        in: query
        description: Field configuration labels to include in each asset's `fields` map (comma-separated). Each name must match the `label` from `GET /assets/field-configurations` for devices.
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Device assets retrieved successfully
          x-examples:
            application/json:
              firstPage:
                summary: Paginated list — same `Asset` shape as GET by id
                value:
                  results:
                  - id: 507f1f77bcf86cd799439011
                    jcSystemId: 605c3f99bcf86cd7994390cc
                    fields:
                      Name:
                        editable: true
                        value: Finance laptop 12
                      Model:
                        editable: true
                        value: MacBookPro18,3
                      Status:
                        editable: true
                        value:
                          id: 6924631f16a853000117a678
                          name: In stock
                          type: select
                  - id: 507f1f77bcf86cd799439012
                    jcSystemId: 605c3f99bcf86cd7994390dd
                    fields:
                      Name:
                        editable: true
                        value: Staging MacBook
                      Purchase Date:
                        editable: true
                        value: 2024-11-01
                  totalCount: 150
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.AssetListResponse'
        '400':
          description: Bad request - invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
        default:
          description: Generic error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/assets/devices?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&fields=SOME_ARRAY_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/assets/devices"


          querystring = {"limit":"SOME_INTEGER_VALUE","skip":"SOME_INTEGER_VALUE","fields":"SOME_ARRAY_VALUE"}


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/assets/devices?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&fields=SOME_ARRAY_VALUE'' -Method GET -Headers $headers'
    post:
      tags:
      - Assets
      summary: Create a device asset
      description: Create a new device asset
      operationId: createDeviceAsset
      x-scopes:
      - assets
      security:
      - x-api-key: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jumpcloud.http.assets.CreateAssetRequest'
        description: Device asset creation data
        required: true
        x-examples:
          application/json:
            stringsAndReferences:
              summary: Text fields and reference objects (`id` is lowercase hex)
              value:
                fields:
                  Name: Finance laptop 12
                  Model: MacBookPro18,3
                  Serial Number: C02XK0ZLMN8Q
                  Status:
                    id: 6924631f16a853000117a678
                  Owner:
                    id: 605a1f77bcf86cd7994390aa
                  Location:
                    id: 605b2f88bcf86cd7994390bb
            datesDatetimePriceBoolean:
              summary: Calendar date (`YYYY-MM-DD`), RFC3339 datetime, price object, boolean
              value:
                fields:
                  Name: Staging MacBook
                  Purchase Date: 2024-11-01
                  Warranty Expiry Date: 2027-11-01
                  Date Deployed: 2024-11-05 16:45:00
                  Purchase Cost:
                    amount: 1799
                    currency: USD
                  Disk Encrypted: true
            integers:
              summary: Integer fields as JSON numbers (RAM in MB, warranty months)
              value:
                fields:
                  Name: Lab workstation
                  RAM: 16384
                  Warranty Period: 36
      responses:
        '201':
          description: Device asset created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.Asset'
        '400':
          description: Bad request - invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
        '401':
          description: Unauthorized - authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
        '409':
          description: Conflict - asset with unique field value already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
        default:
          description: Generic error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.http.assets.error'
      x-codeSamples:
      - lang: Shell
