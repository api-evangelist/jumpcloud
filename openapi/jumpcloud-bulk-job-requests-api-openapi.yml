    - description: Unique identifier of the scheduled statechange job.
      in: path
      name: id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - users-bulk-activate
    - users-bulk-suspend
    delete:
      summary: Delete Scheduled Userstate Job
      description: 'This endpoint deletes a scheduled statechange job.

        #### Sample Request

        ```

        curl -X DELETE "https://console.jumpcloud.com/api/v2/bulk/userstates/{ScheduledJob_ID}" \

        -H ''x-api-key: {API_KEY}'' \

        -H ''Content-Type: application/json'' \

        -H ''Accept: application/json''

        ```'
      operationId: bulk_userStatesDelete
      tags:
      - Bulk Job Requests
      responses:
        '204':
          description: No Content
          headers: {}
        '400':
          $ref: '#/components/responses/trait_standardErrors_400'
        '401':
          $ref: '#/components/responses/trait_standardErrors_401'
        '403':
          $ref: '#/components/responses/trait_standardErrors_403'
        '404':
          $ref: '#/components/responses/trait_standardErrors_404'
        '409':
          $ref: '#/components/responses/trait_standardErrors_409'
        '500':
          $ref: '#/components/responses/trait_standardErrors_500'
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      x-scopes:
      - users
      - users.state
      - users.state.delete
      x-codeSamples:
      - lang: Shell
        source: "curl --request DELETE \\\n  --url https://console.jumpcloud.com/api/v2/bulk/userstates/{id} \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/bulk/userstates/{id}\"\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"DELETE\", url, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/bulk/userstates/{id}'' -Method DELETE -Headers $headers'
  /bulk/userstates/eventlist/next:
    parameters: []
    x-functionalities-tags:
    - users-bulk-activate
    - users-bulk-suspend
    get:
      summary: Get the next scheduled state change for a list of users
      tags:
      - Bulk Job Requests
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events_count:
                    type: integer
                    description: 'The total number of ACTIVATED and SUSPENDED events to a max depth of 1 for

                      all of the users in the query. A value larger than the limit specified on

                      the query indicates that additional calls are needed, using a skip greater

                      than 0, to retrieve the full set of results.'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/scheduled-userstate-result'
        '400':
          $ref: '#/components/responses/trait_standardErrors_400'
        '401':
          $ref: '#/components/responses/trait_standardErrors_401'
        '403':
          $ref: '#/components/responses/trait_standardErrors_403'
        '404':
          $ref: '#/components/responses/trait_standardErrors_404'
        '500':
          $ref: '#/components/responses/trait_standardErrors_500'
      operationId: bulk_userStatesGetNextScheduled
      description: 'This endpoint is used to lookup the next upcoming scheduled state change for each user in the

        given list. The users parameter is limited to 100 items per request. The results are also limited

        to 100 items. This endpoint returns a max of 1 event per state per user. For example, if a user

        has 3 ACTIVATED events scheduled it will return the next upcoming activation event. However, if a

        user also has a SUSPENDED event scheduled along with the ACTIVATED events it will return the next

        upcoming activation event _and_ the next upcoming suspension event.'
      parameters:
      - in: query
        name: users
        description: A list of system user IDs, limited to 100 items.
        required: true
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
          minItems: 0
          maxItems: 100
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_skip_skip'
      x-scopes:
      - users
      - users.readonly
      - users.state
      - users.state.readonly
      security:
      - x-api-key: []
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/bulk/userstates/eventlist/next?users=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/bulk/userstates/eventlist/next"


          querystring = {"users":"SOME_ARRAY_VALUE","limit":"SOME_INTEGER_VALUE","skip":"SOME_INTEGER_VALUE"}


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers, params=querystring)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/bulk/userstates/eventlist/next?users=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE'' -Method GET -Headers $headers'
