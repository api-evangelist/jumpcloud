      - users.properties.update
      x-codeSamples:
      - lang: Shell
        source: "curl --request PATCH \\\n  --url 'https://console.jumpcloud.com/api/v2/bulk/users?suppressEmail=SOME_BOOLEAN_VALUE' \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '[{\"attributes\":[{}],\"email\":\"string\",\"firstname\":\"string\",\"id\":\"string\",\"organization\":\"string\",\"lastname\":\"string\",\"username\":\"string\"}]'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/bulk/users\"\n\nquerystring = {\"suppressEmail\":\"SOME_BOOLEAN_VALUE\"}\n\npayload = [\n    {\n        \"attributes\": [{}],\n        \"email\": \"string\",\n        \"firstname\": \"string\",\n        \"id\": \"string\",\n        \"organization\": \"string\",\n        \"lastname\": \"string\",\n        \"username\": \"string\"\n    }\n]\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"PATCH\", url, json=payload, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/bulk/users?suppressEmail=SOME_BOOLEAN_VALUE'' -Method PATCH -Headers $headers -ContentType ''application/json'' -Body ''[{"attributes":[{}],"email":"string","firstname":"string","id":"string","organization":"string","lastname":"string","username":"string"}]'''
    post:
      description: 'The endpoint allows you to create a bulk job to asynchronously create users.

        See Create a System User

        for the full list of attributes.


        #### Default User State

        The `state` of each user in the request can be explicitly passed in or

        omitted. If `state` is omitted, then the user will get created

        using the value returned from the

        Get an Organization

        endpoint. The default user state for bulk created users depends on the

        `creation-source` header. For `creation-source:jumpcloud:bulk` the

        default state is stored in `settings.newSystemUserStateDefaults.csvImport`.

        For other `creation-source` header values, the default state is stored in

        `settings.newSystemUserStateDefaults.applicationImport`


        These default state values can be changed in the admin portal settings

        or by using the

        Update an Organization

        endpoint.


        #### Sample Request


        ```

        curl -X POST https://console.jumpcloud.com/api/v2/bulk/users \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''[

        {

        "email":"{email}",

        "firstname":"{firstname}",

        "lastname":"{firstname}",

        "username":"{username}",

        "attributes":[

        {

        "name":"EmployeeID",

        "value":"0000"

        },

        {

        "name":"Custom",

        "value":"attribute"

        }

        ]

        }

        ]''

        ```'
      operationId: bulk_usersCreate
      parameters:
      - $ref: '#/components/parameters/trait_bulkJobQueryParameters_suppressEmail'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      - in: header
        description: 'Defines the creation-source header for gapps, o365 and workdays requests.

          If the header isn''t sent, the default value is `jumpcloud:bulk`, if you send the header with a malformed value you receive a 400 error.

          '
        name: creation-source
        schema:
          type: string
          enum:
          - jumpcloud:gapps
          - jumpcloud:o365
          - jumpcloud:workday
          - jumpcloud:scim
          - jumpcloud:bulk
          - jumpcloud:custom_integration
          default: jumpcloud:bulk
      requestBody:
        $ref: '#/components/requestBodies/bulk-user-createArray'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/job-id'
      security:
      - x-api-key: []
      summary: Bulk Users Create
      tags:
      - Bulk Job Requests
      x-scopes:
      - users
      - users.create
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url 'https://console.jumpcloud.com/api/v2/bulk/users?suppressEmail=SOME_BOOLEAN_VALUE' \\\n  --header 'content-type: application/json' \\\n  --header 'creation-source: SOME_STRING_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '[{\"attributes\":[{}],\"email\":\"string\",\"firstname\":\"string\",\"lastname\":\"string\",\"username\":\"string\"}]'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/bulk/users\"\n\nquerystring = {\"suppressEmail\":\"SOME_BOOLEAN_VALUE\"}\n\npayload = [\n    {\n        \"attributes\": [{}],\n        \"email\": \"string\",\n        \"firstname\": \"string\",\n        \"lastname\": \"string\",\n        \"username\": \"string\"\n    }\n]\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"creation-source\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("creation-source", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/bulk/users?suppressEmail=SOME_BOOLEAN_VALUE'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''[{"attributes":[{}],"email":"string","firstname":"string","lastname":"string","username":"string"}]'''
