          type: string
        firstname:
          type: string
        id:
          description: Object ID of the user being updated
          type: string
        organization:
          description: Organization object id of the user
          type: string
        lastname:
          type: string
        username:
          type: string
      title: Bulk User Update
      type: object
    bulk-user-unlock:
      properties:
        attributes:
          description: Map of additional attributes.
          items:
            type: object
