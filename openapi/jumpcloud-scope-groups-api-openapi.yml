tags:
- name: Scope Groups
paths:
  /scope-groups:
    get:
      summary: List Scope Groups
      tags:
      - Scope Groups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCount:
                    type: integer
                    description: Total count of scope groups matching the filter criteria
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScopeGroup'
                required:
                - totalCount
                - results
        '400':
          $ref: '#/components/responses/trait_standardErrors_400'
        '401':
          $ref: '#/components/responses/trait_standardErrors_401'
        '403':
          $ref: '#/components/responses/trait_standardErrors_403'
        '404':
          $ref: '#/components/responses/trait_standardErrors_404'
        '500':
          $ref: '#/components/responses/trait_standardErrors_500'
      operationId: scopegroups_list
      parameters:
      - $ref: '#/components/parameters/trait_listCount_x-total-count'
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_filter_filter'
      - $ref: '#/components/parameters/trait_sort_sort'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-provider-id'
      description: 'Retrieve scope groups for custom role creation.


        Scope groups are global catalog resources.


        Catalog visibility may depend on authenticated organization/provider context.


        Direct/OU context can influence contextual catalog visibility.


        Route availability is context-dependent: MSP provider-authoring requests

        (authenticated MSP provider without organization context) require

        SP-10009-custom-role-mtp. Organization contexts are always available.


        When MSP Custom Roles is enabled, authenticated MSP provider context may

        request the provider-authoring catalog without x-org-id.


        By default, returns scope groups with displayToUsers: true. Supports

        JumpCloud standard pagination, sorting, and basic filtering.


        **Response Format**: Returns an object with `totalCount` and `results` array.

        The total count is also provided in the `X-Total-Count` response header.


        #### Core Features

        - **Global Resource**: Same scope groups available to all organizations

        - **Pagination**: Standard `limit` and `skip` parameters

        - **Sorting**: Default sort by `groupName` (ascending), user-configurable

        - **Filtering**: `displayToUsers:eq:true|false` (defaults to true)


        #### Sample Requests

        ```

        # Default - displayToUsers: true, sorted by groupName

        curl https://console.jumpcloud.com/api/v2/scope-groups \

        -H ''accept: application/json'' \

        -H ''x-api-key: {API_KEY}''


        # With pagination

        curl ''https://console.jumpcloud.com/api/v2/scope-groups?limit=10&skip=20'' \

        -H ''x-api-key: {API_KEY}''


        # Custom sorting

        curl ''https://console.jumpcloud.com/api/v2/scope-groups?sort[0][field]=groupName&sort[0][descending]=true'' \

        -H ''x-api-key: {API_KEY}''


        # Get internal scope groups (admin use)

        curl ''https://console.jumpcloud.com/api/v2/scope-groups?filter=displayToUsers:eq:false'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      security:
      - x-api-key: []
      x-scopes:
      - roles
      - roles.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/scope-groups?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&filter=SOME_ARRAY_VALUE&sort=SOME_ARRAY_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --header 'x-provider-id: SOME_STRING_VALUE' \\\n  --header 'x-total-count: SOME_INTEGER_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/scope-groups\"\n\nquerystring = {\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\",\"filter\":\"SOME_ARRAY_VALUE\",\"sort\":\"SOME_ARRAY_VALUE\"}\n\nheaders = {\n    \"x-total-count\": \"SOME_INTEGER_VALUE\",\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-provider-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-total-count", "SOME_INTEGER_VALUE")

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-provider-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/scope-groups?limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&filter=SOME_ARRAY_VALUE&sort=SOME_ARRAY_VALUE'' -Method GET -Headers $headers'
components:
  schemas:
    Error:
      title: Error
      type: object
      x-examples: {}
      description: ''
      properties:
        code:
          format: int32
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Error message
        status:
          type: string
          description: HTTP status description
    ScopeGroup:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the scope group
        groupName:
          type: string
          description: Name of the scope group
        groupKey:
          type: string
          description: A unique, URL-friendly key for the scope group.
        fullAccessScopes:
          type: array
          items:
            type: string
          description: List of scopes that grant full access to the group.
        displayToUsers:
          type: boolean
          description: Whether this scope group should be displayed to users
        groupDescription:
          type: string
          description: Description of the scope group's purpose
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
          description: List of scopes within this group
        createdAt:
          type: string
          format: date-time
          description: When the scope group was created
        updatedAt:
          type: string
          format: date-time
          description: When the scope group was last updated
      examples:
      - id: 507f1f77bcf86cd799439011
        groupName: User Management
        groupKey: user-management
        displayToUsers: true
        groupDescription: Manage users
        scopes:
        - key: users.unlock
          label: Unlock user accounts
          subgroupLabel: User Support
          displayToUsers: true
          description: Unlock user accounts.
          permissionType: actions
          permissions:
          - key: allow
            values:
            - users.unlock
        createdAt: 2023-07-23 12:00:00
        updatedAt: 2023-07-23 12:00:00
    Scope:
      type: object
      properties:
        key:
          type: string
          description: Unique key for the scope
        label:
          type: string
          description: Human-readable label for the scope
        subgroupLabel:
          type: string
          description: A common label for a group of related scopes.
        displayToUsers:
          type: boolean
          description: Whether this scope should be displayed to users
        description:
          type: string
          description: Description of what this scope controls
        permissionType:
          type: string
          description: The type of permission structure for UI rendering.
          enum:
          - granular
          - access_level
          - actions
        allowsNoAccess:
          type: boolean
          description: Whether No Access option available for the scope. It would be applicable when permission_type:access_level
        permissions:
          type: array
          description: Available permission levels for this scope
          items:
            type: object
            properties:
              key:
                type: string
                description: Permission level key (e.g. fullAccess, view, create, update, delete, allow)
              values:
                type: array
                items:
                  type: string
                description: Scope strings granted at this permission level
      examples:
      - key: systems
        label: Systems
        displayToUsers: true
        description: Manage system resources and configurations
        permissionType: access_level
        permissions:
        - key: fullAccess
          values:
          - systems
        - key: view
          values:
          - systems.readonly
    ErrorDetails:
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          details:
            description: 'Describes a list of objects with more detailed information of the given error. Each detail schema is according to one of the messages defined in Google''s API: https://github.com/googleapis/googleapis/blob/master/google/rpc/error_details.proto'
            type: array
            items:
              type: object
              additionalProperties: true
              description: Object according to Google's API.
  parameters:
    trait_multiTenantRequestHeaders_x-org-id:
      description: Organization identifier that can be obtained from console settings.
      in: header
      name: x-org-id
      schema:
        type: string
    trait_limit_limit:
      description: The number of records to return at once. Limited to 100.
      in: query
      name: limit
      schema:
        type: integer
        default: 10
    trait_filter_filter:
      description: 'A filter to apply to the query.


        **Filter structure**: `<field>:<operator>:<value>`.


        **field** = Populate with a valid field from an endpoint response.


        **operator** =  Supported operators are: eq, ne, gt, ge, lt, le, between, search, in.

        _Note: v1 operators differ from v2 operators._


        **value** = Populate with the value you want to search for. Is case sensitive. Supports wild cards.


        **EX:** `GET /api/v2/groups?filter=name:eq:Test+Group`'
      in: query
      name: filter
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        default: []
    trait_skip_skip:
      description: The offset into the records to return.
      in: query
      name: skip
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    trait_sort_sort:
      description: 'The comma separated fields used to sort the collection.

        Default sort is ascending, prefix with `-` to sort descending.

        '
      in: query
      name: sort
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        default: []
    trait_multiTenantRequestHeaders_x-provider-id:
      description: Multi-tenant Provider identifier that can be obtained from console settings.
      in: header
      name: x-provider-id
      required: false
      schema:
        type: string
    trait_listCount_x-total-count:
      in: header
      name: x-total-count
      schema:
        type: integer
  responses:
    trait_standardErrors_404:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    trait_standardErrors_403:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    trait_standardErrors_401:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    trait_standardErrors_500:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    trait_standardErrors_400:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetails'
  securitySchemes:
    x-api-key:
      description: API key used to authenticate requests.
      in: header
      name: x-api-key
      type: apiKey
