paths:
  /groups:
    parameters: []
    x-functionalities-tags:
    - groups
    get:
      description: 'This endpoint returns all Groups that exist in your organization.


        #### Available filter fields:

        - `name`

        - `disabled`

        - `type`

        - `memberQueryErrorFlags`


        #### Sample Request


        ```

        curl -X GET \

        https://console.jumpcloud.com/api/v2/groups \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: groups_list
      parameters:
      - $ref: '#/components/parameters/trait_fields_fields'
      - $ref: '#/components/parameters/trait_filter_filter'
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_sort_sort'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      - $ref: '#/components/parameters/trait_listCount_x-unfiltered-total-count'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Group'
                type: array
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - x-api-key: []
      summary: List All Groups
      tags:
      - Groups
      x-scopes:
      - groups
      - groups.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/groups?fields=SOME_ARRAY_VALUE&filter=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --header 'x-unfiltered-total-count: SOME_INTEGER_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/groups\"\n\nquerystring = {\"fields\":\"SOME_ARRAY_VALUE\",\"filter\":\"SOME_ARRAY_VALUE\",\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\",\"sort\":\"SOME_ARRAY_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-unfiltered-total-count\": \"SOME_INTEGER_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-unfiltered-total-count", "SOME_INTEGER_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/groups?fields=SOME_ARRAY_VALUE&filter=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE'' -Method GET -Headers $headers'
  /providers/{provider_id}/usergroups/{group_id}/associations:
    parameters:
    - name: provider_id
      in: path
      required: true
      description: The ID of the provider
      schema:
        type: string
    - name: group_id
      in: path
      required: true
      description: The ID of the user group
      schema:
        type: string
    x-functionalities-tags:
    - groups
    - mtp-account-overview
    post:
      description: 'Creates or deletes an association between a user group and a secondary organization.

        This endpoint is the core mechanism for sharing or un-sharing a user group.


        The caller must belong to the owner organization (the provider''s primary organization).


        #### Sample Request

        ```

        curl -X POST https://console.jumpcloud.com/api/v2/providers/{provider_id}/usergroups/{group_id}/associations \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-org-id: -'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        "op": "add",

        "type": "organization",

        "id": "org-secondary-12345"

        }''

        ```'
      operationId: providers_userGroupsManageAssociations
      requestBody:
        $ref: '#/components/requestBodies/ManageAssociations-Group'
      responses:
        '204':
          description: Association successfully created or deleted
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found - provider, group, or organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - group is already shared to the target organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
