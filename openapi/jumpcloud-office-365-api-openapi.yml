paths:
  /office365s/{office365_id}:
    parameters:
    - description: ObjectID of the Office 365 instance.
      in: path
      name: office365_id
      required: true
      schema:
        type: string
    get:
      description: 'This endpoint returns a specific Office 365 instance.


        #####


        Sample Request


        ```

        curl -X GET https://console.jumpcloud.com/api/v2/office365s/{OFFICE365_ID} \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}''


        ```'
      operationId: office365s_get
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/office365'
      security:
      - x-api-key: []
      summary: Get Office 365 instance
      tags:
      - Office 365
      x-scopes:
      - directories
      - directories.readonly
      x-functionalities-tags:
      - m365-read
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url https://console.jumpcloud.com/api/v2/office365s/{office365_id} \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/office365s/{office365_id}\"\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/office365s/{office365_id}'' -Method GET -Headers $headers'
    patch:
      description: 'This endpoint allows updating some attributes of an Office 365 instance.


        #####


        Sample Request


        ```

        curl -X PATCH https://console.jumpcloud.com/api/v2/office365s/{OFFICE365_ID} \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        "userLockoutAction": "maintain",

        "userPasswordExpirationAction": "suspend",

        }''

        ```


        Sample Request, set a default domain


        ```

        curl -X PATCH https://console.jumpcloud.com/api/v2/office365s/{OFFICE365_ID} \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        "defaultDomain": {

        "id": "{domainObjectID}"

        }

        }''

        ```


        Sample Request, unset the default domain


        ```

        curl -X PATCH https://console.jumpcloud.com/api/v2/office365s/{OFFICE365_ID} \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        "defaultDomain": {}

        }''

        ```'
      operationId: office365s_patch
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/office365'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/office365'
      security:
      - x-api-key: []
      summary: Update existing Office 365 instance
      tags:
      - Office 365
      x-scopes:
      - directories
      x-functionalities-tags:
      - m365-update
      x-codeSamples:
      - lang: Shell
        source: "curl --request PATCH \\\n  --url https://console.jumpcloud.com/api/v2/office365s/{office365_id} \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '{\"name\":\"string\",\"groupsEnabled\":true,\"defaultDomain\":{\"id\":\"string\"}}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/office365s/{office365_id}\"\n\npayload = {\n    \"name\": \"string\",\n    \"groupsEnabled\": True,\n    \"defaultDomain\": {\"id\": \"string\"}\n}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"PATCH\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/office365s/{office365_id}'' -Method PATCH -Headers $headers -ContentType ''application/json'' -Body ''{"name":"string","groupsEnabled":true,"defaultDomain":{"id":"string"}}'''
  /office365s/{office365_id}/associations:
    parameters:
    - description: ObjectID of the Office 365 instance.
      in: path
      name: office365_id
      required: true
      schema:
        type: string
    x-functionalities-tags:
    - m365-associations
    get:
      description: 'This endpoint returns _direct_ associations of an Office 365 instance.


        A direct association can be a non-homogeneous relationship between 2 different objects, for example Office 365 and Users.


        #### Sample Request

        ```

        curl -X GET ''https://console.jumpcloud.com/api/v2/office365s/{OFFICE365_ID}/associations?targets=user_group'' \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}''


        ```'
      operationId: graph_office365AssociationsList
      parameters:
      - $ref: '#/components/parameters/trait_graphTargetsOffice365_targets'
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/GraphConnection'
                type: array
      security:
      - x-api-key: []
      summary: List the associations of an Office 365 instance
      tags:
      - Office 365
      x-scopes:
      - associations.directories
      - associations.directories.readonly
      - associations
      - associations.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/office365s/{office365_id}/associations?targets=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/office365s/{office365_id}/associations\"\n\nquerystring = {\"targets\":\"SOME_ARRAY_VALUE\",\"limit\":\"SOME_INTEGER_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/office365s/{office365_id}/associations?targets=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&skip=SOME_INTEGER_VALUE'' -Method GET -Headers $headers'
    post:
      description: 'This endpoint allows you to manage the _direct_ associations of a Office 365 instance.


        A direct association can be a non-homogeneous relationship between 2 different objects, for example Office 365 and Users.


        #### Sample Request

        ```

        curl -X POST https://console.jumpcloud.com/api/v2/office365s/{OFFICE365_ID}/associations \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        "op": "add",

        "type": "user_group",

        "id": "{Group_ID}"

        }''

        ```'
      operationId: graph_office365AssociationsPost
      parameters:
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphOperation-Office365'
      responses:
        '204':
          description: OK
      security:
      - x-api-key: []
      summary: Manage the associations of an Office 365 instance
      tags:
      - Office 365
      x-scopes:
      - associations.directories
      - associations
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/office365s/{office365_id}/associations \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '{\"id\":\"string\",\"op\":\"add\",\"attributes\":{},\"type\":\"user\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/office365s/{office365_id}/associations\"\n\npayload = {\n    \"id\": \"string\",\n    \"op\": \"add\",\n    \"attributes\": {},\n    \"type\": \"user\"\n}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/office365s/{office365_id}/associations'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"id":"string","op":"add","attributes":{},"type":"user"}'''
  /office365s/{office365_id}/translationrules:
