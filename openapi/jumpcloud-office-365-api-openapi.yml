        source: "curl --request PUT \\\n  --url https://console.jumpcloud.com/api/v2/office365s/{office365_id}/users/external-id \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"correlations\":[{\"externalUserId\":\"string\",\"userObjectId\":\"string\"}]}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/office365s/{office365_id}/users/external-id\"\n\npayload = {\"correlations\": [\n        {\n            \"externalUserId\": \"string\",\n            \"userObjectId\": \"string\"\n        }\n    ]}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"PUT\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/office365s/{office365_id}/users/external-id'' -Method PUT -Headers $headers -ContentType ''application/json'' -Body ''{"correlations":[{"externalUserId":"string","userObjectId":"string"}]}'''
