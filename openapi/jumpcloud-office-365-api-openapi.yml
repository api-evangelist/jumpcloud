    post:
      description: 'This endpoint allows you to create a translation rule for a specific Office 365 instance. These rules specify how JumpCloud attributes translate to Microsoft Graph attributes.


        ##### Sample Request

        ```

        curl -X POST https://console.jumpcloud.com/api/v2/office365s/{office365_id}/translationrules \

        -H ''Accept: application/json'' \

        -H ''Content-Type: application/json'' \

        -H ''x-api-key: {API_KEY}'' \

        -d ''{

        {Translation Rule Parameters}

        }''

