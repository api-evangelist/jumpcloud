- url: https://console.jumpcloud.com/api/v2
  description: United States (US)
  x-jc-region: us
- url: https://console.eu.jumpcloud.com/api/v2
  description: European Union (EU)
  x-jc-region: eu
- url: https://console.in.jumpcloud.com/api/v2
  description: India (IN)
  x-jc-region: in
tags:
- name: Directories
paths:
  /directories:
    x-functionalities-tags:
    - directories
    get:
      description: 'This endpoint returns all active directories (LDAP, O365 Suite, G-Suite).


        #### Sample Request

        ```

        curl -X GET https://console.jumpcloud.com/api/v2/directories \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```


        #### Filter by organizationId

        Supported filter field: `organizationId`. Supported operators: `eq`, `in`.


        ```

        curl -X GET ''https://console.jumpcloud.com/api/v2/directories?filter=organizationId:eq:{ORG_ID}'' \

        -H ''accept: application/json'' \

        -H ''content-type: application/json'' \

        -H ''x-api-key: {API_KEY}''

        ```'
      operationId: directories_list
      parameters:
      - $ref: '#/components/parameters/trait_fields_fields'
      - $ref: '#/components/parameters/trait_filter_filter'
      - $ref: '#/components/parameters/trait_limit_limit'
      - $ref: '#/components/parameters/trait_sort_sort'
      - $ref: '#/components/parameters/trait_skip_skip'
      - $ref: '#/components/parameters/trait_multiTenantRequestHeaders_x-org-id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Directory'
                type: array
              examples:
                response:
                  value:
                  - id: 5f91c8695e980f0001c44619
                    type: active_directory
                    name: string
                  - id: 5f91c8695e980f0001c44618
                    name: string
                    defaultDomain:
                      domain: string
                      id: string
                    type: office_365
                  - id: 5f91c8695e980f0001c44617
                    name: string
                    defaultDomain:
                      domain: string
                      id: string
                    type: g_suite
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - x-api-key: []
      summary: List All Directories
      tags:
      - Directories
      x-scopes:
      - directories
      - directories.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/directories?fields=SOME_ARRAY_VALUE&filter=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE&skip=SOME_INTEGER_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/directories\"\n\nquerystring = {\"fields\":\"SOME_ARRAY_VALUE\",\"filter\":\"SOME_ARRAY_VALUE\",\"limit\":\"SOME_INTEGER_VALUE\",\"sort\":\"SOME_ARRAY_VALUE\",\"skip\":\"SOME_INTEGER_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/directories?fields=SOME_ARRAY_VALUE&filter=SOME_ARRAY_VALUE&limit=SOME_INTEGER_VALUE&sort=SOME_ARRAY_VALUE&skip=SOME_INTEGER_VALUE'' -Method GET -Headers $headers'
components:
  schemas:
    Error:
      title: Error
      type: object
      x-examples: {}
      description: ''
      properties:
        code:
          format: int32
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Error message
        status:
          type: string
          description: HTTP status description
    Directory:
      title: Directory
      type: object
      description: ''
      properties:
        id:
          description: The ObjectID of the directory.
          type: string
        name:
          description: The name of the directory.
          type: string
        type:
          description: The type of directory.
          enum:
          - active_directory
          - g_suite
          - ldap_server
          - office_365
          - workday
          type: string
        oAuthStatus:
          description: the expiry and error status of the bearer token
          type:
          - object
          - 'null'
        defaultDomain:
          description: The default domain object if exists, contains id and name of the domain.
          properties:
            id:
              type: string
            domain:
              type: string
          type:
          - object
          - 'null'
        organizationId:
          description: ObjectID of the organization that owns this directory.
          type: string
          readOnly: true
        associatedOrganizationIds:
          description: Organization object ids (hex) where this G Suite integration is associated among the caller's authorized organizations.
          readOnly: true
          type: array
          items:
            type: string
      required:
      - id
      - name
      - type
  parameters:
    trait_multiTenantRequestHeaders_x-org-id:
      description: Organization identifier that can be obtained from console settings.
      in: header
      name: x-org-id
      schema:
        type: string
    trait_filter_filter:
      description: 'A filter to apply to the query.


        **Filter structure**: `<field>:<operator>:<value>`.


        **field** = Populate with a valid field from an endpoint response.


        **operator** =  Supported operators are: eq, ne, gt, ge, lt, le, between, search, in.

        _Note: v1 operators differ from v2 operators._


        **value** = Populate with the value you want to search for. Is case sensitive. Supports wild cards.


        **EX:** `GET /api/v2/groups?filter=name:eq:Test+Group`'
      in: query
      name: filter
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        default: []
    trait_skip_skip:
      description: The offset into the records to return.
      in: query
      name: skip
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    trait_sort_sort:
      description: 'The comma separated fields used to sort the collection.

        Default sort is ascending, prefix with `-` to sort descending.

        '
      in: query
      name: sort
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        default: []
    trait_limit_limit:
      description: The number of records to return at once. Limited to 100.
      in: query
      name: limit
      schema:
        type: integer
        default: 10
    trait_fields_fields:
      description: 'The comma separated fields included in the returned records.

        If omitted, the default list of fields will be returned.

        '
      in: query
      name: fields
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        default: []
  securitySchemes:
    x-api-key:
      description: API key used to authenticate requests.
      in: header
      name: x-api-key
      type: apiKey
