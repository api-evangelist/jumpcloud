openapi: 3.2.0
info:
  contact:
    name: JumpCloud Support
    url: https://jumpcloud.com/support/contact-jumpcloud-support
  description: '# Overview


    JumpCloud''s V2 API. This set of endpoints allows JumpCloud customers to manage objects, groupings and mappings and interact with the JumpCloud Graph. > **Note:** See JumpCloud Data Centers: Login URLs and Service Endpoints to learn more. ## API Best Practices


    Read the linked Help Article below for guidance on retrying failed requests to JumpCloud''s REST API, as well as best practices for structuring subsequent retry requests. Customizing retry mechanisms based on these recommendations will increase the reliability and dependability of your API calls. Covered topics include:

    1. Important Considerations

    2. Supported HTTP Request Methods

    3. Response codes

    4. API Key rotation

    5. Paginating

    6. Error handling

    7. Retry rates


    JumpCloud Help Center - API Best Practices


    # Directory Objects


    This API offers the ability to interact with some of our core features; otherwise known as Directory Objects. The Directory Objects are:


    * Commands

    * Policies

    * Policy Groups

    * Applications

    * Systems

    * Users

    * User Groups

    * System Groups

    * Radius Servers

    * Directories: Office 365, LDAP,G-Suite, Active Directory

    * Duo accounts and applications. The Directory Object is an important concept to understand in order to successfully use JumpCloud API. ## JumpCloud Graph


    We''ve also introduced the concept of the JumpCloud Graph along with Directory Objects. The Graph is a powerful aspect of our platform which will enable you to associate objects with each other, or establish membership for certain objects to become members of other objects. Specific `GET` endpoints will allow you to traverse the JumpCloud Graph to return all indirect and directly bound objects in your organization. | !alt text |

    |:--:|

    | **This diagram highlights our association and membership model as it relates to Directory Objects.** |


    # API Key


    ## Access Your API Key


    To locate your API Key:


    1. Log into the JumpCloud Admin Console. 2. Go to the username drop down located in the top-right of the Console. 3. Retrieve your API key from API Settings. ## API Key Considerations


    This API key is associated to the currently logged in administrator. Other admins will have different API keys. **WARNING** Please keep this API key secret, as it grants full access to any data accessible via your JumpCloud console account. You can also reset your API key in the same location in the JumpCloud Admin Console. ## Recycling or Resetting Your API Key


    In order to revoke access with the current API key, simply reset your API key. This will render all calls using the previous API key inaccessible. Your API key will be passed in as a header with the header name "x-api-key". ```bash

    curl -H "x-api-key: [YOUR_API_KEY_HERE]" "https://console.jumpcloud.com/api/v2/systemgroups"

    ```


    # System Context


    * Introduction

    * Supported endpoints

    * Response codes

    * Authentication

    * Additional examples

    * Third party


    ## Introduction


    JumpCloud System Context Authorization is an alternative way to authenticate with a subset of JumpCloud''s REST APIs. Using this method, a system can manage its information and resource associations, allowing modern auto provisioning environments to scale as needed. **Notes:**


    * The following documentation applies to Linux Operating Systems only. * Systems that have been automatically enrolled using Apple''s Device Enrollment Program (DEP) or systems enrolled using the User Portal install are not eligible to use the System Context API to prevent unauthorized access to system groups and resources. If a script that utilizes the System Context API is invoked on a system enrolled in this way, it will display an error. ## Supported Endpoints


    JumpCloud System Context Authorization can be used in conjunction with Systems endpoints found in the V1 API and certain System Group endpoints found in the v2 API.'
  title: JumpCloud Email Subscriptions API
  version: '2.0'
servers:
- url: https://console.jumpcloud.com/api/v2
  description: United States (US)
  x-jc-region: us
- url: https://console.eu.jumpcloud.com/api/v2
  description: European Union (EU)
  x-jc-region: eu
- url: https://console.in.jumpcloud.com/api/v2
  description: India (IN)
  x-jc-region: in
tags:
- name: Email Subscriptions
paths:
  /notifications/subscriptions/email:
    get:
      summary: List the caller's email subscription preferences
      description: This endpoint lists the authenticated administrator's email subscription preferences.
      operationId: EmailSubscriptionsService_ListEmailSubscriptions
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.notifications.ListEmailSubscriptionsResponse'
      tags:
      - Email Subscriptions
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - notifications.subscriptions
      - notifications.subscriptions.readonly
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url https://console.jumpcloud.com/api/v2/notifications/subscriptions/email \\\n  --header 'x-api-key: REPLACE_KEY_VALUE'"
      - lang: Python
        source: 'import requests


          url = "https://console.jumpcloud.com/api/v2/notifications/subscriptions/email"


          headers = {"x-api-key": "REPLACE_KEY_VALUE"}


          response = requests.request("GET", url, headers=headers)


          print(response.text)'
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/notifications/subscriptions/email'' -Method GET -Headers $headers'
    put:
      summary: Update the caller's email subscription preferences
      description: This endpoint updates the authenticated administrator's email subscription preferences. category and title are catalog metadata and are ignored on update.
      operationId: EmailSubscriptionsService_UpdateEmailSubscriptions
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/jumpcloud.notifications.UpdateEmailSubscriptionsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jumpcloud.notifications.UpdateEmailSubscriptionsRequest'
        description: 'UpdateEmailSubscriptionsRequest updates the authenticated admin''s

          preferences. admin identity comes from auth context only.'
        required: true
      tags:
      - Email Subscriptions
      security:
      - x-api-key: []
      x-dynamic-gateway: true
      x-scopes:
      - notifications.subscriptions
      x-codeSamples:
      - lang: Shell
        source: "curl --request PUT \\\n  --url https://console.jumpcloud.com/api/v2/notifications/subscriptions/email \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --data '{\"subscriptions\":[{\"emailKey\":\"string\",\"subscribed\":true}]}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/notifications/subscriptions/email\"\n\npayload = {\"subscriptions\": [\n        {\n            \"emailKey\": \"string\",\n            \"subscribed\": True\n        }\n    ]}\nheaders = {\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"PUT\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/notifications/subscriptions/email'' -Method PUT -Headers $headers -ContentType ''application/json'' -Body ''{"subscriptions":[{"emailKey":"string","subscribed":true}]}'''
components:
  schemas:
    jumpcloud.notifications.UpdateEmailSubscriptionsRequest:
      type: object
      properties:
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.notifications.EmailSubscription'
          description: 'Upsert semantics: each item is matched by email_key and its subscribed

            preference is updated. Keys absent from this list are NOT modified.

            Service layer owns this logic. See GIR-3659.'
      description: 'UpdateEmailSubscriptionsRequest updates the authenticated admin''s

        preferences. admin identity comes from auth context only.'
    jumpcloud.notifications.UpdateEmailSubscriptionsResponse:
      type: object
      properties:
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.notifications.EmailSubscription'
      description: 'UpdateEmailSubscriptionsResponse returns the caller''s catalog-backed

        preferences after the update.'
    jumpcloud.notifications.EmailSubscription:
      type: object
      properties:
        category:
          type: string
          description: category is catalog metadata grouping this email type (e.g. user_security).
          readOnly: true
        emailKey:
          type: string
          description: 'email_key is the catalog identifier for the email type (maps to scope_key

            when scope_type is email_key). Example: lockout-notice-admin.'
        subscribed:
          type: boolean
          description: 'subscribed indicates whether the admin is opted in to this email type.

            NOTE: proto3 bool defaults to false when omitted. Service layer MUST treat

            a missing EmailSubscription item as "no change", not as "unsubscribe".

            Clients SHOULD always populate this field explicitly. See GIR-3659.'
        title:
          type: string
          description: title is the catalog display title for this email type.
          readOnly: true
      description: 'EmailSubscription is the API representation of one catalog email type and the

        caller''s preference for it. Storage identity and scope columns are not part of

        this contract.'
    jumpcloud.notifications.ListEmailSubscriptionsResponse:
      type: object
      properties:
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/jumpcloud.notifications.EmailSubscription'
      description: ListEmailSubscriptionsResponse holds the caller's catalog-backed preferences.
  securitySchemes:
    x-api-key:
      description: API key used to authenticate requests.
      in: header
      name: x-api-key
      type: apiKey
