components:
  schemas:
    Error:
      title: Error
      type: object
      x-examples: {}
      description: ''
      properties:
        code:
          format: int32
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Error message
        status:
          type: string
          description: HTTP status description
    AgentUpdateRequest:
      type: object
      description: 'Fields for updating an agent. Include at least one recognized field;

        omitted fields are left unchanged. An empty object fails schema

        validation (`minProperties`) and returns HTTP 400. JSON `null` on a

        string field fails type validation and returns HTTP 400. Empty

        `name`, `email`, or `ownerId` values are not accepted

        (HTTP 400). Set `description` to an empty string to clear it.

        Unrecognized properties are ignored; a body with no recognized

        mutable fields returns HTTP 400. Submitted `name`, `description`,

        and `email` values are trimmed of leading and trailing whitespace

        before apply.

        '
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Agent name
        email:
          type: string
          format: email
          maxLength: 256
          description: Company email address for this agent
        description:
          type: string
          maxLength: 256
          description: Free-text description of this agent
        ownerId:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          description: 'ID of the human user who will own this agent. Must be in

            the same organization. Must be a non-null ID when present.

            '
    NullableDateTime:
      description: ISO 8601 date-time (UTC) or JSON null.
      oneOf:
      - type: string
        format: date-time
      - type: 'null'
    GraphConnection:
      description: Represents an edge between two graph objects. From can be omitted if it is clear from context.
      properties:
        attributes:
          $ref: '#/components/schemas/GraphAttributes'
        from:
          $ref: '#/components/schemas/GraphObject'
        to:
          $ref: '#/components/schemas/GraphObject'
      required:
      - to
      title: GraphConnection
      type: object
    AgentList:
      type: object
      description: List of agents.
      required:
      - agents
      properties:
        agents:
          type: array
          description: Agents matching the request.
          items:
            $ref: '#/components/schemas/Agent'
        totalSize:
          type: integer
          format: int32
          description: 'Total number of agents matching the request after filters are

            applied.

            '
        nextPageToken:
          type: string
          description: 'Opaque cursor for the next page. Omitted when there is no

            subsequent page.

            '
    AgentInboundCredential:
      type: object
      description: 'An inbound OAuth credential record. Never includes the credential

        secret.

        '
      required:
      - clientId
      - authType
      - status
      - tokenEndpointAuthMethod
      - createdAt
      - updatedAt
      - expiresAt
      properties:
        clientId:
          type: string
          description: OAuth client ID for this credential.
          readOnly: true
        authType:
          type: string
          description: Client authentication method.
          enum:
          - client_credentials
          - client_jwt_assertion
          readOnly: true
        tokenEndpointAuthMethod:
          $ref: '#/components/schemas/TokenEndpointAuthMethod'
        status:
          type: string
          description: Credential lifecycle status.
          enum:
          - active
          - retiring
          - expired
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        expiresAt:
          $ref: '#/components/schemas/NullableDateTime'
          description: 'When the credential expires (UTC). Null when the credential never

            expires.

            '
          readOnly: true
    AgentInboundCredentialCreateRequest:
      type: object
      description: 'Optional fields for inbound credential creation. Omit the request body

        or omit `lifetimeDays` to default to 365 days. Set `lifetimeDays` to

        `0` for a credential that never expires (`expiresAt` is null in the

        response). Responses do not include `lifetimeDays`; clients derive

        lifetime from `expiresAt` and `createdAt` when needed.

        '
      properties:
        lifetimeDays:
          description: 'Credential lifetime in days. When the key is absent, defaults to

            365. `0` means the credential never expires. Accepted values are

            0, 30, 60, 90, and 365.

            '
          type: integer
          enum:
          - 0
          - 30
          - 60
          - 90
          - 365
    GraphAttributes:
      additionalProperties: true
      description: The graph attributes.
      title: GraphAttributes
      type:
      - object
      - 'null'
    GraphType:
      description: A graph object type.
      enum:
      - active_directory
      - agent
      - agent_group
      - application
      - command
      - g_suite
      - idp_routing_policy
      - ldap_server
      - office_365
      - policy
      - policy_group
      - radius_server
      - password_manager_item
      - system
      - system_group
      - user
      - user_group
      title: GraphType
      type: string
    AgentCreateRequest:
      type: object
      description: Fields for registering an agent.
      required:
      - name
      - email
      - ownerId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Agent name
        email:
          type: string
          format: email
          maxLength: 256
          description: Company email address for this agent
        description:
          type: string
          maxLength: 256
          description: Free-text description of this agent
        ownerId:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          description: 'ID of the human user who will own this agent. Must be in

            the same organization.

            '
    AgentInboundCredentialWithSecret:
      type: object
      description: 'A newly created inbound OAuth credential. `clientSecret` is returned

        only in this response — store it now, since it cannot be retrieved

        again.

        '
      required:
      - clientId
      - clientSecret
      - expiresAt
      - tokenEndpointAuthMethod
      properties:
        clientId:
          type: string
          description: Hydra OAuth client ID for this credential.
        clientSecret:
          type: string
          description: One-time client secret.
        tokenEndpointAuthMethod:
          $ref: '#/components/schemas/TokenEndpointAuthMethod'
        expiresAt:
          $ref: '#/components/schemas/NullableDateTime'
          description: 'When the credential expires (UTC). Null when the credential never

            expires.

            '
    GraphObject:
      properties:
        attributes:
          $ref: '#/components/schemas/GraphAttributes'
        id:
          description: The ObjectID of the graph object.
          type: string
        type:
          description: The type of graph object.
          type: string
      required:
      - type
      - id
      title: GraphObject
      type: object
    SyncStatus:
      description: Sync status information for this object. Only present when syncStatus query parameter is true.
      type: object
      properties:
        syncedAt:
          description: The last time the object was synced.
          type: string
          format: date-time
        code:
          description: Status code of the sync operation.
          type: integer
        message:
          description: Status message of the sync operation.
          type: string
        details:
          description: Additional details about the sync status.
          type: array
          items:
            type: object
    TokenEndpointAuthMethod:
      type: string
      description: 'OAuth token endpoint client authentication method for this credential.

        Legacy rows with a NULL stored value are returned as

        `client_secret_basic`.

        '
      enum:
      - client_secret_basic
      - client_secret_post
      readOnly: true
    AgentInboundCredentialPatchRequest:
      type: object
      description: 'Mutable fields for an inbound OAuth credential update. Only the token

        endpoint authentication method can be changed through this operation.

        '
      required:
      - tokenEndpointAuthMethod
      properties:
        tokenEndpointAuthMethod:
          type: string
          description: OAuth token endpoint client authentication method.
          enum:
          - client_secret_basic
          - client_secret_post
    Agent:
      type: object
      description: 'An agent — a non-human identity that can access applications assigned

        to it. Properties marked read-only are returned on read responses and

        must not be sent on create or update.

        '
      required:
      - id
      - organizationId
      - name
      - email
      - state
      properties:
        id:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          description: Agent ID (24-character hexadecimal string).
          readOnly: true
        organizationId:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          description: Organization ID (24-character hexadecimal string).
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: Agent name
        description:
          type: string
          maxLength: 256
          description: Free-text description of this agent
        email:
          type: string
          format: email
          maxLength: 256
          description: Company email address for this agent
        ownerId:
          type: string
          nullable: true
          minLength: 24
          maxLength: 24
          pattern: ^[0-9a-fA-F]{24}$
          description: 'ID of the human user who owns this agent. Required at

            creation; becomes null only if the owning user is later deleted.

            '
        state:
          type: string
          description: Lifecycle state (`active` or `suspended`).
          enum:
          - active
          - suspended
          readOnly: true
    GraphObjectWithPaths:
      properties:
        compiledAttributes:
          $ref: '#/components/schemas/GraphAttributes'
        id:
          description: Object ID of this graph object.
          type: string
        paths:
          description: Every path through the graph from the requested object to this object. Each path lists the groupings and associations it follows; all of them would have to be removed to remove this object from the requested object.
          items:
            items:
              $ref: '#/components/schemas/GraphConnection'
            type: array
          type: array
        type:
          $ref: '#/components/schemas/GraphType'
        externalId:
          description: The external resource ID that is being synced. Only present when syncStatus query parameter is true.
          type: string
        syncStatus:
          $ref: '#/components/schemas/SyncStatus'
      required:
      - type
      - id
      - paths
      title: GraphObjectWithPaths
      type: object
    AgentInboundCredentialList:
      type: object
      description: An agent's inbound OAuth credential records.
      required:
      - credentials
      properties:
        credentials:
          type: array
          description: Credential records for this agent.
          items:
            $ref: '#/components/schemas/AgentInboundCredential'
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    trait_limit_limit:
      description: The number of records to return at once. Limited to 100.
      in: query
      name: limit
      schema:
        type: integer
        default: 10
    agentId:
      name: agent_id
      in: path
      required: true
      description: Agent object ID (24-character hexadecimal string).
      schema:
        type: string
        minLength: 24
        maxLength: 24
        pattern: ^[0-9a-fA-F]{24}$
    trait_filter_filter:
      description: 'A filter to apply to the query.


        **Filter structure**: `<field>:<operator>:<value>`.


        **field** = Populate with a valid field from an endpoint response.


        **operator** =  Supported operators are: eq, ne, gt, ge, lt, le, between, search, in.

        _Note: v1 operators differ from v2 operators._


        **value** = Populate with the value you want to search for. Is case sensitive. Supports wild cards.


        **EX:** `GET /api/v2/groups?filter=name:eq:Test+Group`'
      in: query
      name: filter
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        default: []
    trait_skip_skip:
      description: The offset into the records to return.
      in: query
      name: skip
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    sort:
      name: sort
      in: query
      required: false
      style: form
      explode: false
      description: 'The comma separated fields used to sort the collection. Default sort

        is ascending; prefix with `-` to sort descending. Supported fields

        include `name`, `email`, and `state`.

        '
      schema:
        type: array
        items:
          type: string
        default: []
    pageSize:
      name: pageSize
      in: query
      required: false
      description: 'Maximum number of records to return. When omitted or set to 0, the

        default page size (100) applies. Values above 100 are treated as 100.

        '
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 100
        default: 100
    trait_sort_sort:
      description: 'The comma separated fields used to sort the collection.

        Default sort is ascending, prefix with `-` to sort descending.

        '
      in: query
      name: sort
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
        default: []
    pageToken:
      name: pageToken
      in: query
      required: false
      description: 'Opaque cursor from a previous response''s nextPageToken. Must be used

        with the same pageSize. When omitted, results start at the beginning

        of the collection.

        '
      schema:
        type: string
    trait_multiTenantRequestHeaders_x-org-id:
      description: Organization identifier that can be obtained from console settings.
      in: header
      name: x-org-id
      schema:
        type: string
    filter:
      name: filter
      in: query
      required: false
      style: form
      explode: true
      description: 'A filter to apply to the query. Repeat the `filter` parameter for

        multiple clauses. Each value is one clause of the form

        `<field>:<operator>:<value>`.


        For the `in` operator, join values with commas. Percent-encode those

        commas as `%2C` when constructing the query string so they remain

        part of one clause.


        Supported fields include `state`, `name`, and `email`. Supported

        operators include `eq`, `ne`, `search`, and `in`.


        **EX:** `filter=state:eq:suspended`


        **EX:** `filter=email:in:alpha@example.com%2Cbeta@example.com`


        **EX:** `filter=state:eq:active&filter=name:search:bot`

        '
      schema:
        type: array
        items:
          type: string
        default: []
    organizationId:
      name: x-org-id
      in: header
      required: false
      description: Organization identifier that can be obtained from console settings.
      schema:
        type: string
        minLength: 24
        maxLength: 24
        pattern: ^[0-9a-fA-F]{24}$
    credentialClientId:
      name: client_id
      in: path
      required: true
      description: Inbound OAuth credential's client ID.
      schema:
        type: string
