openapi: 3.2.0
info:
  contact:
    name: JumpCloud Support
    url: https://jumpcloud.com/support/contact-jumpcloud-support
  description: '# Overview


    JumpCloud''s V2 API. This set of endpoints allows JumpCloud customers to manage objects, groupings and mappings and interact with the JumpCloud Graph. > **Note:** See JumpCloud Data Centers: Login URLs and Service Endpoints to learn more. ## API Best Practices


    Read the linked Help Article below for guidance on retrying failed requests to JumpCloud''s REST API, as well as best practices for structuring subsequent retry requests. Customizing retry mechanisms based on these recommendations will increase the reliability and dependability of your API calls. Covered topics include:

    1. Important Considerations

    2. Supported HTTP Request Methods

    3. Response codes

    4. API Key rotation

    5. Paginating

    6. Error handling

    7. Retry rates


    JumpCloud Help Center - API Best Practices


    # Directory Objects


    This API offers the ability to interact with some of our core features; otherwise known as Directory Objects. The Directory Objects are:


    * Commands

    * Policies

    * Policy Groups

    * Applications

    * Systems

    * Users

    * User Groups

    * System Groups

    * Radius Servers

    * Directories: Office 365, LDAP,G-Suite, Active Directory

    * Duo accounts and applications. The Directory Object is an important concept to understand in order to successfully use JumpCloud API. ## JumpCloud Graph


    We''ve also introduced the concept of the JumpCloud Graph along with Directory Objects. The Graph is a powerful aspect of our platform which will enable you to associate objects with each other, or establish membership for certain objects to become members of other objects. Specific `GET` endpoints will allow you to traverse the JumpCloud Graph to return all indirect and directly bound objects in your organization. | !alt text |

    |:--:|

    | **This diagram highlights our association and membership model as it relates to Directory Objects.** |


    # API Key


    ## Access Your API Key


    To locate your API Key:


    1. Log into the JumpCloud Admin Console. 2. Go to the username drop down located in the top-right of the Console. 3. Retrieve your API key from API Settings. ## API Key Considerations


    This API key is associated to the currently logged in administrator. Other admins will have different API keys. **WARNING** Please keep this API key secret, as it grants full access to any data accessible via your JumpCloud console account. You can also reset your API key in the same location in the JumpCloud Admin Console. ## Recycling or Resetting Your API Key


    In order to revoke access with the current API key, simply reset your API key. This will render all calls using the previous API key inaccessible. Your API key will be passed in as a header with the header name "x-api-key". ```bash

    curl -H "x-api-key: [YOUR_API_KEY_HERE]" "https://console.jumpcloud.com/api/v2/systemgroups"

    ```


    # System Context


    * Introduction

    * Supported endpoints

    * Response codes

    * Authentication

    * Additional examples

    * Third party


    ## Introduction


    JumpCloud System Context Authorization is an alternative way to authenticate with a subset of JumpCloud''s REST APIs. Using this method, a system can manage its information and resource associations, allowing modern auto provisioning environments to scale as needed. **Notes:**


    * The following documentation applies to Linux Operating Systems only. * Systems that have been automatically enrolled using Apple''s Device Enrollment Program (DEP) or systems enrolled using the User Portal install are not eligible to use the System Context API to prevent unauthorized access to system groups and resources. If a script that utilizes the System Context API is invoked on a system enrolled in this way, it will display an error. ## Supported Endpoints


    JumpCloud System Context Authorization can be used in conjunction with Systems endpoints found in the V1 API and certain System Group endpoints found in the v2 API.'
  title: JumpCloud Agents API
  version: '2.0'
servers:
- url: https://console.jumpcloud.com/api/v2
  description: United States (US)
  x-jc-region: us
- url: https://console.eu.jumpcloud.com/api/v2
  description: European Union (EU)
  x-jc-region: eu
- url: https://console.in.jumpcloud.com/api/v2
  description: India (IN)
  x-jc-region: in
tags:
- name: Agents
  description: 'Use the Agents API to register and manage AI agents in your organization.

    An AI agent is a non-human identity with its own owner, credentials, group

    memberships, resource assignments, and lifecycle.


    New agents begin in the active state. Suspend an agent to block its access

    to assigned resources, including the JumpCloud AI Gateway. Activate the

    agent to restore access.'
paths:
  /agents:
    get:
      tags:
      - Agents
      summary: List agents
      description: Retrieves a paginated list of agents in your organization.
      operationId: getApiV2Agents
      x-scopes:
      - agents
      - agents.readonly
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/fields'
      responses:
        '200':
          description: Agents retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url 'https://console.jumpcloud.com/api/v2/agents?pageSize=SOME_INTEGER_VALUE&pageToken=SOME_STRING_VALUE&filter=SOME_ARRAY_VALUE&sort=SOME_ARRAY_VALUE&fields=SOME_ARRAY_VALUE' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/agents\"\n\nquerystring = {\"pageSize\":\"SOME_INTEGER_VALUE\",\"pageToken\":\"SOME_STRING_VALUE\",\"filter\":\"SOME_ARRAY_VALUE\",\"sort\":\"SOME_ARRAY_VALUE\",\"fields\":\"SOME_ARRAY_VALUE\"}\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers, params=querystring)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/agents?pageSize=SOME_INTEGER_VALUE&pageToken=SOME_STRING_VALUE&filter=SOME_ARRAY_VALUE&sort=SOME_ARRAY_VALUE&fields=SOME_ARRAY_VALUE'' -Method GET -Headers $headers'
    post:
      tags:
      - Agents
      summary: Register an agent
      description: Registers a new agent identity in your organization.
      operationId: postApiV2Agents
      x-scopes:
      - agents
      - agents.create
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreateRequest'
      responses:
        '201':
          description: Agent created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          description: 'Bad request. Including a read-only property from

            [Agent](#componentschemasagent) returns HTTP 400. When the

            organization has reached its agent limit, `status` is

            `agentOrgCapExceeded`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: An agent with a conflicting attribute already exists (for example email)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/agents \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '{\"name\":\"string\",\"email\":\"user@example.com\",\"description\":\"string\",\"ownerId\":\"stringstringstringstring\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/agents\"\n\npayload = {\n    \"name\": \"string\",\n    \"email\": \"user@example.com\",\n    \"description\": \"string\",\n    \"ownerId\": \"stringstringstringstring\"\n}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/agents'' -Method POST -Headers $headers -ContentType ''application/json'' -Body ''{"name":"string","email":"user@example.com","description":"string","ownerId":"stringstringstringstring"}'''
  /agents/{agent_id}:
    get:
      tags:
      - Agents
      summary: Retrieve an agent
      description: Retrieves an agent in your organization.
      operationId: getApiV2AgentsById
      x-scopes:
      - agents
      - agents.readonly
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/agentId'
      responses:
        '200':
          description: Agent retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url https://console.jumpcloud.com/api/v2/agents/{agent_id} \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/agents/{agent_id}\"\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/agents/{agent_id}'' -Method GET -Headers $headers'
    patch:
      tags:
      - Agents
      summary: Update an agent
      description: Updates an agent in your organization. Omitted fields are left unchanged.
      operationId: patchApiV2AgentsById
      x-scopes:
      - agents
      - agents.update
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/agentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdateRequest'
      responses:
        '200':
          description: Agent updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          description: 'Bad request — validation failure. The `status` field carries a stable

            machine code in lowerCamelCase (aligned with JSON field names);

            `message` describes the failure for humans. Common codes include

            `nullName`, `invalidName`, `invalidEmail`, `invalidOwnerId`,

            `invalidOwner`, `stateNotUpdatable`, `ownerIdClearForbidden`, and

            `emptyPatch`.

            Including a read-only property from

            [Agent](#componentschemasagent) also returns HTTP 400.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                nullName:
                  summary: JSON null on name
                  value:
                    message: name cannot be null
                    status: nullName
                nullDescription:
                  summary: JSON null on description
                  value:
                    message: description cannot be null
                    status: nullDescription
                emptyName:
                  summary: Empty or whitespace-only name
                  value:
                    message: name cannot be empty or whitespace-only
                    status: invalidName
                invalidOwnerId:
                  summary: Malformed ownerId
                  value:
                    message: ownerId must be a 24-character hexadecimal object id
                    status: invalidOwnerId
                invalidOwner:
                  summary: Owner is not an activated human in org
                  value:
                    message: ownerId must be an activated SystemUser in this organization
                    status: invalidOwner
                stateNotUpdatable:
                  summary: Lifecycle state in PATCH body
                  value:
                    message: state cannot be changed with PATCH; use suspend or activate
                    status: stateNotUpdatable
                emptyPatch:
                  summary: No mutable fields in body
                  value:
                    message: patch body must include at least one mutable field
                    status: emptyPatch
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: An agent with a conflicting attribute already exists (for example email)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                emailConflict:
                  summary: Email already in use
                  value:
                    message: email is already in use
                    status: emailConflict
        default:
          $ref: '#/components/responses/Error'
      x-codeSamples:
      - lang: Shell
        source: "curl --request PATCH \\\n  --url https://console.jumpcloud.com/api/v2/agents/{agent_id} \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '{\"name\":\"string\",\"email\":\"user@example.com\",\"description\":\"string\",\"ownerId\":\"stringstringstringstring\"}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/agents/{agent_id}\"\n\npayload = {\n    \"name\": \"string\",\n    \"email\": \"user@example.com\",\n    \"description\": \"string\",\n    \"ownerId\": \"stringstringstringstring\"\n}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"PATCH\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $headers.Add("content-type", "application/json")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/agents/{agent_id}'' -Method PATCH -Headers $headers -ContentType ''application/json'' -Body ''{"name":"string","email":"user@example.com","description":"string","ownerId":"stringstringstringstring"}'''
    delete:
      tags:
      - Agents
      summary: Delete an agent
      description: Permanently deletes an agent in your organization.
      operationId: deleteApiV2AgentsById
      x-scopes:
      - agents
      - agents.delete
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/agentId'
      responses:
        '204':
          description: Agent deleted successfully. Already-issued gateway access tokens stay valid until they expire or are revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      x-codeSamples:
      - lang: Shell
        source: "curl --request DELETE \\\n  --url https://console.jumpcloud.com/api/v2/agents/{agent_id} \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/agents/{agent_id}\"\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"DELETE\", url, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/agents/{agent_id}'' -Method DELETE -Headers $headers'
  /agents/{agent_id}/suspend:
    post:
      tags:
      - Agents
      summary: Suspend an agent
      description: Suspends an agent in your organization. Suspended agents are blocked from accessing JumpCloud resources.
      operationId: postApiV2AgentsByIdSuspend
      x-scopes:
      - agents
      - agents.state
      - agents.state.suspend
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/agentId'
      responses:
        '200':
          description: Agent suspended successfully. Already-issued gateway access tokens stay valid until they expire or are revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
              examples:
                suspended:
                  summary: Suspended agent
                  value:
                    id: 507f1f77bcf86cd799439011
                    organizationId: 507f191e810c19729de860ea
                    name: example-agent
                    description: Example agent
                    email: example-agent@example.com
                    ownerId: 507f1f77bcf86cd799439012
                    state: suspended
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/agents/{agent_id}/suspend \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/agents/{agent_id}/suspend\"\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"POST\", url, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/agents/{agent_id}/suspend'' -Method POST -Headers $headers'
  /agents/{agent_id}/activate:
    post:
      tags:
      - Agents
      summary: Activate an agent
      description: Activates a previously suspended agent in your organization.
      operationId: postApiV2AgentsByIdActivate
      x-scopes:
      - agents
      - agents.state
      - agents.state.activate
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/agentId'
      responses:
        '200':
          description: Agent activated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
              examples:
                active:
                  summary: Active agent
                  value:
                    id: 507f1f77bcf86cd799439011
                    organizationId: 507f191e810c19729de860ea
                    name: example-agent
                    description: Example agent
                    email: example-agent@example.com
                    ownerId: 507f1f77bcf86cd799439012
                    state: active
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/agents/{agent_id}/activate \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/agents/{agent_id}/activate\"\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"POST\", url, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/agents/{agent_id}/activate'' -Method POST -Headers $headers'
  /agents/{agent_id}/inbound-credentials:
    get:
      tags:
      - Agents
      summary: List agent's credentials
      description: Retrieves a list of credentials for the agent. Credential secrets are never returned.
      operationId: getApiV2AgentsByIdCredentials
      x-scopes:
      - agents
      - agents.credentials.readonly
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/agentId'
      responses:
        '200':
          description: Credentials retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInboundCredentialList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
      x-codeSamples:
      - lang: Shell
        source: "curl --request GET \\\n  --url https://console.jumpcloud.com/api/v2/agents/{agent_id}/inbound-credentials \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/agents/{agent_id}/inbound-credentials\"\n\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\"\n}\n\nresponse = requests.request(\"GET\", url, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

          $headers.Add("x-org-id", "SOME_STRING_VALUE")

          $headers.Add("x-api-key", "REPLACE_KEY_VALUE")

          $response = Invoke-RestMethod -Uri ''https://console.jumpcloud.com/api/v2/agents/{agent_id}/inbound-credentials'' -Method GET -Headers $headers'
    post:
      tags:
      - Agents
      summary: Create an agent credential
      description: Creates the OAuth 2.0 credential for an agent in your organization.
      operationId: postApiV2AgentsByIdCredentials
      x-scopes:
      - agents
      - agents.credentials.update
      security:
      - x-api-key: []
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/agentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentInboundCredentialCreateRequest'
      responses:
        '201':
          description: Credential created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInboundCredentialWithSecret'
        '400':
          description: 'Bad request — validation failure. Common codes include

            `invalidLifetimeDays` and `invalid json`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidLifetimeDays:
                  summary: Unsupported lifetimeDays integer
                  value:
                    message: 'lifetimeDays must be one of: 0, 30, 60, 90, 365'
                    status: invalidLifetimeDays
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'The request conflicts with the agent''s current state. The agent

            already has an active credential, or the agent is suspended.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
      x-codeSamples:
      - lang: Shell
        source: "curl --request POST \\\n  --url https://console.jumpcloud.com/api/v2/agents/{agent_id}/inbound-credentials \\\n  --header 'content-type: application/json' \\\n  --header 'x-api-key: REPLACE_KEY_VALUE' \\\n  --header 'x-org-id: SOME_STRING_VALUE' \\\n  --data '{\"lifetimeDays\":0}'"
      - lang: Python
        source: "import requests\n\nurl = \"https://console.jumpcloud.com/api/v2/agents/{agent_id}/inbound-credentials\"\n\npayload = {\"lifetimeDays\": 0}\nheaders = {\n    \"x-org-id\": \"SOME_STRING_VALUE\",\n    \"x-api-key\": \"REPLACE_KEY_VALUE\",\n    \"content-type\": \"application/json\"\n}\n\nresponse = requests.request(\"POST\", url, json=payload, headers=headers)\n\nprint(response.text)"
      - lang: Powershell
        source: '$headers=@{}

