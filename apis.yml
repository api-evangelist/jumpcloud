aid: jumpcloud
name: JumpCloud
description: JumpCloud is an open directory platform that unifies identity, access, and device management
  across users, devices, networks, and SaaS applications. Its cloud directory supports SSO, MFA, device
  management (MDM), conditional access policies, RADIUS, LDAP, and HR system integration. JumpCloud's
  REST APIs (V1 and V2) provide programmatic access to users, groups, systems, policies, applications,
  and directory insights for IT automation.
