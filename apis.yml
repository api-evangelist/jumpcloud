apis:
  - aid: jumpcloud:v1-api
    name: JumpCloud API V1
    description: >-
      REST API for managing core directory resources including users, systems,
      system users, tags, commands, policies, and SSO applications. Uses API
      key authentication via the x-api-key header.
    humanURL: https://docs.jumpcloud.com/api/1.0/index.html
    baseURL: https://console.jumpcloud.com/api
    tags:
      - Identity
      - Directory Services
      - Users
      - Systems
      - Policies
    properties:
      - type: Documentation
        url: https://docs.jumpcloud.com/api/1.0/index.html
  - aid: jumpcloud:v2-api
    name: JumpCloud API V2
    description: >-
      REST API V2 for managing groups, group memberships, associations,
      directory insights, system insights, organizations, and modern policies.
      Uses API key authentication via the x-api-key header.
    humanURL: https://docs.jumpcloud.com/api/2.0/index.html
    baseURL: https://console.jumpcloud.com/api/v2
    tags:
      - Identity
      - Groups
      - Associations
      - Directory Insights
    properties:
      - type: Documentation
        url: https://docs.jumpcloud.com/api/2.0/index.html
  - aid: jumpcloud:system-context-api
    name: JumpCloud System Context API
    description: >-
      API for managed systems to interact with JumpCloud on their own behalf
      using HTTP Signatures authentication. Used for system-initiated actions
      such as user provisioning and event reporting.
    humanURL: https://docs.jumpcloud.com/api/systemcontext/index.html
    baseURL: https://console.jumpcloud.com/api/systems
    tags:
      - Systems
      - Agents
      - HTTP Signatures
    properties:
      - type: Documentation
        url: https://docs.jumpcloud.com/api/systemcontext/index.html
      - type: GitHub
        url: https://github.com/TheJumpCloud/SystemContextAPI
