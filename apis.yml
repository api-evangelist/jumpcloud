- aid: jumpcloud:jumpcloud-agent-groups-api
  name: JumpCloud Agent Groups API
  description: >-
    Use the Agent Groups API to create and manage agent groups in your organization. Agent groups organize
    agents and provide a reusable way to assign applications to multiple agents.


    Add or remove agents from a group, manage the group's application assignments, and retrieve the agents
    and applications assigned to the group. Agents receive access to applications assigned to their groups.
  humanURL: https://docs.jumpcloud.com/api/1.0/index.html
  baseURL: https://console.jumpcloud.com/api
  tags:
  - Agent Groups
  properties:
  - type: OpenAPI
    url: openapi/jumpcloud-agent-groups-api-openapi.yml
- aid: jumpcloud:jumpcloud-agents-api
  name: JumpCloud Agents API
  description: >-
    Use the Agents API to register and manage AI agents in your organization.

    An AI agent is a non-human identity with its own owner, credentials, group

    memberships, resource assignments, and lifecycle.


    New agents begin in the active state. Suspend an agent to block its access

    to assigned resources, including the JumpCloud AI Gateway. Activate the

    agent to restore access.
  humanURL: https://docs.jumpcloud.com/api/1.0/index.html
  baseURL: https://console.jumpcloud.com/api
  tags:
  - Agents
